<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>params_v2</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 16px; }
    .big { font-size: 20px; font-weight: 700; margin: 10px 0; }
    pre { background:#f3f3f3; padding:12px; border-radius:8px; overflow:auto; }
    .red { color:#d00; font-weight:700; }
  </style>
</head>
<body>
  <div class="big">params_v2 debug</div>
  <div id="status">loading...</div>
  <pre id="out"></pre>

<script>
  function getParam(name) {
    const u = new URL(window.location.href);
    return u.searchParams.get(name) || "";
  }

  function sendToThunkable(obj) {
    const msg = JSON.stringify(obj);

    // Thunkable WebViewer用：これが本命
    if (window.ThunkableWebviewerExtension && typeof ThunkableWebviewerExtension.postMessage === "function") {
      ThunkableWebviewerExtension.postMessage(msg);
      return true;
    }

    // 保険：ブラウザ単体で開いた時用（Thunkableでは基本使わない）
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(msg, "*");
      return true;
    }

    return false;
  }

  function main() {
    const shop = getParam("shop");
    const table = getParam("table");

    const payload = {
      type: "PARAMS",
      shop,
      table,
      href: window.location.href,
      ts: Date.now()
    };

    const ok = sendToThunkable(payload);

    document.getElementById("out").textContent = JSON.stringify(payload, null, 2);
    document.getElementById("status").innerHTML =
      ok ? "✅ sent to Thunkable (postMessage OK)" : "<span class='red'>❌ Thunkable extension not found (postMessageできてない)</span>";
  }

  // iOS/Thunkableで確実に走らせるため少し遅延
  window.addEventListener("load", () => setTimeout(main, 300));
</script>
</body>
</html>
