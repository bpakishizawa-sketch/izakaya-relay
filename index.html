<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>izakaya-relay</title>
</head>
<body style="margin:0">
  <div id="msg" style="padding:16px;font-family:sans-serif;white-space:pre-wrap;">
    読み込み中…
  </div>

<script>
const FIREBASE_DB_URL = "https://izakayaorder-default-rtdb.firebaseio.com";
const THUNKABLE_URL   = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH";
const msg = (t) => document.getElementById("msg").textContent = t;

const params = new URLSearchParams(location.search);
const shop  = params.get("shop");
const table = params.get("table");

if (!shop || !table) {
  msg("missing params: shop / table\n例: ?shop=daboya&table=1");
  throw new Error("missing params");
}

// 毎回変わるトークン（衝突しにくい）
const token = `${shop}-${table}-${crypto.randomUUID()}`;

// 期限（例：2時間） ※好きに変更OK
const expiresAt = Date.now() + (2 * 60 * 60 * 1000);

const sessionPayload = { shop, table, token, createdAt: Date.now(), expiresAt };

// ★複数同時OK：table配下に token をぶら下げる（上書きしない）
const activePayload  = { createdAt: Date.now(), expiresAt };

const sessionUrl = `${FIREBASE_DB_URL}/webSessions/${encodeURIComponent(token)}.json`;
const activeUrl  = `${FIREBASE_DB_URL}/webActiveSessions/${encodeURIComponent(shop)}/${encodeURIComponent(table)}/${encodeURIComponent(token)}.json`;

msg("セッション作成中…");

Promise.all([
  fetch(sessionUrl, { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(sessionPayload) }),
  fetch(activeUrl,  { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(activePayload)  })
])
.then(async (results) => {
  for (const r of results) if (!r.ok) throw new Error(await r.text());
  msg("OK。注文ページへ移動…");

  // Thunkableへ token も渡す（これが一番ラクで確実）
  location.replace(`${THUNKABLE_URL}#shop=${encodeURIComponent(shop)}&table=${encodeURIComponent(table)}&token=${encodeURIComponent(token)}`);
})
.catch((e) => {
  console.error(e);
  msg("Firebase書き込み失敗。Rules/URL/CORSを確認。");
});
</script>
</body>
</html>
