<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>izakaya-relay</title>
</head>
<body style="margin:0">
  <div id="msg" style="padding:16px;font-family:sans-serif;white-space:pre-wrap;">読み込み中…</div>

<script>
(() => {
  const FIREBASE_DB_URL = "https://izakayaorder-default-rtdb.firebaseio.com";
  const THUNKABLE_URL   = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH";

  const msg = (t) => document.getElementById("msg").textContent = t;
  const enc = encodeURIComponent;

  const params = new URLSearchParams(location.search);
  const shop  = params.get("shop");
  const table = params.get("table");

  if (!shop || !table) {
    msg("missing params: shop / table\n例: ?shop=daboya&table=1");
    return;
  }

  const activeUrl = `${FIREBASE_DB_URL}/webActiveSessions/${enc(shop)}/${enc(table)}.json`;

  const token4 = () => String(Math.floor(Math.random() * 10000)).padStart(4, "0");
  const rand6  = () => Math.random().toString(16).slice(2, 8);

  const GET = async (url) => {
    const r = await fetch(url, { method:"GET" });
    const t = await r.text();
    if (!r.ok) throw new Error(t || ("HTTP " + r.status));
    return t ? JSON.parse(t) : null; // null or object
  };

  const PUT = async (url, obj) => {
    const r = await fetch(url, {
      method:"PUT",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(obj)
    });
    const t = await r.text();
    if (!r.ok) throw new Error(t || ("HTTP " + r.status));
    return true;
  };

  const goThunkable = () => {
    // どっちでも拾えるように「query + hash」両方付ける
    const qs = `shop=${enc(shop)}&table=${enc(table)}`;
    location.replace(`${THUNKABLE_URL}?${qs}#${qs}`);
  };

  (async () => {
    msg("active確認中…");

    const active = await GET(activeUrl);

    // ✅ 既にactiveがある→上書きしない（会計まで固定）
    if (active && active.token) {
      msg(`既存セッション使用\nshop=${shop} table=${table}\ntoken4=${active.token4 || ""}\n\n注文ページへ移動…`);
      goThunkable();
      return;
    }

    // ✅ 無い→初回だけ作成
    const t4 = token4();
    const token = `${shop}-${table}-${t4}-${rand6()}`; // keyは衝突しにくく、token4は短い

    const activePayload  = { token, token4: t4, updatedAt: Date.now() };
    const sessionPayload = { shop, table, token, token4: t4, createdAt: Date.now() };

    const sessionUrl = `${FIREBASE_DB_URL}/webSessions/${enc(token)}.json`;

    msg(`初回セッション作成中…\nshop=${shop} table=${table}\ntoken4=${t4}`);

    await Promise.all([
      PUT(activeUrl,  activePayload),
      PUT(sessionUrl, sessionPayload)
    ]);

    msg("OK。注文ページへ移動…");
    goThunkable();
  })().catch((e) => {
    console.error(e);
    msg("失敗。\nRules/URL/パスを確認。\n" + (e && e.message ? e.message : String(e)));
  });
})();
</script>
</body>
</html>
