<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>izakaya-relay</title>
</head>
<body style="margin:0">

<script>
  const THUNKABLE_URL = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH";

  const params = new URLSearchParams(location.search);
  const payload = {
    shop:  params.get("shop"),
    table: params.get("table"),
    token: params.get("token"),
  };

  if (!payload.shop || !payload.table || !payload.token) {
    document.body.innerHTML = "missing params: shop/table/token";
    throw new Error("missing params");
  }

  // Thunkableを埋め込み起動
  const iframe = document.createElement("iframe");
  iframe.src = THUNKABLE_URL;
  iframe.style.width = "100vw";
  iframe.style.height = "100vh";
  iframe.style.border = "0";
  document.body.appendChild(iframe);

  // 起動後に Thunkable へ送る
  iframe.onload = () => {
    iframe.contentWindow.postMessage(payload, "*");
  };
</script>

</body>
</html>
