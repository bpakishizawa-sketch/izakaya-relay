<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>shop login</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px;max-width:720px;margin:0 auto}
    input,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #ccc}
    button{cursor:pointer;border:0;font-weight:800}
    .row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
    .btn{background:#111827;color:#fff}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0}
    .ok{color:#16a34a;font-weight:800}
    .ng{color:#dc2626;font-weight:800}
    a{display:inline-block;padding:12px 14px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800;margin:6px 6px 0 0}
    .muted{color:#6b7280;font-size:12px}
  </style>
</head>
<body>
  <h2>店側ログイン</h2>

  <div class="card">
    <div class="row">
      <input id="shop" placeholder="shopコード（例：daboya）" style="flex:1;min-width:240px">
      <input id="pin"  placeholder="スタッフPIN" style="width:160px" inputmode="numeric">
      <button id="btnLogin" class="btn">ログイン</button>
    </div>
    <div id="msg" class="muted">この端末を店用としてログインします。</div>
  </div>

  <div id="menu" class="card" style="display:none;">
    <div class="ok">ログイン中：<span id="who"></span></div>
    <div style="margin-top:10px">
      <a href="menu.html">メニューへ</a>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnLogout" style="background:#ef4444;color:#fff">ログアウト</button>
    </div>
  </div>

  <!-- 共通JS（localStorage版） -->
  <script src="shop_common.js"></script>

  <script>
    function showMenu(){
      const shop = getShop();
      const pin  = getPin();
      if(shop && pin){
        document.getElementById("menu").style.display = "block";
        document.getElementById("who").textContent = `${shop} / PIN ****`;
      }else{
        document.getElementById("menu").style.display = "none";
      }
    }

    // すでにログイン済みならメニュー表示
    showMenu();

    document.getElementById("btnLogin").onclick = async () => {
      const shop = document.getElementById("shop").value.trim();
      const pin  = document.getElementById("pin").value.trim();

      if(!shop || !pin){
        document.getElementById("msg").innerHTML = `<span class="ng">shop と PIN を入れてください</span>`;
        return;
      }

      try{
        document.getElementById("btnLogin").disabled = true;
        document.getElementById("msg").innerHTML = `<span class="muted">照合中...</span>`;

        // ✅ staffPin をFBRDから取得して照合
        const r = await rtdbGet(`shops/${encodeURIComponent(shop)}/staffPin`);
        if(!r.ok){
          document.getElementById("msg").innerHTML =
            `<span class="ng">PIN取得に失敗</span> <span class="muted">(HTTP ${r.status})</span>`;
          document.getElementById("btnLogin").disabled = false;
          return;
        }

        const staffPin = (r.json ?? "");
        if(String(staffPin).trim() !== String(pin).trim()){
          document.getElementById("msg").innerHTML = `<span class="ng">PINが違います</span>`;
          document.getElementById("btnLogin").disabled = false;
          return;
        }

        // ✅ 一致したらログイン保存（localStorage）
        lsSetShopLogin(shop, pin);

        document.getElementById("msg").innerHTML = `<span class="ok">ログインしました</span>`;
        showMenu();
        location.href = `menu.html?v=${Date.now()}`;

      }catch(e){
        document.getElementById("msg").innerHTML = `<span class="ng">エラー</span> <span class="muted">${String(e.message||e)}</span>`;
        document.getElementById("btnLogin").disabled = false;
      }
    };

    document.getElementById("btnLogout").onclick = () => {
      lsClearShopLogin();
      location.reload();
    };
  </script>
</body>
</html>
