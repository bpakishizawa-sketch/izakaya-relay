<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>shop login</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px;max-width:720px;margin:0 auto}
    input,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #ccc}
    button{cursor:pointer;border:0;font-weight:800}
    .row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
    .btn{background:#111827;color:#fff}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0}
    .ok{color:#16a34a;font-weight:800}
    .ng{color:#dc2626;font-weight:800}
    a{display:inline-block;padding:12px 14px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800;margin:6px 6px 0 0}
    .muted{color:#6b7280;font-size:12px}
  </style>
</head>
<body>
  <h2>店側ログイン</h2>

  <div class="card">
    <div class="row">
      <input id="shop" placeholder="shopコード（例：daboya）" style="flex:1;min-width:240px">
      <input id="pin"  placeholder="PIN（例：1111）" style="width:160px" inputmode="numeric">
      <button id="btnLogin" class="btn">ログイン</button>
    </div>
    <div id="msg" class="muted">端末ごとにログインします（厨房／会計で分けてもOK）。</div>
  </div>

  <div id="menu" class="card" style="display:none;">
    <div class="ok">ログイン中：<span id="who"></span></div>
    <div style="margin-top:10px">
      <a href="orders.html">注文（厨房）</a>
      <a href="checkout.html">会計</a>
      <a href="qr.html">QR印刷</a>
      <a href="menu.html">メニュー編集</a>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnLogout" style="background:#ef4444;color:#fff">ログアウト</button>
    </div>
  </div>

  <!-- 共通JS -->
  <script src="shop_common.js"></script>

  <script>
    function showMenu(){
      const shop = getShop();
      const pin  = getPin();
      if(shop && pin){
        document.getElementById("menu").style.display = "block";
        document.getElementById("who").textContent = `${shop} / PIN ****`;
      }
    }

    // すでにログイン済みならメニュー表示
    showMenu();

    document.getElementById("btnLogin").onclick = async () => {
      const shop = document.getElementById("shop").value.trim();
      const pin  = document.getElementById("pin").value.trim();

      if(!shop || !pin){
        document.getElementById("msg").innerHTML = `<span class="ng">shop と PIN を入れてください</span>`;
        return;
      }

      // いまは「PINの正誤チェック」をDBに持たせても良いが、まずは端末保存だけで運用開始OK
      // 後で master/shops/{shop}/pin などを見て照合する形に拡張できる
      ssSet("shop", shop);
      ssSet("pin",  pin);

      document.getElementById("msg").innerHTML = `<span class="ok">ログインしました</span>`;
      showMenu();
    };

    document.getElementById("btnLogout").onclick = () => {
      ssClear();
      location.reload();
    };
  </script>
</body>
</html>
