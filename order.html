<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注文</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:16px; max-width:980px; margin:0 auto; background:#f6f7f9;}
    h1{font-size:20px;margin:0 0 10px}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:12px 0;background:#fff;}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .grid2{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:860px){ .grid2{grid-template-columns:1fr 1fr;} }

    select,input,button{font-size:16px;padding:10px;border-radius:10px}
    select,input{border:1px solid #d1d5db;background:#fff}
    input{width:100%;box-sizing:border-box}
    button{cursor:pointer;border:0;font-weight:900}
    .btn{background:#2563eb;color:#fff;width:100%}
    .btn2{background:#e5e7eb;color:#111827;width:100%}
    .danger{background:#dc2626;color:#fff;width:100%}
    .dark{background:#111827;color:#fff}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .muted{color:#6b7280;font-size:12px}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid #ddd;font-weight:900;font-size:12px}
    .pillD{background:#dbeafe;border-color:#3b82f6}
    .pillF{background:#dcfce7;border-color:#16a34a}
    .hr{height:1px;background:#eee;margin:12px 0}

    /* cart */
    .cartItem{border:1px solid #e5e7eb;border-radius:12px;padding:10px}
    .cartTop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
    .name{font-weight:900}
    .right{margin-left:auto}
    .qtyBox{display:flex;gap:8px;align-items:center}
    .qtyBtn{padding:8px 10px;border-radius:10px;border:1px solid #d1d5db;background:#fff;font-weight:900}
    .qtyNum{min-width:28px;text-align:center;font-weight:900}
    .sumBig{font-size:22px;font-weight:900}

    /* history */
    .histItem{border:1px solid #e5e7eb;border-radius:12px;padding:10px}
    .histHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
    .histTitle{font-weight:900}
    .histLines{margin-top:8px;font-size:14px}
    .line{display:flex;gap:8px;justify-content:space-between;border-top:1px dashed #eee;padding-top:6px;margin-top:6px}
    .line:first-child{border-top:0;padding-top:0;margin-top:0}

    /* hold */
    .holdWrap{position:relative; width:100%;}
    .holdBar{
      position:absolute; left:0; top:0; height:100%; width:0%;
      background: rgba(255,255,255,.25);
      border-radius:10px;
      pointer-events:none;
      transition: width .05s linear;
    }
    .holdBtn{
      position:relative; width:100%;
      display:block;
      text-align:center;
      user-select:none;
      -webkit-user-select:none;
      touch-action: manipulation;
    }

    details summary{cursor:pointer;font-weight:900;color:#374151}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}
  </style>
</head>
<body>
  <h1>注文</h1>

  <div class="card">
    <div class="row">
      <span class="pill">shop: <b id="shopText" class="mono">-</b></span>
      <span class="pill">table: <b id="tableText" class="mono">-</b></span>
      <span class="pill">token: <b id="tokenText" class="mono">-</b></span>
      <button id="btnBack" class="btn2" style="width:auto">← 戻る</button>
    </div>
    <div id="status" class="muted">-</div>
    <div id="checkoutBanner" class="muted" style="margin-top:8px; display:none;">
      <span class="ok">会計依頼済み</span> 店員さんがお会計処理をします。必要ならこのまま画面を閉じてOKです。
    </div>
  </div>

  <div class="grid2">
    <!-- left: menu select + add -->
    <div class="card">
      <div style="font-weight:900;margin-bottom:8px;">メニュー</div>

      <div class="row">
        <select id="catSel" style="width:180px">
          <option value="drink">ドリンク</option>
          <option value="food">フード</option>
        </select>

        <select id="itemSel" style="flex:1;min-width:240px">
          <option value="">（読み込み中…）</option>
        </select>

        <input id="qtyInp" type="number" min="1" value="1" style="width:120px" inputmode="numeric" />
      </div>

      <div class="row">
        <button id="btnAdd" class="btn">カートに追加</button>
      </div>

      <div class="hr"></div>

      <div class="row">
        <button id="btnReloadMenu" class="btn2">メニュー再読み込み</button>
      </div>

      <div class="muted" style="margin-top:8px;">
        ※プルダウンは「ID：名前（価格）」で出します。
      </div>
    </div>

    <!-- right: cart -->
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:900">買い物カゴ</div>
        <div class="muted">件数: <span id="cartCount" class="mono">0</span></div>
      </div>

      <div id="cartList" style="margin-top:10px;"></div>

      <div class="hr"></div>

      <div class="row" style="justify-content:space-between">
        <div class="muted">合計</div>
        <div class="sumBig mono" id="cartSum">0</div>
      </div>

      <div class="row" style="margin-top:10px">
        <button id="btnSend" class="dark" style="width:100%">注文を送信</button>
      </div>

      <div class="row">
        <button id="btnClearCart" class="btn2" style="width:100%">カートを空にする</button>
      </div>

      <div id="sendMsg" class="muted" style="margin-top:8px;">-</div>
    </div>
  </div>

  <!-- history + checkout -->
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div style="font-weight:900">注文履歴（このtoken）</div>
      <div class="muted">件数: <span id="histCount" class="mono">0</span></div>
    </div>

    <div class="row" style="justify-content:space-between; margin-top:6px;">
      <div class="muted">累計合計</div>
      <div class="sumBig mono" id="histSum">0</div>
    </div>

    <div id="histList" style="margin-top:10px;"></div>

    <div class="hr"></div>

    <div style="font-weight:900;margin-bottom:6px;">お会計（長押し 1.2秒）</div>
    <div class="muted" style="margin-bottom:10px;">
      送信内容：テーブル / token / 注文履歴 / 累計合計 / お会計依頼時刻 を保存します（店側が読み込み）。
    </div>

    <div class="holdWrap">
      <div class="holdBar" id="holdBar"></div>
      <button id="btnCheckout" class="danger holdBtn">長押しでお会計を依頼</button>
    </div>

    <div class="muted" id="checkoutMsg" style="margin-top:8px;">-</div>
  </div>

  <details class="card">
    <summary>デバッグ（必要な時だけ）</summary>
    <pre id="debug">-</pre>
  </details>

<script>
/** ====== 設定ここだけ ====== */
const RTDB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
/** ========================= */

const $ = (id)=>document.getElementById(id);

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function getParam(name){
  const u = new URL(location.href);
  return (u.searchParams.get(name) || "").trim();
}

function yen(n){
  const x = Number(n||0);
  return x.toLocaleString("ja-JP") + " 円";
}

async function rtdbGet(path){
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url, { method:"GET" });
  const txt = await res.text();
  let json = null;
  try{ json = txt ? JSON.parse(txt) : null; }catch{ json = null; }
  return { ok: res.ok, status: res.status, json, url, raw: txt };
}

async function rtdbPut(path, data){
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(data)
  });
  const txt = await res.text();
  let json = null;
  try{ json = txt ? JSON.parse(txt) : null; }catch{ json = null; }
  return { ok: res.ok, status: res.status, json, url, raw: txt };
}

async function rtdbPost(path, data){
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(data)
  });
  const txt = await res.text();
  let json = null;
  try{ json = txt ? JSON.parse(txt) : null; }catch{ json = null; }
  return { ok: res.ok, status: res.status, json, url, raw: txt };
}

function parseMenuValue(v){
  if(v && typeof v === "object"){
    return { name: String(v.name ?? ""), price: Number(v.price ?? 0) };
  }
  if(typeof v === "string"){
    return { name: v, price: 0 };
  }
  return { name:"", price:0 };
}

function idNum(id){
  const m = String(id||"").match(/\d+/);
  return m ? Number(m[0]) : 999999;
}

function nowJst(ts){
  try{ return new Date(Number(ts||0)).toLocaleString("ja-JP"); }
  catch{ return String(ts||""); }
}

/* ====== state ====== */
const shop  = getParam("shop");
const table = getParam("table");
const token = getParam("token");

const CART_KEY = ()=> `cart_${shop}_${table}_${token}`;
const CHECKOUT_REQ_KEY = ()=> `checkoutReq_${shop}_${table}_${token}`;

let menu = { drink:{}, food:{}, drinkKeys:[], foodKeys:[] };
let cart = []; // [{id, name, price, qty, category}]
let lastHistory = { orders: {}, list: [], sum:0, count:0 };

function setStatus(html){ $("status").innerHTML = html || ""; }
function setSendMsg(html){ $("sendMsg").innerHTML = html || ""; }
function setCheckoutMsg(html){ $("checkoutMsg").innerHTML = html || ""; }

/* ====== init ====== */
$("shopText").textContent = shop || "(missing)";
$("tableText").textContent = table || "(missing)";
$("tokenText").textContent = token || "(missing)";
$("btnBack").onclick = ()=>{
  location.href = `customer.html?shop=${encodeURIComponent(shop)}&table=${encodeURIComponent(String(table))}&v=${Date.now()}`;
};

if(!shop || !table || !token){
  setStatus(`<span class="ng">NG</span> URL params が不足です（shop/table/token）`);
} else {
  setStatus(`<span class="ok">OK</span> 読み込み中...`);
}

/* ====== cart storage ====== */
function loadCart(){
  try{
    const raw = localStorage.getItem(CART_KEY()) || "[]";
    const arr = JSON.parse(raw);
    if(Array.isArray(arr)) cart = arr;
    else cart = [];
  }catch{ cart = []; }
}

function saveCart(){
  localStorage.setItem(CART_KEY(), JSON.stringify(cart));
}

function cartSum(){
  return cart.reduce((s,x)=> s + (Number(x.price||0)*Number(x.qty||0)), 0);
}

function renderCart(){
  $("cartCount").textContent = String(cart.length);
  $("cartSum").textContent = yen(cartSum());

  const wrap = $("cartList");
  wrap.innerHTML = "";

  if(cart.length === 0){
    wrap.innerHTML = `<div class="muted"><small>カートは空です</small></div>`;
    return;
  }

  for(const it of cart){
    const div = document.createElement("div");
    div.className = "cartItem";
    const pill = it.category === "drink" ? "pillD" : "pillF";
    const catLabel = it.category === "drink" ? "D" : "F";

    div.innerHTML = `
      <div class="cartTop">
        <div style="min-width:0">
          <span class="pill ${pill}">${catLabel}</span>
          <span class="name">${esc(it.name)}</span>
          <div class="muted mono">単価: ${esc(String(it.price||0))}</div>
        </div>
        <div class="qtyBox">
          <button class="qtyBtn" data-act="minus">-</button>
          <span class="qtyNum mono">${esc(String(it.qty||1))}</span>
          <button class="qtyBtn" data-act="plus">+</button>
          <button class="qtyBtn" data-act="del">削除</button>
        </div>
      </div>
      <div class="muted">小計: <span class="mono">${esc(yen(Number(it.price||0)*Number(it.qty||0)))}</span></div>
    `;

    div.querySelectorAll("button").forEach(btn=>{
      btn.onclick = ()=>{
        const act = btn.getAttribute("data-act");
        if(act === "minus"){
          it.qty = Math.max(1, Number(it.qty||1)-1);
        }else if(act === "plus"){
          it.qty = Number(it.qty||1)+1;
        }else if(act === "del"){
          cart = cart.filter(x => x !== it);
        }
        saveCart();
        renderCart();
      };
    });

    wrap.appendChild(div);
  }
}

/* ====== menu ====== */
function rebuildItemSelect(){
  const cat = $("catSel").value; // drink/food
  const keys = cat === "drink" ? menu.drinkKeys : menu.foodKeys;
  const src  = cat === "drink" ? menu.drink : menu.food;

  const sel = $("itemSel");
  sel.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = "（選択）";
  sel.appendChild(opt0);

  for(const id of keys){
    const v = parseMenuValue(src[id]);
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = `${id}：${v.name || "-"}（${v.price||0}）`;
    sel.appendChild(opt);
  }
}

async function loadMenu(){
  if(!shop){ return; }
  setStatus(`<span class="mono">menu loading...</span>`);

  const d = await rtdbGet(`shops/${encodeURIComponent(shop)}/menu/drink`);
  const f = await rtdbGet(`shops/${encodeURIComponent(shop)}/menu/food`);

  if(!d.ok || !f.ok){
    setStatus(`<span class="ng">NG</span> メニュー取得失敗（${d.status}/${f.status}）`);
    $("debug").textContent = JSON.stringify({ d, f }, null, 2);
    return;
  }

  menu.drink = (d.json && typeof d.json === "object") ? d.json : {};
  menu.food  = (f.json && typeof f.json === "object") ? f.json : {};

  menu.drinkKeys = Object.keys(menu.drink).sort((a,b)=>idNum(a)-idNum(b));
  menu.foodKeys  = Object.keys(menu.food).sort((a,b)=>idNum(a)-idNum(b));

  rebuildItemSelect();

  setStatus(`<span class="ok">OK</span> メニュー読み込み完了`);
  $("debug").textContent = JSON.stringify({
    shop, table, token,
    drinkKeys: menu.drinkKeys.length,
    foodKeys: menu.foodKeys.length
  }, null, 2);
}

/* ====== add to cart ====== */
$("catSel").onchange = rebuildItemSelect;

$("btnAdd").onclick = ()=>{
  const cat = $("catSel").value;
  const id  = $("itemSel").value;
  const qty = Math.max(1, Number($("qtyInp").value||1));

  if(!id){
    setSendMsg(`<span class="ng">メニューを選択してください</span>`);
    return;
  }

  const src = cat === "drink" ? menu.drink : menu.food;
  const v = parseMenuValue(src[id]);
  if(!v.name){
    setSendMsg(`<span class="ng">メニュー情報が不正です</span>`);
    return;
  }

  // 同一IDはまとめる
  const found = cart.find(x => x.id=== id && x.category === cat);
  if(found){
    found.qty = Number(found.qty||1) + qty;
  }else{
    cart.push({ id, name:v.name, price:Number(v.price||0), qty, category:cat });
  }

  saveCart();
  renderCart();
  setSendMsg(`<span class="ok">追加しました</span>`);
};

$("btnClearCart").onclick = ()=>{
  cart = [];
  saveCart();
  renderCart();
  setSendMsg(`<span class="muted">カートを空にしました</span>`);
};

$("btnReloadMenu").onclick = loadMenu;

/* ====== orders + history ====== */
function normalizeOrderObj(key, o){
  const createdAt = Number(o?.createdAt||0);
  const t = String(o?.table ?? "");
  const tk = String(o?.token ?? "");
  const total = Number(o?.total||0);
  const items = Array.isArray(o?.items) ? o.items : [];
  return { key, createdAt, table:t, token:tk, total, items, raw:o };
}

function orderLineText(it){
  const name = String(it?.name ?? "");
  const qty  = Number(it?.qty ?? 0);
  const price= Number(it?.price ?? 0);
  const sub  = price * qty;
  return { name, qty, price, sub };
}

function renderHistory(list){
  // token一致だけ
  const view = list.filter(x => x.token === token).sort((a,b)=>a.createdAt-b.createdAt);

  const sum = view.reduce((s,x)=> s + Number(x.total||0), 0);
  $("histCount").textContent = String(view.length);
  $("histSum").textContent = yen(sum);

  const wrap = $("histList");
  wrap.innerHTML = "";

  if(view.length === 0){
    wrap.innerHTML = `<div class="muted"><small>このtokenの注文履歴はありません</small></div>`;
    lastHistory = { orders:{}, list:[], sum:0, count:0 };
    return;
  }

  for(const o of view){
    const div = document.createElement("div");
    div.className = "histItem";
    const lines = (o.items||[]).map(orderLineText);

    div.innerHTML = `
      <div class="histHead">
        <div class="histTitle mono">${esc(nowJst(o.createdAt))}</div>
        <div class="mono" style="font-weight:900">${esc(yen(o.total))}</div>
      </div>
      <div class="histLines">
        ${
          lines.length
          ? lines.map(x=>`
            <div class="line">
              <div>${esc(x.name)} <span class="muted">x${esc(String(x.qty))}</span></div>
              <div class="mono">${esc(String(x.price))} / ${esc(yen(x.sub))}</div>
            </div>
          `).join("")
          : `<div class="muted"><small>(itemsなし)</small></div>`
        }
      </div>
    `;
    wrap.appendChild(div);
  }

  lastHistory = { orders:{}, list:view, sum, count:view.length };
}

async function refreshHistory(){
  if(!shop || !table) return;

  const path = `shops/${encodeURIComponent(shop)}/orders/${encodeURIComponent(String(table))}`;
  const r = await rtdbGet(path);
  if(!r.ok){
    setSendMsg(`<span class="ng">履歴読込失敗</span> HTTP ${r.status}`);
    $("debug").textContent = JSON.stringify({ historyRead: r }, null, 2);
    return;
  }

  const obj = (r.json && typeof r.json === "object") ? r.json : {};
  const list = Object.entries(obj).map(([key,val])=> normalizeOrderObj(key,val));
  renderHistory(list);
}

/* ====== send order ====== */
async function sendOrder(){
  if(!shop || !table || !token){
    setSendMsg(`<span class="ng">URL params 不足（shop/table/token）</span>`);
    return;
  }
  if(cart.length === 0){
    setSendMsg(`<span class="ng">カートが空です</span>`);
    return;
  }

  // 会計依頼済みなら送信を止める（見た目リセット運用）
  if(localStorage.getItem(CHECKOUT_REQ_KEY()) === "1"){
    setSendMsg(`<span class="ng">会計依頼済みのため注文できません</span>`);
    return;
  }

  $("btnSend").disabled = true;
  setSendMsg(`<span class="mono">送信中...</span>`);

  const createdAt = Date.now();

  // orders には「1回の送信 = 1レコード（items[]含む）」で保存（今までの形のまま）
  const items = cart.map(x=>({
    id: x.id,
    name: x.name,
    price: Number(x.price||0),
    qty: Number(x.qty||0),
    category: x.category
  }));

  const total = items.reduce((s,x)=> s + (x.price*x.qty), 0);

  const orderPayload = {
    shop,
    table: String(table),
    token,
    createdAt,
    items,
    itemsCount: items.reduce((s,x)=> s + Number(x.qty||0), 0),
    total
  };

  // 1) orders 保存
  const ordersPath = `shops/${encodeURIComponent(shop)}/orders/${encodeURIComponent(String(table))}`;
  const r1 = await rtdbPost(ordersPath, orderPayload);

  if(!r1.ok){
    setSendMsg(`<span class="ng">送信失敗 orders POST</span> HTTP ${r1.status}`);
    $("btnSend").disabled = false;
    $("debug").textContent = JSON.stringify({ ordersPost: r1, payload: orderPayload }, null, 2);
    return;
  }

  const orderKey = r1.json && r1.json.name ? String(r1.json.name) : "";
  const orderPathAbs = `/shops/${shop}/orders/${table}/${orderKey}`;

  // 2) orderFeed 保存（厨房用）
  // ★重要：統一先は「/shops/{shop}/orderFeed」
  // 1品ずつ feed に積む（kitchen 側で category で左右に分ける）
  for(const it of items){
    const feedPayload = {
      shop,
      table: String(table),
      token,
      createdAt,
      status: "new",
      category: String(it.category || ""),
      name: String(it.name || ""),
      qty: Number(it.qty||0),
      price: Number(it.price||0),
      total: Number(it.price||0) * Number(it.qty||0),
      orderKey,
      orderPath: orderPathAbs,
      itemsCount: Number(it.qty||0),
      // 互換・将来用（rulesで必要になっても困らないように）
      items: [ { name: it.name, qty: Number(it.qty||0), price: Number(it.price||0), category: it.category } ]
    };

    // ★ここが変更点：/shops/{shop}/orderFeed に POST
    const feedPath = `shops/${encodeURIComponent(shop)}/orderFeed`;
    const r2 = await rtdbPost(feedPath, feedPayload);

    if(!r2.ok){
      // ここで落ちた場合でも orders は入っている（安全）
      setSendMsg(`<span class="ng">送信失敗 orderFeed POST</span> HTTP ${r2.status}`);
      $("btnSend").disabled = false;
      $("debug").textContent = JSON.stringify({ orderFeedPost: r2, feedPayload }, null, 2);
      return;
    }
  }

  // 完了：カートを空にして履歴更新
  cart = [];
  saveCart();
  renderCart();

  setSendMsg(`<span class="ok">注文を送信しました</span>（厨房へ反映）`);
  $("btnSend").disabled = false;

  await refreshHistory();
}

$("btnSend").onclick = sendOrder;

/* ====== checkout request (customer) ====== */
function setHoldBar(pct){
  const p = Math.max(0, Math.min(100, pct));
  $("holdBar").style.width = p + "%";
}

const HOLD_MS = 1200;
let holdT = null;
let holdStart = 0;
let holding = false;

async function requestCheckout(){
  if(!shop || !table || !token){
    setCheckoutMsg(`<span class="ng">URL params 不足（shop/table/token）</span>`);
    return;
  }

  // まず履歴を最新化
  await refreshHistory();

  const reqAt = Date.now();
  const payload = {
    shop,
    table: String(table),
    token,
    requestedAt: reqAt,
    requestedAtText: nowJst(reqAt),
    // token累計
    total: Number(lastHistory.sum||0),
    orderCount: Number(lastHistory.count||0),
    // 注文一覧（token一致分だけ）
    orders: lastHistory.list.map(o=>({
      key: o.key,
      createdAt: o.createdAt,
      total: o.total,
      items: (o.items||[]).map(x=>({
        name: String(x.name||""),
        qty: Number(x.qty||0),
        price: Number(x.price||0),
        category: String(x.category||"")
      }))
    }))
  };

  const path = `shops/${encodeURIComponent(shop)}/checkoutRequests/${encodeURIComponent(String(table))}`;
  const r = await rtdbPut(path, payload);

  if(!r.ok){
    setCheckoutMsg(`<span class="ng">会計依頼 失敗</span> HTTP ${r.status}`);
    $("debug").textContent = JSON.stringify({ checkoutPut: r, payload }, null, 2);
    return;
  }

  // 見た目だけリセット風（＝これ以降の注文を止める）
  localStorage.setItem(CHECKOUT_REQ_KEY(), "1");
  $("checkoutBanner").style.display = "block";
  setCheckoutMsg(`<span class="ok">会計依頼しました</span> ${esc(nowJst(reqAt))}`);
  setSendMsg(`<span class="muted">会計依頼済みのため、注文はできません（店側が会計確定後に再入店）</span>`);

  // 履歴を“見た目だけ”消す（実データは残す）
  $("histList").innerHTML = `<div class="muted"><small>会計依頼済み（表示リセット）</small></div>`;
  $("histCount").textContent = "0";
  $("histSum").textContent = yen(0);
}

function startHold(){
  if(holding) return;
  holding = true;
  holdStart = Date.now();
  setHoldBar(0);

  const tick = async () => {
    if(!holding) return;
    const elapsed = Date.now() - holdStart;
    const pct = Math.floor((elapsed / HOLD_MS) * 100);
    setHoldBar(pct);

    if(elapsed >= HOLD_MS){
      holding = false;
      setHoldBar(100);
      await requestCheckout();
      setTimeout(()=>setHoldBar(0), 300);
      return;
    }
    holdT = setTimeout(tick, 16);
  };
  tick();
}

function endHold(){
  holding = false;
  if(holdT) clearTimeout(holdT);
  holdT = null;
  setHoldBar(0);
}

$("btnCheckout").addEventListener("pointerdown", (e)=>{ e.preventDefault(); startHold(); });
$("btnCheckout").addEventListener("pointerup", (e)=>{ e.preventDefault(); endHold(); });
$("btnCheckout").addEventListener("pointerleave", ()=> endHold());
$("btnCheckout").addEventListener("pointercancel", ()=> endHold());

/* ====== boot ====== */
(async function boot(){
  if(!shop || !table || !token) return;

  loadCart();
  renderCart();

  await loadMenu();
  await refreshHistory();

  // 既に会計依頼済みなら表示も合わせる
  if(localStorage.getItem(CHECKOUT_REQ_KEY()) === "1"){
    $("checkoutBanner").style.display = "block";
    setSendMsg(`<span class="muted">会計依頼済みのため、注文はできません（店側が会計確定後に再入店）</span>`);
    setCheckoutMsg(`<span class="muted">会計依頼済み</span>`);
  }else{
    setCheckoutMsg(`<span class="muted">未依頼</span>`);
  }
})();
</script>
