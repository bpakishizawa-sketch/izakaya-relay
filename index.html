<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>izakaya-relay</title>
</head>
<body style="margin:0">
  <div id="msg" style="padding:16px;font-family:sans-serif;white-space:pre-wrap;">
    読み込み中…
  </div>

<script>
/* ===== 設定（ここだけ確認） ===== */
const FIREBASE_DB_URL = "https://izakayaorder-default-rtdb.firebaseio.com";
const THUNKABLE_URL   = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH";
/* =============================== */

const msg = (t) => document.getElementById("msg").textContent = t;

/* --- QRから渡された shop / table を取得 --- */
const params = new URLSearchParams(location.search);
const shop  = params.get("shop");
const table = params.get("table");

if (!shop || !table) {
  msg("missing params: shop / table\n例: ?shop=daboya&table=1");
  throw new Error("missing params");
}

/* --- token生成（客がQRを読んだ瞬間に1回） --- */
const token = `${shop}-${table}-${Date.now()}`;

/* --- Firebase書き込み --- */
const sessionPayload = {
  shop,
  table,
  token,
  createdAt: Date.now()
};

const activePayload = {
  token,
  updatedAt: Date.now()
};

const sessionUrl =
  `${FIREBASE_DB_URL}/sessions/${encodeURIComponent(token)}.json`;

const activeUrl =
  `${FIREBASE_DB_URL}/activeSessions/${encodeURIComponent(shop)}/${encodeURIComponent(table)}.json`;

msg(`セッション作成中…
shop=${shop}
table=${table}
token=${token}`);

Promise.all([
  fetch(sessionUrl, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(sessionPayload)
  }),
  fetch(activeUrl, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(activePayload)
  })
])
.then(async (results) => {
  for (const r of results) {
    if (!r.ok) throw new Error(await r.text());
  }

  msg("OK。注文画面へ移動…");

  /* ★ 最終確定：?shop=&table= 方式（安全・WebView不要） */
  location.replace(
    `${THUNKABLE_URL}?shop=${encodeURIComponent(shop)}&table=${encodeURIComponent(table)}`
  );
})
.catch((e) => {
  console.error(e);
  msg("Firebase書き込み失敗。\nRules / URL を確認してください。\n\n" + e.message);
});
</script>
</body>
</html>
