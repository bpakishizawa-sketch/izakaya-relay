<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kitchen（店側）</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px;max-width:980px;margin:0 auto;background:#f6f7f9}
    h2{margin:0 0 10px}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:12px 0;background:#fff}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .right{margin-left:auto}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;}
    .muted{color:#6b7280;font-size:12px}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    button{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;font-weight:900}
    .btn{background:#111827;color:#fff}
    .btn2{background:#e5e7eb;color:#111827}
    .danger{background:#dc2626;color:#fff}
    .good{background:#16a34a;color:#fff}
    input,select{font-size:16px;padding:10px;border-radius:10px;border:1px solid #d1d5db;background:#fff}
    input{width:140px}
    .badge{display:inline-block;background:#111;color:#fff;padding:2px 8px;border-radius:999px;font-size:12px}

    /* ===== ここが重要：ドリンク/フードを上下2段（独立スクロール） ===== */
    .split{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }
    .pane{
      border:1px solid #e5e7eb;border-radius:12px;background:#fff;
      display:flex;flex-direction:column;
      min-height:240px;
    }
    .paneHead{
      padding:10px 12px;border-bottom:1px solid #e5e7eb;
      display:flex;align-items:center;gap:10px;
      font-weight:900;
    }
    .paneBody{
      padding:10px 12px;
      overflow:auto;
      /* スマホで “片方が長くなっても他が見えなくならない” ように固定 */
      max-height: calc((100vh - 250px) / 2);
    }
    .paneDrink .paneHead{color:#1d4ed8}
    .paneFood  .paneHead{color:#166534}

    @media(min-width:860px){
      /* PCは左右2列にして、各列は独立スクロール */
      .split{grid-template-columns:1fr 1fr;}
      .paneBody{max-height: calc(100vh - 220px);}
    }

    .oCard{
      border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:10px 0;
      background:#fff;
    }
    .oTop{display:flex;gap:10px;align-items:center}
    .oTitle{font-weight:900}
    .oTime{color:#6b7280;font-size:12px}
    .oTotal{font-weight:900}
    .items{margin-top:8px}
    .itemLine{display:flex;gap:8px;justify-content:space-between}
    .pill{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 8px;border-radius:999px;border:1px solid #d1d5db;font-weight:900;font-size:11px}
    .pillD{background:#dbeafe;border-color:#3b82f6}
    .pillF{background:#dcfce7;border-color:#16a34a}

    details{margin-top:10px}
    details summary{cursor:pointer;font-weight:900;color:#374151}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}
  </style>
</head>
<body>
  <h2>Kitchen（店側）</h2>

  <div class="card">
    <div class="row">
      <div><b>shop:</b> <span id="shopText" class="mono">-</span></div>
      <span class="right muted" id="lastLine">-</span>
    </div>

    <div class="row" style="margin-top:10px">
      <button id="btnBack" class="btn2">← menuへ</button>
      <button id="btnReload" class="btn">再読み込み</button>

      <label class="row" style="gap:8px;margin:0;">
        <input id="chkAuto" type="checkbox">
        <span class="muted">自動更新（3秒）</span>
      </label>

      <div class="row" style="gap:8px;margin:0;">
        <span class="muted">テーブル</span>
        <input id="inpTable" inputmode="numeric" placeholder="例: 2（空=全て）">
      </div>

      <label class="row" style="gap:8px;margin:0;">
        <input id="chkHidePending" type="checkbox">
        <span class="muted">提供処理中も表示（OFFで非表示）</span>
      </label>

      <span class="badge" id="badgeAll">0件</span>
      <span class="badge" id="badgeDrink">ドリンク 0</span>
      <span class="badge" id="badgeFood">フード 0</span>
    </div>

    <div id="status" class="muted" style="margin-top:8px">-</div>

    <details>
      <summary>デバッグ（必要時だけ）</summary>
      <pre id="debug" class="mono">-</pre>
    </details>
  </div>

  <div class="split">
    <div class="pane paneDrink">
      <div class="paneHead">
        <span class="pill pillD">D</span> ドリンク
        <span class="right muted" id="drinkInfo">-</span>
      </div>
      <div class="paneBody" id="drinkList"></div>
    </div>

    <div class="pane paneFood">
      <div class="paneHead">
        <span class="pill pillF">F</span> フード
        <span class="right muted" id="foodInfo">-</span>
      </div>
      <div class="paneBody" id="foodList"></div>
    </div>
  </div>

  <!-- shop_common.js は同階層。キャッシュ回避で ?v= を付ける -->
  <script src="shop_common.js?v=20260118"></script>

  <script>
  (() => {
    const $ = (id)=>document.getElementById(id);

    // shop_common.js 必須
    function must(fnName){
      if(typeof window[fnName] !== "function"){
        throw new Error(`shop_common.js の ${fnName}() が見つかりません`);
      }
    }
    must("requireLogin");
    must("getShop");
    must("rtdbGet");
    must("rtdbPut");
    must("esc");

    // ログイン必須
    if(!requireLogin()) return;

    const shop = getShop();
    $("shopText").textContent = shop || "(missing)";

    let autoTimer = null;
    let lastFeedRaw = null; // デバッグ用

    function setStatus(html){ $("status").innerHTML = html || ""; }
    function setLastLine(t){ $("lastLine").textContent = t || "-"; }

    function jst(ts){
      try{ return new Date(Number(ts||0)).toLocaleString("ja-JP"); }
      catch{ return String(ts||""); }
    }

    // orderPath は "/shops/..." のように先頭 "/" が付いているので外す
    function normPath(p){
      let s = String(p||"").trim();
      if(s.startsWith("/")) s = s.slice(1);
      return s;
    }

    // feed 1件から items を確実に取り出す
    async function resolveItemsFromFeed(feedItem){
      // 1) feedに items が入っているパターン（今後の拡張用）
      if(feedItem && Array.isArray(feedItem.items)){
        return feedItem.items;
      }

      // 2) orderPath を辿って orders を取得する（今のDB構造はコレ）
      const op = normPath(feedItem && feedItem.orderPath);
      if(!op) return null;

      const g = await rtdbGet(op);
      if(!g || g.ok !== true || !g.json) return null;

      // orders の中身は { items:[...], ... } を想定
      if(Array.isArray(g.json.items)) return g.json.items;

      // まれに items が別名の可能性に備えて
      if(Array.isArray(g.json.orderItems)) return g.json.orderItems;

      return null;
    }

    // 表示カード
    function makeCard(kind, feedKey, feedItem, items){
      const table = String(feedItem.table || "");
      const total = Number(feedItem.total || 0);
      const createdAt = feedItem.createdAt || 0;
      const status = String(feedItem.status || "new");
      const pending = (status === "pending");

      const wrap = document.createElement("div");
      wrap.className = "oCard";

      const title = `Table ${table}`;
      const time = jst(createdAt);

      const itemsText = (items && items.length)
        ? items.map(it=>{
            const name = (it && it.name) ? String(it.name) : "-";
            const qty  = (it && typeof it.qty !== "undefined") ? Number(it.qty||0) : 0;
            const price= (it && typeof it.price !== "undefined") ? Number(it.price||0) : 0;
            return { name, qty, price };
          })
        : [];

      const listHtml = itemsText.length
        ? itemsText.map(x => `
            <div class="itemLine">
              <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(x.name)} x${esc(String(x.qty))}</div>
              <div class="mono">${esc(String(x.price))}</div>
            </div>
          `).join("")
        : `<div class="muted"><small>(itemsが取得できません)</small></div>`;

      wrap.innerHTML = `
        <div class="oTop">
          <div class="oTitle">${esc(title)}</div>
          <div class="right oTime">${esc(time)}</div>
        </div>
        <div class="row" style="margin-top:8px;align-items:center">
          <div class="oTotal mono">合計: ${esc(String(total))}</div>
          <span class="right muted"><small>${esc(pending ? "提供処理中" : "新規")}</small></span>
        </div>
        <div class="items">${listHtml}</div>
        <div class="row" style="margin-top:10px">
          <button class="btn2" data-act="open">注文を開く</button>
          <button class="good" data-act="pending">${pending ? "提供済みに戻す" : "提供処理中"}</button>
          <button class="danger" data-act="del">feed削除</button>
        </div>
      `;

      // actions
      wrap.querySelectorAll("button").forEach(btn=>{
        btn.onclick = async ()=>{
          const act = btn.getAttribute("data-act");
          if(act === "open"){
            // orderPath を新タブで開く（確認用）
            const op = normPath(feedItem.orderPath);
            if(op){
              const url = `${location.origin.replace(/\/$/,"")}/` + ""; // ダミー（使わない）
              // RTDB直リンクを開く（ブラウザで見れる）
              window.open(`https://izakayaorder-default-rtdb.firebaseio.com/${op}.json?print=pretty`, "_blank");
            }else{
              alert("orderPath がありません");
            }
          }

          if(act === "pending"){
            // status を pending / new でトグル
            const next = (String(feedItem.status||"new")==="pending") ? "new" : "pending";
            const newObj = Object.assign({}, feedItem, {
              status: next,
              updatedAt: Date.now(),
              // deleteAt は pending の時だけ付与（任意）
              deleteAt: (next==="pending") ? (Date.now() + 1000*60*60*24) : null
            });

            // null を混ぜると削除になるので、deleteAt:null の場合はプロパティごと消す
            if(newObj.deleteAt === null) delete newObj.deleteAt;

            const path = `shops/${encodeURIComponent(shop)}/orderFeed/${encodeURIComponent(feedKey)}`;
            const res = await rtdbPut(path, newObj);
            if(!res || res.ok !== true){
              alert(`更新失敗: ${res && res.status}`);
              return;
            }
            await load();
          }

          if(act === "del"){
            if(!confirm("このfeedを削除しますか？（orders本体は消しません）")) return;
            const path = `shops/${encodeURIComponent(shop)}/orderFeed/${encodeURIComponent(feedKey)}`;
            const res = await rtdbPut(path, null);
            if(!res || res.ok !== true){
              alert(`削除失敗: ${res && res.status}`);
              return;
            }
            await load();
          }
        };
      });

      return wrap;
    }

    function passFilter(feedItem){
      // table filter
      const wantTable = String(($("inpTable").value||"").trim());
      if(wantTable){
        if(String(feedItem.table||"") !== wantTable) return false;
      }

      // pending filter
      const showPending = $("chkHidePending").checked;
      // UI文言が「提供処理中も表示」なので、チェックON=表示、OFF=非表示 が自然
      // ただし checkbox名が chkHidePending なので分かりにくい。ここで合わせる：
      // checked=true → pendingも表示
      // checked=false → pendingは非表示
      const st = String(feedItem.status||"new");
      const isPending = (st === "pending");
      if(!showPending && isPending) return false;

      return true;
    }

    async function load(){
      try{
        setStatus(`<span class="mono">loading...</span>`);
        $("drinkList").innerHTML = "";
        $("foodList").innerHTML = "";

        const feedPath = `shops/${encodeURIComponent(shop)}/orderFeed`;
        const g = await rtdbGet(feedPath);
        if(!g || g.ok !== true){
          setStatus(`<span class="ng">NG</span> 読み込み失敗: ${esc(String(g && g.status))}`);
          return;
        }

        const feedObj = (g.json && typeof g.json === "object") ? g.json : {};
        lastFeedRaw = feedObj;

        // feedは createdAt 昇順で並べる
        const keys = Object.keys(feedObj);
        const list = keys.map(k => ({ key:k, v: feedObj[k] }))
          .filter(x => x.v && typeof x.v === "object")
          .sort((a,b)=> Number(a.v.createdAt||0) - Number(b.v.createdAt||0));

        // フィルタ適用
        const filtered = list.filter(x => passFilter(x.v));

        // items を解決して分類
        const drinkWrap = $("drinkList");
        const foodWrap  = $("foodList");

        let drinkN = 0, foodN = 0;

        // ここで await を必ず効かせる（await漏れがあると drink/food が 0 になりがち）
        for(const x of filtered){
          const items = await resolveItemsFromFeed(x.v);

          // items が取れない場合でも、とりあえず “未分類として両方に入れない” のではなく、
          // feedItem内の token/itemsCount などは見えるように、cat推定できないなら food側に寄せる
          let kind = null;

          if(items && items.length){
            // items[].cat を見て、1件でも drink があれば drink、foodがあれば food に分ける
            // （混在注文の場合は両方に表示したいなら分割実装も可能。今は “最初のcat” に寄せる）
            const first = items.find(it=>it && it.cat) || items[0];
            const cat = String((first && first.cat) || "").toLowerCase();
            if(cat === "drink") kind = "drink";
            else if(cat === "food") kind = "food";
          }

          if(!kind){
            // feedItem側に cat がある場合（将来用）
            const c2 = String(x.v.cat||"").toLowerCase();
            if(c2==="drink" || c2==="food") kind = c2;
          }

          if(!kind) kind = "food"; // 取れない時はfood側に寄せ（見失い防止）

          const card = makeCard(kind, x.key, x.v, items);

          if(kind === "drink"){
            drinkWrap.appendChild(card);
            drinkN++;
          }else{
            foodWrap.appendChild(card);
            foodN++;
          }
        }

        if(drinkN === 0) drinkWrap.innerHTML = `<div class="muted"><small>表示する注文がありません</small></div>`;
        if(foodN === 0)  foodWrap.innerHTML  = `<div class="muted"><small>表示する注文がありません</small></div>`;

        $("badgeAll").textContent = `${filtered.length}件`;
        $("badgeDrink").textContent = `ドリンク ${drinkN}`;
        $("badgeFood").textContent  = `フード ${foodN}`;
        $("drinkInfo").textContent = `表示: ${drinkN}件`;
        $("foodInfo").textContent  = `表示: ${foodN}件`;

        setLastLine(`更新: ${new Date().toLocaleTimeString("ja-JP")}`);

        $("debug").textContent = JSON.stringify({
          shop,
          feedPath: `shops/${shop}/orderFeed`,
          total: list.length,
          filtered: filtered.length,
          drink: drinkN,
          food: foodN,
          filter: {
            table: String(($("inpTable").value||"").trim()),
            showPending: $("chkHidePending").checked ? "1" : "0"
          },
          note: "orderFeedはorderPathを辿ってitemsを取得して分類します"
        }, null, 2);

        setStatus(`<span class="ok">OK</span> ${filtered.length}件`);
      }catch(e){
        setStatus(`<span class="ng">NG</span> <span class="muted">${esc(String(e.message||e))}</span>`);
      }
    }

    // events
    $("btnBack").onclick = ()=> location.href = `menu.html?v=${Date.now()}`;
    $("btnReload").onclick = load;

    $("chkAuto").onchange = ()=>{
      if($("chkAuto").checked){
        if(autoTimer) clearInterval(autoTimer);
        autoTimer = setInterval(load, 3000);
      }else{
        if(autoTimer) clearInterval(autoTimer);
        autoTimer = null;
      }
    };

    $("inpTable").oninput = ()=> load();
    $("chkHidePending").onchange = ()=> load();

    // 初期
    // 「提供処理中も表示」＝ON にしておく
    $("chkHidePending").checked = true;
    load();
  })();
  </script>
</body>
</html>
