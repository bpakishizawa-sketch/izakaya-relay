<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メニュー編集</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:16px; max-width:980px; margin:0 auto; background:#fafafa;}
    h1{font-size:22px;margin:0 0 10px}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:12px 0;background:#fff;}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .muted{color:#6b7280}
    .small{font-size:12px;color:#6b7280}
    button{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;font-weight:900}
    .dark{background:#111827;color:#fff}
    .light{background:#f3f4f6;color:#111827;border:1px solid #e5e7eb}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    input,select{font-size:16px;padding:10px;border:1px solid #d1d5db;border-radius:10px}
    .tabs{display:flex;gap:10px;flex-wrap:wrap}
    .tab{padding:10px 14px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-weight:900}
    .tab.on{background:#111827;color:#fff;border-color:#111827}
    .grid{display:grid;grid-template-columns:1fr; gap:12px}
    @media(min-width:900px){ .grid{grid-template-columns: 1.2fr .8fr;} }

    .list{display:flex;flex-direction:column;gap:8px}
    .item{border:1px solid #e5e7eb;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
    .item:hover{background:#f9fafb}
    .itemId{font-weight:900;min-width:70px}
    .itemName{font-weight:900}
    .itemMeta{font-size:12px;color:#6b7280;margin-top:4px}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:900;border:1px solid #e5e7eb}
    .badgeDrink{background:#dbeafe;border-color:#3b82f6}
    .badgeFood{background:#dcfce7;border-color:#16a34a}

    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .chip{border:1px dashed #d1d5db;border-radius:999px;padding:8px 10px;background:#fff;font-weight:900;cursor:pointer}
    .chip:hover{background:#f9fafb}

    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}
  </style>
</head>
<body>
  <h1>メニュー編集</h1>

  <div class="card">
    <div class="row">
      <div>shop: <b id="shopText" class="mono">-</b></div>
      <span id="status" class="small muted">-</span>
    </div>
    <div class="row" style="margin-top:10px;">
      <button id="btnBack" class="light">← menuへ</button>
      <button id="btnReload" class="dark">再読み込み</button>
      <button id="btnPrintDrink" class="light">ドリンク印刷</button>
      <button id="btnPrintFood" class="light">フード印刷</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <div class="tabs">
        <button id="tabDrink" class="tab on" type="button">ドリンク</button>
        <button id="tabFood" class="tab" type="button">フード</button>
      </div>
      <input id="q" placeholder="検索（メニュー名 / ID）" style="flex:1;min-width:240px" />
    </div>
  </div>

  <div class="grid">
    <!-- 左：一覧 -->
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div>
          <b id="listTitle">一覧（ドリンク）</b>
          <span class="small muted" id="countText">-</span>
        </div>
        <div class="small muted">行タップで編集</div>
      </div>

      <div class="chips" id="emptyChips" style="display:none;"></div>

      <div class="list" id="list"></div>
    </div>

    <!-- 右：編集 -->
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <b>編集</b>
        <span class="small muted" id="savePath">保存先：-</span>
      </div>

      <div class="row" style="margin-top:10px;">
        <div style="flex:1;min-width:220px">
          <div class="small muted">対象（プルダウンでも選択可）</div>
          <select id="sel" style="width:100%">
            <option value="">(未選択)</option>
          </select>
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div style="flex:1;min-width:220px">
          <div class="small muted">ID</div>
          <input id="id" placeholder="例：d12 / f101" style="width:100%" />
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div style="flex:1;min-width:220px">
          <div class="small muted">メニュー名</div>
          <input id="name" placeholder="例：レモンサワー" style="width:100%" />
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div style="flex:1;min-width:220px">
          <div class="small muted">価格</div>
          <input id="price" placeholder="例：480" inputmode="numeric" style="width:100%" />
        </div>
      </div>

      <div class="row" style="margin-top:12px;">
        <button id="btnSuggest" class="light" type="button">空き番号を提案</button>
        <button id="btnSave" class="dark" type="button">保存</button>
        <button id="btnDelete" class="light" type="button" disabled>削除</button>
      </div>

      <div class="small muted" id="hint" style="margin-top:10px;">-</div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div class="small muted">デバッグ</div>
      <button id="btnClearDbg" class="light" type="button">クリア</button>
    </div>
    <pre id="dbg" class="mono">-</pre>
  </div>

  <!-- 共通JS（localStorage 統一版） -->
  <script src="shop_common.js"></script>

  <script>
  (function(){
    const $ = (id)=>document.getElementById(id);

    function logDbg(msg){
      const cur = $("dbg").textContent === "-" ? "" : $("dbg").textContent + "\n";
      $("dbg").textContent = (cur + String(msg||"")).slice(0, 20000);
    }
    function setStatus(html){
      $("status").innerHTML = html || "-";
    }

    function must(fnName){
      if(typeof window[fnName] !== "function"){
        throw new Error("shop_common.js の " + fnName + "() が見つかりません");
      }
    }

    must("requireLogin");
    must("getShop");
    must("getPin");
    must("rtdbGet");
    must("rtdbPut");
    must("esc");

    // ログイン必須
    if(!requireLogin()) return;

    const shop = getShop();
    $("shopText").textContent = shop || "-";

    const state = {
      cat: "drink",      // drink | food
      data: { drink:{}, food:{} }, // {id:{name,price}}
      selectedId: ""
    };

    function catLabel(cat){ return cat === "drink" ? "ドリンク" : "フード"; }
    function catBadge(cat){
      return cat === "drink"
        ? '<span class="badge badgeDrink">ドリンク</span>'
        : '<span class="badge badgeFood">フード</span>';
    }
    function prefix(cat){ return cat === "drink" ? "d" : "f"; }

    function normalizeValue(v){
      // v が {name,price} / 文字列 / 数値など混在しても吸収
      if(v && typeof v === "object"){
        const name = (v.name ?? "").toString();
        const price = (v.price === undefined || v.price === null) ? "" : Number(v.price);
        return { name, price: (Number.isFinite(price) ? price : "") };
      }
      if(typeof v === "string"){
        return { name: v, price: "" };
      }
      return { name: "", price: "" };
    }

    function sortId(a,b){
      // d12,f101 等の数値部分でソート
      const ra = String(a).match(/(\d+)/);
      const rb = String(b).match(/(\d+)/);
      const na = ra ? Number(ra[1]) : Number.POSITIVE_INFINITY;
      const nb = rb ? Number(rb[1]) : Number.POSITIVE_INFINITY;
      if(na !== nb) return na - nb;
      return String(a).localeCompare(String(b));
    }

    function currentMap(){
      return state.cat === "drink" ? state.data.drink : state.data.food;
    }

    function updateTitles(){
      $("listTitle").textContent = "一覧（" + catLabel(state.cat) + "）";
      $("tabDrink").classList.toggle("on", state.cat === "drink");
      $("tabFood").classList.toggle("on", state.cat === "food");
    }

    function setSelected(id){
      state.selectedId = id || "";
      $("sel").value = state.selectedId || "";
      if(!state.selectedId){
        $("id").value = "";
        $("name").value = "";
        $("price").value = "";
        $("btnDelete").disabled = true;
        $("hint").textContent = "一覧からタップ、または空き番号を選んでください。";
        updateSavePath();
        return;
      }
      const m = currentMap();
      const v = m[state.selectedId];
      $("id").value = state.selectedId;
      $("name").value = v ? (v.name || "") : "";
      $("price").value = (v && v.price !== "") ? String(v.price) : "";
      $("btnDelete").disabled = !v; // 既存だけ削除可
      $("hint").textContent = v ? "編集中（既存）" : "新規追加";
      updateSavePath();
    }

    function updateSavePath(){
      const id = ($("id").value || "").trim();
      const p = "shops/" + encodeURIComponent(shop) + "/menu/" + state.cat + (id ? ("/" + encodeURIComponent(id)) : "");
      $("savePath").textContent = "保存先：/" + p;
    }

    function buildEmptySuggestions(){
      // 既存IDを避けて、空き候補を10個表示
      const m = currentMap();
      const used = new Set(Object.keys(m));
      const pre = prefix(state.cat);
      const out = [];
      let n = (state.cat === "drink") ? 1 : 101; // food を f101 起点にしたい運用ならここ
      while(out.length < 10 && n < 9999){
        const id = pre + String(n);
        if(!used.has(id)) out.push(id);
        n++;
      }
      return out;
    }

    function renderList(){
      updateTitles();

      const m = currentMap();
      const q = ($("q").value || "").trim().toLowerCase();

      // select options
      const ids = Object.keys(m).sort(sortId);
      $("sel").innerHTML = '<option value="">(未選択)</option>' +
        ids.map(id => '<option value="'+ esc(id) +'">' + esc(id) + " / " + esc(m[id].name || "") + "</option>").join("");

      // empty chips
      const empties = buildEmptySuggestions();
      const chipWrap = $("emptyChips");
      chipWrap.style.display = "flex";
      chipWrap.innerHTML = empties.map(id => '<div class="chip" data-id="'+esc(id)+'">＋ '+esc(id)+'</div>').join("");
      chipWrap.querySelectorAll(".chip").forEach(el=>{
        el.onclick = ()=>{
          const id = el.getAttribute("data-id");
          // 新規枠
          setSelected("");
          state.selectedId = "";
          $("sel").value = "";
          $("id").value = id;
          $("name").value = "";
          $("price").value = "";
          $("btnDelete").disabled = true;
          $("hint").textContent = "新規追加";
          updateSavePath();
        };
      });

      // list
      const list = $("list");
      list.innerHTML = "";

      let view = ids.map(id => ({ id, ...m[id] }));
      if(q){
        view = view.filter(x =>
          String(x.id).toLowerCase().includes(q) ||
          String(x.name||"").toLowerCase().includes(q)
        );
      }

      $("countText").textContent = "（" + view.length + "件）";

      if(view.length === 0){
        list.innerHTML = '<div class="muted"><small>該当なし</small></div>';
        return;
      }

      for(const x of view){
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = '' +
          '<div class="itemId">'+ esc(x.id) +'</div>' +
          '<div style="flex:1">' +
            '<div class="itemName">'+ catBadge(state.cat) +' ' + esc(x.name || "(no name)") + '</div>' +
            '<div class="itemMeta">価格：' + esc(x.price === "" ? "-" : String(x.price)) + '</div>' +
          '</div>';
        div.onclick = ()=>{
          setSelected(x.id);
        };
        list.appendChild(div);
      }
    }

    async function loadMenu(){
      setStatus('<span class="mono">loading...</span>');
      $("hint").textContent = "-";
      try{
        const d = await rtdbGet("shops/" + encodeURIComponent(shop) + "/menu/drink");
        const f = await rtdbGet("shops/" + encodeURIComponent(shop) + "/menu/food");

        const drinkRaw = (d && d.ok) ? (d.json || {}) : {};
        const foodRaw  = (f && f.ok) ? (f.json || {}) : {};

        state.data.drink = {};
        state.data.food  = {};

        if(drinkRaw && typeof drinkRaw === "object"){
          for(const [id,v] of Object.entries(drinkRaw)){
            state.data.drink[String(id)] = normalizeValue(v);
          }
        }
        if(foodRaw && typeof foodRaw === "object"){
          for(const [id,v] of Object.entries(foodRaw)){
            state.data.food[String(id)] = normalizeValue(v);
          }
        }

        setStatus('<span class="ok">OK</span> ' + new Date().toLocaleTimeString("ja-JP"));
        renderList();
        if(!state.selectedId){
          $("hint").textContent = "一覧からタップ、または空き番号を選んでください。";
        }
      }catch(e){
        setStatus('<span class="ng">読込失敗</span>');
        logDbg(e && e.stack ? e.stack : (e.message || String(e)));
      }
    }

    function validateId(id){
      if(!id) return "IDが空です";
      // 英数字と _- のみ許可（RTDBパス安全）
      if(!/^[a-zA-Z0-9_-]+$/.test(id)) return "IDは英数字・_・- のみ使用できます";
      // カテゴリに合うprefix推奨（強制ではないがミス防止）
      const p = prefix(state.cat);
      if(!id.startsWith(p)) return "IDは " + p + " から始めるのを推奨します（例：" + p + "1）";
      return "";
    }

    async function saveItem(){
      const id = ($("id").value || "").trim();
      const name = ($("name").value || "").trim();
      const priceStr = ($("price").value || "").trim();

      const warn = validateId(id);
      if(warn && !confirm(warn + "\nこのまま保存しますか？")) return;

      if(!name){
        alert("メニュー名を入力してください");
        return;
      }

      let price = "";
      if(priceStr !== ""){
        const p = Number(priceStr);
        if(!Number.isFinite(p) || p < 0){
          alert("価格が不正です");
          return;
        }
        price = p;
      }

      setStatus('<span class="mono">saving...</span>');
      const path = "shops/" + encodeURIComponent(shop) + "/menu/" + state.cat + "/" + encodeURIComponent(id);
      const payload = { name, price: (price === "" ? null : price) };

      const res = await rtdbPut(path, payload);
      if(!res.ok){
        throw new Error("保存失敗: HTTP " + res.status);
      }

      // ローカル反映
      const m = currentMap();
      m[id] = { name, price: (price === "" ? "" : price) };

      setSelected(id);
      setStatus('<span class="ok">保存OK</span>');
      renderList();
    }

    async function deleteItem(){
      const id = ($("id").value || "").trim();
      if(!id) return;

      setStatus('<span class="mono">deleting...</span>');
      const path = "shops/" + encodeURIComponent(shop) + "/menu/" + state.cat + "/" + encodeURIComponent(id);

      const res = await rtdbPut(path, null);
      if(!res.ok){
        throw new Error("削除失敗: HTTP " + res.status);
      }

      const m = currentMap();
      delete m[id];

      setSelected("");
      setStatus('<span class="ok">削除OK</span>');
      renderList();
    }

    function makeEmptyIdSuggestion(){
      const arr = buildEmptySuggestions();
      return arr[0] || (prefix(state.cat) + "1");
    }

    function switchCat(cat){
      state.cat = cat;
      state.selectedId = "";
      $("q").value = "";
      setSelected("");
      renderList();
    }

    function printCategory(cat){
      // cat の一覧を簡易印刷（別窓→印刷）
      const map = (cat === "drink") ? state.data.drink : state.data.food;
      const ids = Object.keys(map).sort(sortId);

      const title = "メニュー（" + catLabel(cat) + "）";
      const rows = ids.map(id=>{
        const v = map[id] || {name:"",price:""};
        const price = (v.price === "" || v.price === null || v.price === undefined) ? "" : String(v.price);
        return "<tr><td>"+esc(id)+"</td><td>"+esc(v.name||"")+"</td><td style='text-align:right'>"+esc(price)+"</td></tr>";
      }).join("");

      const html =
        "<!doctype html><html><head><meta charset='utf-8'/>" +
        "<meta name='viewport' content='width=device-width,initial-scale=1'/>" +
        "<title>"+esc(title)+"</title>" +
        "<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px}" +
        "h1{font-size:20px;margin:0 0 10px} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace}" +
        "table{width:100%;border-collapse:collapse} th,td{border:1px solid #ddd;padding:8px} th{background:#f3f4f6;text-align:left}" +
        "</style></head><body>" +
        "<h1>"+esc(title)+"</h1>" +
        "<div class='mono'>shop: "+esc(shop)+" / "+new Date().toLocaleString("ja-JP")+"</div>" +
        "<table style='margin-top:10px'><thead><tr><th style='width:90px'>ID</th><th>名前</th><th style='width:90px;text-align:right'>価格</th></tr></thead>" +
        "<tbody>"+rows+"</tbody></table>" +
        "<script>window.onload=function(){ setTimeout(function(){ window.print(); }, 200); }<\/script>" +
        "</body></html>";

      const w = window.open("", "_blank");
      if(!w){
        alert("ポップアップがブロックされました。印刷のため許可してください。");
        return;
      }
      w.document.open();
      w.document.write(html);
      w.document.close();
    }

    // events
    $("btnBack").addEventListener("click", ()=> location.href = "menu.html?v=" + Date.now());
    $("btnReload").addEventListener("click", ()=> loadMenu().catch(e=>logDbg(e.message||String(e))));
    $("tabDrink").addEventListener("click", ()=> switchCat("drink"));
    $("tabFood").addEventListener("click", ()=> switchCat("food"));
    $("q").addEventListener("input", ()=> renderList());
    $("sel").addEventListener("change", ()=>{
      const v = ($("sel").value || "").trim();
      setSelected(v);
    });
    $("id").addEventListener("input", updateSavePath);
    $("btnSuggest").addEventListener("click", ()=>{
      const s = makeEmptyIdSuggestion();
      setSelected("");
      $("id").value = s;
      $("name").value = "";
      $("price").value = "";
      $("btnDelete").disabled = true;
      $("hint").textContent = "新規追加";
      updateSavePath();
    });
    $("btnSave").addEventListener("click", ()=> saveItem().catch(e=>{ setStatus('<span class="ng">保存失敗</span>'); logDbg(e.message||String(e)); }));
    $("btnDelete").addEventListener("click", ()=>{
      const id = ($("id").value || "").trim();
      if(!id) return;
      if(!confirm("削除しますか？\n" + id)) return;
      deleteItem().catch(e=>{ setStatus('<span class="ng">削除失敗</span>'); logDbg(e.message||String(e)); });
    });
    $("btnPrintDrink").addEventListener("click", ()=> printCategory("drink"));
    $("btnPrintFood").addEventListener("click", ()=> printCategory("food"));
    $("btnClearDbg").addEventListener("click", ()=> $("dbg").textContent = "-");

    // init
    updateTitles();
    setSelected("");
    loadMenu();
  })();
  </script>
</body>
</html>
