<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>店側ログイン</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:18px; max-width:720px; margin:0 auto;}
    h1{font-size:22px;margin:0 0 10px}
    .sub{font-size:12px;color:#6b7280;margin-bottom:14px;line-height:1.6}
    .card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0;background:#fff;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input,button{font-size:16px;padding:12px;border-radius:12px}
    input{border:1px solid #d1d5db; background:#fff; width:100%; box-sizing:border-box}
    button{cursor:pointer;border:0;font-weight:900}
    .btn{background:#111827;color:#fff}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .small{font-size:12px;color:#6b7280}
    details summary{cursor:pointer;font-weight:900;color:#374151}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}
  </style>
</head>
<body>
  <h1>店側ログイン</h1>
  <div class="sub">
    shopコード と staffPin を入力してログインします。<br>
    成功すると <b>localStorage</b> に保存し、menu.html に移動します。
  </div>

  <div class="card">
    <div class="row">
      <input id="shopInp" placeholder="shopコード（例：daboya）" autocomplete="username" />
      <input id="pinInp" placeholder="PIN（例：1111）" inputmode="numeric" autocomplete="current-password" style="max-width:160px" />
      <button id="btnLogin" class="btn" style="max-width:160px">ログイン</button>
    </div>

    <div id="msg" style="margin-top:10px;" class="small">-</div>
  </div>

  <!-- デバッグ（必要な時だけ開く） -->
  <details class="card">
    <summary>デバッグ（開いて確認）</summary>
    <pre id="debug" class="mono">-</pre>
  </details>

  <!-- 共通JS（必須） -->
  <script src="shop_common.js"></script>

  <script>
    const $ = (id)=>document.getElementById(id);

    function esc(s){
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    function setMsg(html){ $("msg").innerHTML = html; }

    function normalizePin(x){
      // FBRDが number でも string でも同じ比較にする
      if(x === null || x === undefined) return "";
      return String(x).trim();
    }

    function getVal(){
      const shop = ($("shopInp").value || "").trim();
      const pin  = ($("pinInp").value  || "").trim();
      return { shop, pin };
    }

    async function doLogin(){
      const { shop, pin } = getVal();

      if(!shop || !pin){
        setMsg(`<span class="ng">NG</span> shop と PIN を入力してください`);
        return;
      }

      $("btnLogin").disabled = true;
      setMsg(`<span class="mono">確認中...</span>`);

      try{
        // staffPin を確認
        const staffPinPath = `shops/${encodeURIComponent(shop)}/staffPin`;
        const r = await rtdbGet(staffPinPath);

        const dbg = {
          requestShop: shop,
          inputPin: pin,
          staffPinPath,
          fetchStatus: r.status,
          ok: r.ok,
          url: r.url,
          gotJson: r.json,
          gotType: typeof r.json
        };
        $("debug").textContent = JSON.stringify(dbg, null, 2);

        if(!r.ok){
          setMsg(`<span class="ng">NG</span> PIN取得に失敗しました（HTTP ${r.status}）`);
          $("btnLogin").disabled = false;
          return;
        }

        const serverPin = normalizePin(r.json);
        const inputPin  = normalizePin(pin);

        if(!serverPin){
          setMsg(`<span class="ng">NG</span> staffPin が未設定です（/shops/${esc(shop)}/staffPin）`);
          $("btnLogin").disabled = false;
          return;
        }

        if(serverPin !== inputPin){
          setMsg(`<span class="ng">NG</span> PINが違います`);
          $("btnLogin").disabled = false;
          return;
        }

        // ✅ ここが今回の修正点：
        // ❌ IsSetShopLogin(...) ではなく、✅ lsSetShopLogin(...) を使う
        lsSetShopLogin(shop, inputPin);

        setMsg(`<span class="ok">OK</span> ログインしました → menuへ移動します`);
        setTimeout(()=> location.href = `menu.html?v=${Date.now()}`, 150);

      }catch(e){
        setMsg(`<span class="ng">例外エラー</span> ${esc(e.message || e)}`);
        $("btnLogin").disabled = false;
      }
    }

    $("btnLogin").onclick = doLogin;
    $("pinInp").addEventListener("keydown", (e)=>{
      if(e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
