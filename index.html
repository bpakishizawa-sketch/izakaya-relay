<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>checkout</title></head>
<body style="font-family:sans-serif;margin:16px;">
<h3>会計（token無効化）</h3>
<pre id="info">loading…</pre>
<button id="btn" disabled style="font-size:16px;padding:10px 14px;">会計完了（無効化）</button>
<script>
const DB="https://izakayaorder-default-rtdb.firebaseio.com";
const enc=encodeURIComponent,$=id=>document.getElementById(id);
const p=new URLSearchParams(location.search);
const shop=p.get("shop"), table=p.get("table");
if(!shop||!table){$("info").textContent="missing shop/table";throw 0;}
const url=`${DB}/activeSessions/${enc(shop)}/${enc(table)}.json`;
(async()=>{
  $("info").textContent=`shop=${shop}\ntable=${table}\nactiveUrl=${url}`;
  $("btn").disabled=false;
  $("btn").onclick=async()=>{
    $("btn").disabled=true;
    await fetch(url,{method:"DELETE"});
    $("info").textContent+="\n\nOK: activeSessions削除（無効化完了）";
    $("btn").disabled=false;
  };
})().catch(e=>{$("info").textContent="ERR:"+e.message;});
</script></body></html>
