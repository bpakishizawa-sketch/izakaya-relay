<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitchen - Order Feed</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:18px; max-width:980px; margin:0 auto;}
    h1{font-size:22px;margin:0 0 8px}
    .sub{font-size:12px;color:#6b7280;margin-bottom:12px}
    .topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
    .card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #ddd;font-weight:800;font-size:12px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    select,input{font-size:16px;padding:10px;border:1px solid #ccc;border-radius:10px}
    button{font-size:14px;padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:900}
    button.dark{background:#111827;color:#fff}
    button.light{background:#f3f4f6;color:#111827;border:1px solid #ddd}
    button.done{background:#16a34a;color:#fff}
    button.warn{background:#f59e0b;color:#111827}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .muted{color:#6b7280}
    .grid{display:grid;grid-template-columns: 1fr; gap:10px}
    @media(min-width:780px){
      .grid{grid-template-columns: 1fr 1fr;}
    }
    .itemTitle{font-weight:900;font-size:16px}
    .small{font-size:12px;color:#6b7280}
    .kline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .sep{height:1px;background:#eee;margin:10px 0}
  </style>
</head>
<body>
  <h1>厨房：オーダーリスト</h1>
  <div class="sub">orderFeed（競合しにくい構造）を読んで「入った順」で表示します。提供済みは “ダブルタップ” で確定（誤タップ防止）。</div>

  <div class="card">
    <div class="row">
      <div>shop: <b id="shopText" class="mono">-</b></div>
      <div class="small">（menu.htmlでログインしている前提）</div>
    </div>

    <div class="topbar">
      <button id="btnBack" class="light">← menuへ</button>
      <button id="btnRefresh" class="dark">更新</button>
      <label class="row">
        <span class="small">自動更新</span>
        <select id="autoSec">
          <option value="0">OFF</option>
          <option value="2" selected>2秒</option>
          <option value="5">5秒</option>
          <option value="10">10秒</option>
        </select>
      </label>

      <label class="row">
        <span class="small">カテゴリ</span>
        <select id="catFilter">
          <option value="all" selected>全て</option>
          <option value="drink">ドリンク</option>
          <option value="food">フード</option>
        </select>
      </label>

      <label class="row">
        <span class="small">テーブル</span>
        <input id="tableFilter" placeholder="例：1（空=全て）" style="width:160px" inputmode="numeric" />
      </label>

      <label class="row">
        <select id="hideDone">
          <option value="1" selected>提供済みは隠す</option>
          <option value="0">提供済みも表示</option>
        </select>
      </label>
    </div>

    <div id="status" class="small muted">-</div>
  </div>

  <div id="list" class="grid"></div>

  <div class="card">
    <div class="small">デバッグ</div>
    <pre id="debug" class="mono" style="white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto">-</pre>
  </div>

<script>
/** ===== 設定（他HTMLと揃える） ===== */
const DB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
/** ================================= */

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
function now(){ return Date.now(); }

async function rtdbGet(pathWithQuery){
  const url = `${DB_BASE}/${pathWithQuery}`;
  const res = await fetch(url);
  const txt = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${txt}`);
  return JSON.parse(txt || "null");
}
async function rtdbPatch(path, obj){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method: "PATCH",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(obj)
  });
  const txt = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${txt}`);
  return JSON.parse(txt || "null");
}

function getShop(){
  return (localStorage.getItem("shopCode") || "").trim();
}

function normalizeOrder(pushId, o){
  // 想定：orderFeed/{shop}/{pushId} に入る構造
  // 最低限：shop/table/category/name/qty/createdAt/status
  // 互換：items[] がある場合は先頭で代表表示（厨房は基本「1注文=1品」推奨）
  const shop = o.shop ?? "";
  const table = String(o.table ?? "");
  const category = o.category ?? o.cat ?? "";
  const createdAt = Number(o.createdAt ?? o.updatedAt ?? 0);
  const status = o.status ?? "new"; // "new" | "done"
  const providedAt = Number(o.providedAt ?? 0);

  let name = o.name ?? o.itemName ?? "";
  let qty = Number(o.qty ?? o.count ?? 1);
  let price = (o.price === undefined ? "" : o.price);

  // items配列を持っている場合（旧テスト等）
  if((!name || !qty) && Array.isArray(o.items) && o.items.length){
    name = o.items[0].name ?? name;
    qty = Number(o.items[0].qty ?? qty);
  }

  return { pushId, raw:o, shop, table, category, name, qty, price, createdAt, status, providedAt };
}

function fmtTime(ts){
  if(!ts) return "-";
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  const ss = String(d.getSeconds()).padStart(2,"0");
  return `${hh}:${mm}:${ss}`;
}

// 誤タップ防止：2秒以内に同じボタンを2回押したら確定
const armMap = new Map(); // pushId -> armedUntilMs
function isArmed(pushId){
  const until = armMap.get(pushId) || 0;
  return now() <= until;
}
function arm(pushId){
  armMap.set(pushId, now() + 2000);
}

function render(list){
  const cat = $("catFilter").value;
  const tFilter = $("tableFilter").value.trim();
  const hideDone = $("hideDone").value === "1";

  let view = list.slice();

  if(cat !== "all"){
    view = view.filter(x => (x.category || "").toLowerCase() === cat);
  }
  if(tFilter){
    view = view.filter(x => String(x.table) === String(tFilter));
  }
  if(hideDone){
    view = view.filter(x => x.status !== "done");
  }

  // 入った順（createdAt 昇順）で表示（厨房は古い順が見やすい）
  view.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));

  const root = $("list");
  root.innerHTML = "";

  if(view.length === 0){
    root.innerHTML = `<div class="card"><span class="muted">表示する注文がありません</span></div>`;
    return;
  }

  for(const o of view){
    const badge = (o.category === "drink")
      ? `<span class="pill" style="background:#dbeafe;border-color:#3b82f6">ドリンク</span>`
      : (o.category === "food")
      ? `<span class="pill" style="background:#dcfce7;border-color:#16a34a">フード</span>`
      : `<span class="pill">未分類</span>`;

    const doneBadge = (o.status === "done")
      ? `<span class="pill" style="background:#e5e7eb">提供済 ${fmtTime(o.providedAt)}</span>`
      : `<span class="pill" style="background:#fff7ed;border-color:#f59e0b">未提供</span>`;

    const armed = isArmed(o.pushId);

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="kline">
        ${badge}
        ${doneBadge}
        <span class="pill">T${esc(o.table || "?")}</span>
        <span class="pill mono">${fmtTime(o.createdAt)}</span>
      </div>

      <div class="sep"></div>

      <div class="itemTitle">${esc(o.name || "(no name)")}</div>
      <div class="small">数量：<b>${esc(o.qty)}</b>${o.price!=="" ? ` / 単価：<b>${esc(o.price)}</b>` : ""}</div>

      <div class="sep"></div>

      <div class="row">
        <button class="${o.status === "done" ? "light" : (armed ? "warn" : "done")}" data-act="toggle" data-id="${esc(o.pushId)}">
          ${o.status === "done" ? "未提供に戻す" : (armed ? "もう一回タップで提供済み" : "提供済みにする")}
        </button>
        <button class="light" data-act="copy" data-id="${esc(o.pushId)}">IDコピー</button>
      </div>

      <div class="small muted">pushId: <span class="mono">${esc(o.pushId)}</span></div>
    `;

    div.querySelectorAll("button").forEach(btn=>{
      btn.onclick = async () => {
        const act = btn.getAttribute("data-act");
        const id = btn.getAttribute("data-id");
        if(act === "copy"){
          try{ await navigator.clipboard.writeText(id); }catch{}
          return;
        }
        if(act === "toggle"){
          // ダブルタップ確定（doneへ）
          try{
            const shop = getShop();
            if(!shop) return;

            if(o.status !== "done"){
              if(!isArmed(id)){
                arm(id);
                // 即時UI更新（ボタン文言だけ変えたいが簡易に全更新）
                await refresh();
                return;
              }
              // 確定：提供済みにする
              await rtdbPatch(`orderFeed/${encodeURIComponent(shop)}/${encodeURIComponent(id)}`, {
                status: "done",
                providedAt: now()
              });
              armMap.delete(id);
              await refresh();
              return;
            }else{
              // 提供済み→未提供へ戻す（戻しは1回でOK）
              await rtdbPatch(`orderFeed/${encodeURIComponent(shop)}/${encodeURIComponent(id)}`, {
                status: "new",
                providedAt: null
              });
              await refresh();
              return;
            }
          }catch(e){
            $("status").innerHTML = `<span class="ng">更新失敗</span> ${esc(e.message||e)}`;
          }
        }
      };
    });

    root.appendChild(div);
  }
}

let timer = null;

async function refresh(){
  const shop = getShop();
  if(!shop){
    $("status").innerHTML = `<span class="ng">未ログイン</span> menu.html へ戻ります`;
    setTimeout(()=> location.href = `menu.html?v=${Date.now()}`, 400);
    return;
  }
  $("shopText").textContent = shop;

  try{
    $("status").textContent = "loading...";
    // orderFeed/{shop} の直下に pushId が並ぶ想定
    // createdAtで並べ替えたいので、RESTクエリで orderBy を使う
    // ※ createdAt が無いデータが混ざると並びが崩れるので、まずは 200件取得してローカルで整列。
    const data = await rtdbGet(`orderFeed/${encodeURIComponent(shop)}.json`);
    const list = [];

    if(data && typeof data === "object"){
      for(const [pushId, obj] of Object.entries(data)){
        if(!obj || typeof obj !== "object") continue;
        list.push(normalizeOrder(pushId, obj));
      }
    }

    $("status").innerHTML = `<span class="ok">OK</span> ${list.length} 件（${new Date().toLocaleTimeString()}）`;
    $("debug").textContent = JSON.stringify({
      shop,
      count: list.length,
      filter: { cat: $("catFilter").value, table: $("tableFilter").value.trim(), hideDone: $("hideDone").value }
    }, null, 2);

    render(list);
  }catch(e){
    $("status").innerHTML = `<span class="ng">読込失敗</span> ${esc(e.message||e)}`;
    $("debug").textContent = String(e.stack || e);
    $("list").innerHTML = `<div class="card"><span class="ng">読み込みに失敗しました</span></div>`;
  }
}

function setAuto(){
  const sec = Number($("autoSec").value || 0);
  if(timer){ clearInterval(timer); timer = null; }
  if(sec > 0){
    timer = setInterval(refresh, sec * 1000);
  }
}

$("btnBack").onclick = ()=> location.href = `menu.html?v=${Date.now()}`;
$("btnRefresh").onclick = refresh;
$("autoSec").onchange = setAuto;
$("catFilter").onchange = refresh;
$("tableFilter").oninput = () => { /* 入力中は更新しない */ };
$("tableFilter").onchange = refresh;
$("hideDone").onchange = refresh;

setAuto();
refresh();
</script>
</body>
</html>
