<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>order</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:16px;}
    input,button,select{font-size:16px;padding:10px;}
    button{cursor:pointer}
    .row{display:flex;gap:8px;align-items:center;margin:8px 0}
    .ok{color:#0a7a2a;font-weight:700}
    .ng{color:#b00020;font-weight:700}
    pre{background:#f5f5f5;padding:12px;border-radius:8px;overflow:auto}
    .card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0}
    .muted{color:#666;font-size:12px}
    .h{font-weight:800;margin:0 0 8px 0}
    .histItem{border-top:1px solid #e6e6e6;padding:10px 0}
    .histItem:first-child{border-top:0}
    .small{font-size:12px;color:#444}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  </style>
</head>
<body>
  <h2>注文</h2>

  <div class="card" id="meta"></div>

  <div class="card">
    <div class="row">
      <select id="menuSelect" style="flex:1">
        <option value="">メニューを選択</option>
      </select>
      <input id="qty" type="number" min="1" value="1" style="width:90px">
      <button id="add">追加</button>
    </div>
    <div class="muted">メニューは FBRD: shops/{shop}/menu/drink, shops/{shop}/menu/food から読みます</div>
    <div id="menuStatus" class="muted"></div>
  </div>

  <div class="card">
    <div class="h">カート</div>
    <pre id="cartPre">[]</pre>
    <div class="row">
      <button id="send" style="flex:1">注文送信</button>
      <button id="clear" style="flex:1">クリア</button>
    </div>
    <div id="status"></div>
  </div>

  <!-- テーブル別 注文履歴 -->
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div class="h" style="margin:0;">このテーブルの注文履歴</div>
      <button id="refreshHistory">更新</button>
    </div>
    <div class="muted">読み込み先：shops/{shop}/orders/{table}</div>
    <div id="historyStatus" class="muted"></div>
    <div id="historyList"></div>
  </div>

<script>
/** ===== 設定 ===== */
const DB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com"; // いまのDB
/** =============== */

function qs(name){
  const u = new URL(location.href);
  return (u.searchParams.get(name) || "").trim();
}

function ymdhis(ms){
  const d = new Date(ms);
  const pad = (n)=>String(n).padStart(2,"0");
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

async function getJson(path){
  const url = `${DB_BASE}${path}.json`;
  const res = await fetch(url);
  const text = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${text}`);
  return text ? JSON.parse(text) : null;
}

async function postJson(path, obj){
  const url = `${DB_BASE}${path}.json`;
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(obj)
  });
  const text = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${text}`);
  return JSON.parse(text);
}

/** menu: shops/{shop}/menu/drink と /food を読み、プルダウンに入れる */
async function loadMenu(shop){
  const select = document.getElementById("menuSelect");
  const menuStatus = document.getElementById("menuStatus");

  try{
    menuStatus.textContent = "メニュー読み込み中...";
    const drinkObj = await getJson(`/shops/${encodeURIComponent(shop)}/menu/drink`);
    const foodObj  = await getJson(`/shops/${encodeURIComponent(shop)}/menu/food`);

    // Firebaseの形が「idキー: {name,price,...}」でも「配列」でも拾えるようにする
    const normalize = (obj, cat)=>{
      if(!obj) return [];
      if(Array.isArray(obj)){
        return obj.filter(Boolean).map(x=>({ ...x, cat: x.cat || cat, id: x.id || "" }));
      }
      if(typeof obj === "object"){
        return Object.keys(obj).map(k=>({ id:k, cat, ...obj[k] }));
      }
      return [];
    };

    const drink = normalize(drinkObj, "drink");
    const food  = normalize(foodObj,  "food");
    let menu = [...drink, ...food];

    // 並び：idの数値部分で昇順（d1,d2,... / f1,f2,...）にしたい場合
    const numPart = (id)=> {
      const m = String(id||"").match(/(\d+)/);
      return m ? Number(m[1]) : 999999;
    };
    menu.sort((a,b)=>{
      const ac = (a.cat||"").localeCompare(b.cat||""); // catで先に分けたいなら
      if(ac !== 0) return ac;
      return numPart(a.id) - numPart(b.id);
    });

    // options 再作成
    select.innerHTML = `<option value="">メニューを選択</option>`;
    for(const m of menu){
      const name = m.name ?? "(no name)";
      const price = m.price ?? "";
      const label = `${name} (${price})`;
      const value = JSON.stringify({
        id: m.id || "",
        cat: m.cat || "",
        name,
        price,
      });
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label;
      select.appendChild(opt);
    }

    menuStatus.innerHTML = `<span class="ok">メニュー読み込みOK</span>（${menu.length}件）`;
  }catch(e){
    menuStatus.innerHTML = `<span class="ng">メニュー読み込み失敗</span> <span class="small">${String(e.message||e)}</span>`;
  }
}

/** テーブル別注文履歴：shops/{shop}/orders/{table} を取得して表示 */
async function refreshHistory(shop, table){
  const st = document.getElementById("historyStatus");
  const list = document.getElementById("historyList");
  try{
    st.textContent = "履歴読み込み中...";
    list.innerHTML = "";

    const obj = await getJson(`/shops/${encodeURIComponent(shop)}/orders/${encodeURIComponent(table)}`);

    if(!obj){
      st.textContent = "履歴なし";
      return;
    }

    // pushIDのオブジェクト → 配列化
    const arr = Object.keys(obj).map(key => ({ key, ...obj[key] }));

    // createdAt で新しい順
    arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

    st.innerHTML = `<span class="ok">履歴OK</span>（${arr.length}件）`;

    for(const o of arr){
      const items = Array.isArray(o.items) ? o.items : (o.items ? Object.values(o.items) : []);
      const total = o.total ?? "";
      const when = o.createdAt ? ymdhis(o.createdAt) : "-";

      // 1件の表示（店側が見たい形式に近い形）
      const lines = items.map(it=>{
        const n = it.name ?? "";
        const q = it.qty ?? 1;
        const p = it.price ?? "";
        return `・${n} ×${q}（${p}）`;
      }).join("<br>");

      const div = document.createElement("div");
      div.className = "histItem";
      div.innerHTML = `
        <div class="small mono">#${o.key} / ${when} / token:${o.token||"-"}</div>
        <div>${lines || "<span class='muted'>(itemsなし)</span>"}</div>
        <div class="small">total: <b>${total}</b></div>
      `;
      list.appendChild(div);
    }

  }catch(e){
    st.innerHTML = `<span class="ng">履歴読み込み失敗</span> <span class="small">${String(e.message||e)}</span>`;
  }
}

/** ====== 初期パラメータ ====== */
const shop = qs("shop");
const table = qs("table");
const token = qs("token");

const meta = document.getElementById("meta");
meta.innerHTML = `
  <div>shop: <b>${shop||"(none)"}</b></div>
  <div>table: <b>${table||"(none)"}</b></div>
  <div>token: <b style="font-size:12px" class="mono">${token||"(none)"}</b></div>
  <div class="muted mono">URL: ${location.href}</div>
`;

if(!shop || !table || !token){
  document.getElementById("status").innerHTML = `<span class="ng">URL params が不足です（shop/table/token 必須）</span>`;
}

/** ====== カート ====== */
let cart = [];
const cartPre = document.getElementById("cartPre");
function renderCart(){
  cartPre.textContent = JSON.stringify(cart, null, 2);
}
renderCart();

/** 追加 */
document.getElementById("add").onclick = () => {
  const sel = document.getElementById("menuSelect").value;
  const qty = Number(document.getElementById("qty").value || 1);
  if(!sel) return;

  const m = JSON.parse(sel);
  cart.push({ id:m.id, cat:m.cat, name:m.name, price:m.price, qty: qty });
  document.getElementById("qty").value = 1;
  renderCart();
};

/** クリア */
document.getElementById("clear").onclick = () => {
  cart = [];
  renderCart();
  document.getElementById("status").textContent = "";
};

/** 送信（shops/{shop}/orders/{table} にPOST） */
document.getElementById("send").onclick = async () => {
  const statusEl = document.getElementById("status");
  try{
    if(!shop || !table || !token) return;

    if(cart.length === 0){
      statusEl.innerHTML = `<span class="ng">注文が空です</span>`;
      return;
    }

    const ts = Date.now();
    const total = cart.reduce((sum,it)=>sum + (Number(it.price||0)*Number(it.qty||1)), 0);

    const orderObj = {
      createdAt: ts,
      shop, table: String(table), token,
      items: cart,
      total: total,
      ua: navigator.userAgent
    };

    statusEl.textContent = "sending...";

    // ここが重要：テーブル別の正本
    await postJson(`/shops/${encodeURIComponent(shop)}/orders/${encodeURIComponent(table)}`, orderObj);

    statusEl.innerHTML = `<span class="ok">送信OK</span>`;
    cart = [];
    renderCart();

    // 送信後に履歴も更新
    await refreshHistory(shop, table);

  }catch(e){
    statusEl.innerHTML =
      `<span class="ng">送信失敗</span><div class="small mono">${String(e.message||e)}</div>`;
  }
};

/** 履歴更新ボタン */
document.getElementById("refreshHistory").onclick = () => refreshHistory(shop, table);

/** 起動時：メニュー読み込み＋履歴表示 */
if(shop){
  loadMenu(shop);
}
if(shop && table){
  refreshHistory(shop, table);
}
</script>
</body>
</html>
