<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>izakaya-relay</title>
</head>

<body style="margin:0">
  <div id="msg" style="padding:16px;font-family:sans-serif;white-space:pre-wrap;">
    読み込み中…
  </div>

<script>
const FIREBASE_DB_URL = "https://izakayaorder-default-rtdb.firebaseio.com";
const THUNKABLE_URL   = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH";

const msg = (t) => document.getElementById("msg").textContent = t;

const params = new URLSearchParams(location.search);
const shop  = params.get("shop");
const table = params.get("table");
const token = params.get("token");

if (!shop || !table || !token) {
  msg("missing params:\nshop / table / token\n\nURL例:\n?shop=daboya&table=9&token=TEST999");
  throw new Error("missing params");
}

const payload = { shop, table, token, createdAt: Date.now() };
const url = `${FIREBASE_DB_URL}/sessions/${encodeURIComponent(token)}.json`;

msg("1) Firebaseへ書き込み中...\n" + url);

fetch(url, {
  method: "PUT",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(payload)
})
.then(async (res) => {
  const text = await res.text();
  if (!res.ok) {
    msg("Firebase書き込みNG\n\nStatus: " + res.status + "\nBody:\n" + text);
    throw new Error("write failed");
  }
  msg("2) Firebase書き込みOK\nBody:\n" + text + "\n\n3秒後にThunkableへ移動します…");
  setTimeout(() => {
    location.href = THUNKABLE_URL + "#token=" + encodeURIComponent(token);
  }, 3000);
})
.catch((e) => {
  console.error(e);
});
</script>
</body>
</html>
