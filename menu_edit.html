<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メニュー編集</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:16px; max-width:1100px; margin:0 auto;}
    h1{font-size:22px;margin:0 0 8px}
    .sub{font-size:12px;color:#6b7280;margin-bottom:12px;line-height:1.6}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:12px 0;background:#fff;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    input,select,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #ccc}
    button{cursor:pointer;border:0;font-weight:900}
    button.dark{background:#111827;color:#fff}
    button.light{background:#f3f4f6;color:#111827;border:1px solid #ddd}
    button.save{background:#16a34a;color:#fff}
    button.del{background:#ef4444;color:#fff}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .muted{color:#6b7280}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #ddd;font-weight:900;font-size:12px}
    .badgeDrink{background:#dbeafe;border-color:#3b82f6}
    .badgeFood{background:#dcfce7;border-color:#16a34a}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #eee;padding:10px;vertical-align:top}
    th{font-size:12px;color:#6b7280;text-align:left}
    td .mini{font-size:12px;color:#6b7280}
    .wId{width:120px}
    .wPrice{width:140px}
    .wBtns{width:220px}
    .right{margin-left:auto}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}

    /* 印刷用 */
    #printArea{display:none;}
    @media print{
      body{padding:0;max-width:none}
      .noPrint{display:none !important;}
      #printArea{display:block;}
      .printCard{border:1px solid #ddd;border-radius:10px;padding:10px;margin:10px 0;}
      .printTitle{font-weight:900;margin-bottom:6px;}
      .printLine{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:12px;white-space:pre-wrap}
    }
  </style>
</head>
<body>
  <h1>メニュー編集</h1>
  <div class="sub">
    /shops/{shop}/menu/drink と /shops/{shop}/menu/food を編集します。<br>
    値は <span class="mono">{name, price}</span> 形式で保存します（既存が文字列でも読み込みは吸収）。
  </div>

  <div class="card noPrint">
    <div class="row">
      <div>shop: <b id="shopText" class="mono">-</b></div>
      <div class="right row">
        <button id="btnBack" class="light">← menuへ</button>
        <button id="btnReload" class="dark">再読み込み</button>
        <button id="btnPrint" class="light">番号順で印刷</button>
      </div>
    </div>
    <div id="status" class="muted" style="margin-top:10px;">-</div>
  </div>

  <div class="card noPrint">
    <div class="row">
      <span class="pill badgeDrink">ドリンク追加</span>
      <input id="addDrinkId" class="mono" placeholder="ID例: d1" style="width:140px">
      <input id="addDrinkName" placeholder="メニュー名" style="flex:1;min-width:220px">
      <input id="addDrinkPrice" class="mono" placeholder="価格" inputmode="numeric" style="width:140px">
      <button id="btnAddDrink" class="save">追加</button>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="pill badgeFood">フード追加</span>
      <input id="addFoodId" class="mono" placeholder="ID例: f101" style="width:140px">
      <input id="addFoodName" placeholder="メニュー名" style="flex:1;min-width:220px">
      <input id="addFoodPrice" class="mono" placeholder="価格" inputmode="numeric" style="width:140px">
      <button id="btnAddFood" class="save">追加</button>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px;line-height:1.6">
      IDの数字順で並び替えて表示します（例: d1,d2... / f101,f102...）。既存IDに上書きすると更新になります。
    </div>
  </div>

  <div class="card noPrint">
    <div class="row">
      <div class="pill badgeDrink">ドリンク一覧</div>
      <div class="right muted" id="drinkCount">-</div>
    </div>
    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th class="wId">ID</th>
            <th>メニュー名</th>
            <th class="wPrice">価格</th>
            <th class="wBtns">操作</th>
          </tr>
        </thead>
        <tbody id="drinkTbody"></tbody>
      </table>
    </div>
  </div>

  <div class="card noPrint">
    <div class="row">
      <div class="pill badgeFood">フード一覧</div>
      <div class="right muted" id="foodCount">-</div>
    </div>
    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th class="wId">ID</th>
            <th>メニュー名</th>
            <th class="wPrice">価格</th>
            <th class="wBtns">操作</th>
          </tr>
        </thead>
        <tbody id="foodTbody"></tbody>
      </table>
    </div>
  </div>

  <div class="card noPrint">
    <div class="muted" style="font-size:12px;">デバッグ</div>
    <pre id="debug" class="mono">-</pre>
  </div>

  <!-- 印刷用（@media print でのみ表示） -->
  <div id="printArea"></div>

  <script src="shop_common.js"></script>
  <script>
  (() => {
    const $ = (id)=>document.getElementById(id);

    function must(fnName){
      if(typeof window[fnName] !== "function"){
        throw new Error(`shop_common.js の ${fnName}() が見つかりません`);
      }
    }
    must("requireLogin");
    must("getShop");
    must("getPin");
    must("rtdbGet");
    must("rtdbPut");
    must("rtdbPatch");
    must("esc");

    if(!requireLogin()) return;

    const shop = getShop();
    $("shopText").textContent = shop || "-";

    function setStatus(html){ $("status").innerHTML = html || ""; }
    function idNumber(id){
      const m = String(id||"").match(/\d+/);
      return m ? Number(m[0]) : 999999;
    }
    function sortById(a,b){
      return idNumber(a.id) - idNumber(b.id) || String(a.id).localeCompare(String(b.id));
    }
    function normItem(v){
      if(v && typeof v === "object"){
        return { name: String(v.name ?? ""), price: Number(v.price ?? 0) };
      }
      // 旧: 文字列だけ入ってた場合
      return { name: String(v ?? ""), price: 0 };
    }
    function parsePrice(x){
      const n = Number(String(x||"").replace(/[^\d.-]/g,""));
      return Number.isFinite(n) ? n : 0;
    }

    async function loadCat(cat){
      const path = `shops/${encodeURIComponent(shop)}/menu/${encodeURIComponent(cat)}`;
      const r = await rtdbGet(path);
      if(!r.ok) throw new Error(`GET失敗: ${r.status} ${r.url}`);
      const obj = r.json;
      const arr = [];
      if(obj && typeof obj === "object"){
        for(const [id, v] of Object.entries(obj)){
          const x = normItem(v);
          arr.push({ cat, id, name:x.name, price:x.price });
        }
      }
      arr.sort(sortById);
      return { obj: obj||{}, arr };
    }

    function rowHtml(item){
      const rid = `${item.cat}_${item.id}`;
      return `
        <tr data-cat="${esc(item.cat)}" data-id="${esc(item.id)}">
          <td class="mono wId"><b>${esc(item.id)}</b></td>
          <td>
            <input id="${esc(rid)}_name" value="${esc(item.name)}" style="width:100%;box-sizing:border-box">
          </td>
          <td class="wPrice">
            <input id="${esc(rid)}_price" class="mono" value="${esc(String(item.price ?? 0))}" inputmode="numeric" style="width:100%;box-sizing:border-box">
            <div class="mini">数値のみ</div>
          </td>
          <td class="wBtns">
            <div class="row" style="margin:0">
              <button class="save" data-act="save">保存</button>
              <button class="del" data-act="del">削除</button>
            </div>
          </td>
        </tr>
      `;
    }

    function render(cat, arr){
      const tbody = (cat==="drink") ? $("drinkTbody") : $("foodTbody");
      tbody.innerHTML = arr.map(rowHtml).join("");
      if(cat==="drink") $("drinkCount").textContent = `${arr.length} 件`;
      if(cat==="food")  $("foodCount").textContent  = `${arr.length} 件`;

      tbody.querySelectorAll("tr").forEach(tr=>{
        tr.querySelectorAll("button").forEach(btn=>{
          btn.onclick = async ()=>{
            const act = btn.getAttribute("data-act");
            const cat = tr.getAttribute("data-cat");
            const id  = tr.getAttribute("data-id");
            const rid = `${cat}_${id}`;
            const name = document.getElementById(`${rid}_name`).value.trim();
            const price = parsePrice(document.getElementById(`${rid}_price`).value);

            if(act === "save"){
              try{
                const path = `shops/${encodeURIComponent(shop)}/menu/${encodeURIComponent(cat)}/${encodeURIComponent(id)}`;
                const payload = { name, price };
                const r = await rtdbPut(path, payload);
                if(!r.ok) throw new Error(`PUT失敗: ${r.status}`);
                setStatus(`<span class="ok">OK</span> 保存しました（${esc(cat)} / ${esc(id)}）`);
                await reloadAll(false);
              }catch(e){
                setStatus(`<span class="ng">NG</span> ${esc(String(e.message||e))}`);
              }
              return;
            }

            if(act === "del"){
              if(!confirm(`${cat}/${id} を削除します。よろしいですか？`)) return;
              try{
                const path = `shops/${encodeURIComponent(shop)}/menu/${encodeURIComponent(cat)}/${encodeURIComponent(id)}`;
                const r = await rtdbPut(path, null);
                if(!r.ok) throw new Error(`削除失敗: ${r.status}`);
                setStatus(`<span class="ok">OK</span> 削除しました（${esc(cat)} / ${esc(id)}）`);
                await reloadAll(false);
              }catch(e){
                setStatus(`<span class="ng">NG</span> ${esc(String(e.message||e))}`);
              }
              return;
            }
          };
        });
      });
    }

    async function addItem(cat){
      const idEl   = (cat==="drink") ? $("addDrinkId") : $("addFoodId");
      const nameEl = (cat==="drink") ? $("addDrinkName") : $("addFoodName");
      const prEl   = (cat==="drink") ? $("addDrinkPrice") : $("addFoodPrice");

      const id = idEl.value.trim();
      const name = nameEl.value.trim();
      const price = parsePrice(prEl.value);

      if(!id || !name){
        setStatus(`<span class="ng">NG</span> ID と メニュー名 は必須です`);
        return;
      }

      try{
        const path = `shops/${encodeURIComponent(shop)}/menu/${encodeURIComponent(cat)}/${encodeURIComponent(id)}`;
        const payload = { name, price };
        const r = await rtdbPut(path, payload);
        if(!r.ok) throw new Error(`追加失敗: ${r.status}`);

        idEl.value = "";
        nameEl.value = "";
        prEl.value = "";

        setStatus(`<span class="ok">OK</span> 追加/更新しました（${esc(cat)} / ${esc(id)}）`);
        await reloadAll(false);
      }catch(e){
        setStatus(`<span class="ng">NG</span> ${esc(String(e.message||e))}`);
      }
    }

    function buildPrintArea(drinks, foods){
      const area = document.getElementById("printArea");
      const now = new Date().toLocaleString("ja-JP");

      const lines = [];
      lines.push(`<div class="printCard">`);
      lines.push(`<div class="printTitle">メニュー一覧（番号順）</div>`);
      lines.push(`<div class="printLine">shop: ${esc(shop)} / printed: ${esc(now)}</div>`);
      lines.push(`</div>`);

      const block = (title, arr) => {
        const text = arr.map(x=>{
          const p = Number(x.price||0);
          return `${x.id}\t${x.name}\t${p}`;
        }).join("\n");
        return `
          <div class="printCard">
            <div class="printTitle">${esc(title)}</div>
            <div class="printLine">${esc(text || "(なし)")}</div>
          </div>
        `;
      };

      lines.push(block("ドリンク", drinks));
      lines.push(block("フード", foods));

      area.innerHTML = lines.join("");
    }

    async function reloadAll(showLoading=true){
      try{
        if(showLoading) setStatus("loading...");
        const d = await loadCat("drink");
        const f = await loadCat("food");

        render("drink", d.arr);
        render("food", f.arr);

        buildPrintArea(d.arr, f.arr);

        $("debug").textContent = JSON.stringify({
          shop,
          drinkCount: d.arr.length,
          foodCount: f.arr.length,
          paths: {
            drink: `/shops/${shop}/menu/drink`,
            food: `/shops/${shop}/menu/food`
          }
        }, null, 2);

        if(showLoading) setStatus(`<span class="ok">OK</span> 読み込み完了`);
      }catch(e){
        setStatus(`<span class="ng">NG</span> ${esc(String(e.message||e))}`);
        $("debug").textContent = String(e.stack || e);
      }
    }

    $("btnBack").onclick = ()=> location.href = `menu.html?v=${Date.now()}`;
    $("btnReload").onclick = ()=> reloadAll(true);
    $("btnPrint").onclick = ()=>{
      // 印刷内容は printArea に作ってあるので、そのまま印刷
      window.print();
    };

    $("btnAddDrink").onclick = ()=> addItem("drink");
    $("btnAddFood").onclick  = ()=> addItem("food");

    reloadAll(true);
  })();
  </script>
</body>
</html>
