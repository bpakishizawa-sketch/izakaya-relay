<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - 会計</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:18px; max-width:1200px; margin:0 auto; background:#f6f7f9;}
    h1{font-size:22px;margin:0 0 8px}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:10px 0;background:#fff;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .muted{color:#6b7280}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    select,input{font-size:16px;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
    button{font-size:14px;padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:900}
    button.dark{background:#111827;color:#fff}
    button.light{background:#f3f4f6;color:#111827;border:1px solid #ddd}
    button.green{background:#16a34a;color:#fff}
    button.red{background:#dc2626;color:#fff}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #ddd;font-weight:900;font-size:12px}
    .grid2{display:grid;grid-template-columns:1fr; gap:12px; align-items:start;}
    @media(min-width:860px){ .grid2{grid-template-columns: 1fr 1fr;} }

    .tableGrid{display:grid;grid-template-columns: repeat(6, 1fr); gap:10px; margin-top:10px;}
    @media(max-width:860px){ .tableGrid{grid-template-columns: repeat(4, 1fr);} }
    .tbtn{padding:14px 10px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:900}
    .tbtn.active{border-color:#3b82f6;background:#dbeafe}
    .tbtn.request{border-color:#f59e0b;background:#fff7ed}
    .tmeta{font-size:11px;color:#6b7280;margin-top:4px}

    .lines{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .line{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed #eee;padding-top:8px}
    .line:first-child{border-top:0;padding-top:0}
    .sumBig{font-size:22px;font-weight:900}
    .hr{height:1px;background:#eee;margin:12px 0}

    /* alert banner */
    .alertBanner{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 10px;
      z-index: 9999;
      background: #dc2626;
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      display: none;
      max-width: 92vw;
      text-align: center;
    }

    /* print area */
    #printArea{background:#fff; padding:14px; border-radius:12px; border:1px solid #e5e7eb;}
    @media print{
      body{background:#fff}
      .noPrint{display:none !important}
      #printArea{border:0; padding:0}
    }

    details summary{cursor:pointer;font-weight:900;color:#374151}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}
  </style>
</head>
<body>
  <div id="alertBanner" class="alertBanner">会計依頼！</div>

  <h1>会計（Checkout）</h1>

  <div class="card noPrint">
    <div class="row">
      <span class="pill">shop: <b id="shopText" class="mono">-</b></span>
      <span class="pill">選択テーブル: <b id="selTableText" class="mono">-</b></span>

      <button id="btnBack" class="light">← menuへ</button>
      <button id="btnRefresh" class="dark">更新</button>

      <label class="row">
        <span class="muted" style="font-size:12px">自動更新</span>
        <select id="autoSec">
          <option value="0">OFF</option>
          <option value="2">2秒</option>
          <option value="5">5秒</option>
          <option value="10" selected>10秒</option>
        </select>
      </label>

      <button id="btnSound" class="light">🔔音OFF</button>
      <button id="btnBeep" class="light">テスト</button>
    </div>

    <div id="status" class="muted" style="margin-top:8px;">-</div>
  </div>

  <div class="grid2">
    <!-- left -->
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:900">テーブル状況（着席中のみ）</div>
        <div class="muted" style="font-size:12px">webActiveSessions に active/token があるテーブル</div>
      </div>

      <div class="hr"></div>

      <div class="row" style="gap:8px">
        <span class="pill">着席 <b id="activeCount" class="mono">0</b></span>
        <span class="pill" style="background:#fff7ed;border-color:#f59e0b">会計依頼 <b id="reqCount" class="mono">0</b></span>
      </div>

      <div id="tableGrid" class="tableGrid"></div>

      <details class="card" style="display:none;">
        <summary>デバッグ</summary>
        <pre id="debug" class="mono">-</pre>
      </details>
    </div>

    <!-- right -->
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:900">会計明細</div>
        <div class="row noPrint" style="gap:8px">
          <button id="btnPdf" class="light">PDF</button>
          <button id="btnConfirm" class="green">会計確定</button>
        </div>
      </div>

      <div class="hr"></div>

      <div id="printArea">
        <div class="row" style="justify-content:space-between">
          <div>
            <div class="muted" style="font-size:12px">テーブル</div>
            <div style="font-weight:900;font-size:18px" id="billTable">-</div>
          </div>
          <div style="text-align:right">
            <div class="muted" style="font-size:12px">合計</div>
            <div class="sumBig mono" id="billTotal">-</div>
          </div>
        </div>

        <div class="muted" style="font-size:12px;margin-top:6px" id="billMeta">-</div>

        <div class="hr"></div>

        <div class="muted" style="font-size:12px;margin-bottom:6px">※メニュー名と金額のみ表示（ID/コードは非表示）</div>
        <div id="billLines" class="lines"></div>
      </div>

      <div class="muted noPrint" id="confirmMsg" style="margin-top:10px;">-</div>
    </div>
  </div>

  <!-- common を先に読む（requireAuth / getShop / rtdbGet/Put など） -->
  <script src="shop_common.js"></script>

  <script>
  (async () => {
    await requireAuth();

    function $(id){ return document.getElementById(id); }
    function escLocal(s){
      return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }
    const esc2 = (typeof esc === "function") ? esc : escLocal;
    function now(){ return Date.now(); }

    // common に getShop があれば使う（無ければ localStorage から）
    function getShopLocal(){
      return (localStorage.getItem("shopCode") || "").trim();
    }
    const getShop2 = (typeof getShop === "function") ? getShop : getShopLocal;

    // common に rtdbGet/Put があれば使う（無ければこのページ内でREST）
    const DB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";

    async function rtdbGetLocal(path){
      const url = `${DB_BASE}/${path}.json`;
      const res = await fetch(url);
      const txt = await res.text();
      if(!res.ok) throw new Error(`HTTP ${res.status} ${txt}`);
      return JSON.parse(txt || "null");
    }
    async function rtdbPutLocal(path, data){
      const url = `${DB_BASE}/${path}.json`;
      const res = await fetch(url, {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(data)
      });
      const txt = await res.text();
      if(!res.ok) throw new Error(`HTTP ${res.status} ${txt}`);
      return JSON.parse(txt || "null");
    }

    async function rtdbGet2(path){
      if(typeof rtdbGet === "function"){
        const r = await rtdbGet(path);
        return (r && typeof r === "object" && "json" in r) ? r.json : r;
      }
      return rtdbGetLocal(path);
    }
    async function rtdbPut2(path, data){
      if(typeof rtdbPut === "function"){
        const r = await rtdbPut(path, data);
        return (r && typeof r === "object" && "json" in r) ? r.json : r;
      }
      return rtdbPutLocal(path, data);
    }
    async function rtdbDelete(path){
      return rtdbPut2(path, null);
    }

    function yen(n){
      const x = Number(n||0);
      return x.toLocaleString("ja-JP") + " 円";
    }
    function fmt(ts){
      if(!ts) return "-";
      try{ return new Date(Number(ts)).toLocaleString("ja-JP"); }catch{ return String(ts); }
    }

    function showBanner(msg){
      const el = $("alertBanner");
      el.textContent = msg || "会計依頼！";
      el.style.display = "block";
      clearTimeout(showBanner._t);
      showBanner._t = setTimeout(()=>{ el.style.display = "none"; }, 3500);
    }

    let soundEnabled = false;
    let audioCtx = null;

    function ensureAudio(){
      if(audioCtx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    function beepOnce(){
      if(!soundEnabled) return;
      try{
        ensureAudio();
        if(!audioCtx) return;
        if(audioCtx.state === "suspended") audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = 880;
        g.gain.value = 0.06;
        o.connect(g); g.connect(audioCtx.destination);
        o.start();
        setTimeout(()=>{ o.stop(); }, 220);
      }catch{}
    }
    function beep3sec(){
      if(!soundEnabled) return;
      const pattern = [0, 350, 700, 1050, 1400, 1750, 2100, 2450, 2800];
      for(const ms of pattern){
        setTimeout(()=>beepOnce(), ms);
      }
      try{ navigator.vibrate && navigator.vibrate([120,60,120,60,120]); }catch{}
    }

    function lastReqKey(shop){ return `checkout_lastMax_${shop}`; }
    function loadLastMax(shop){ return Number(localStorage.getItem(lastReqKey(shop)) || 0); }
    function saveLastMax(shop, n){ localStorage.setItem(lastReqKey(shop), String(Number(n||0))); }

    let timer = null;
    let selectedTable = "";
    let activeSessions = {};
    let checkoutRequests = {};

    function setStatus(html){ $("status").innerHTML = html || ""; }
    function setConfirmMsg(html){ $("confirmMsg").innerHTML = html || ""; }

    function pickTable(t){
      selectedTable = String(t||"");
      $("selTableText").textContent = selectedTable ? `T${selectedTable}` : "-";
      renderBill();
    }

    function renderTables(){
      const grid = $("tableGrid");
      grid.innerHTML = "";

      const activeTables = Object.keys(activeSessions || {}).sort((a,b)=>Number(a)-Number(b));
      const reqTables = new Set(Object.keys(checkoutRequests || {}));

      $("activeCount").textContent = String(activeTables.length);
      $("reqCount").textContent = String(reqTables.size);

      if(activeTables.length === 0){
        grid.innerHTML = `<div class="muted"><small>着席中のテーブルがありません</small></div>`;
        return;
      }

      for(const t of activeTables){
        const sess = activeSessions[t] || {};
        const hasReq = reqTables.has(String(t));

        const btn = document.createElement("button");
        btn.className = "tbtn" + (String(t)===String(selectedTable) ? " active" : "") + (hasReq ? " request" : "");
        btn.innerHTML = `
          <div>T${esc2(t)}</div>
          <div class="tmeta mono">${hasReq ? "会計依頼あり" : (sess.token ? "着席中" : "")}</div>
        `;
        btn.onclick = ()=> pickTable(t);
        grid.appendChild(btn);
      }

      if(!selectedTable){
        const firstReq = activeTables.find(t => reqTables.has(String(t)));
        pickTable(firstReq || activeTables[0]);
      }else{
        if(!activeSessions[selectedTable]){
          pickTable(activeTables[0]);
        }
      }
    }

    function flattenOrdersFromReq(req){
      const lines = [];
      if(!req || !Array.isArray(req.orders)) return lines;

      for(const o of req.orders){
        const items = Array.isArray(o.items) ? o.items : [];
        for(const it of items){
          const name = String(it.name||"");
          const qty = Number(it.qty||0);
          const price = Number(it.price||0);
          if(!name) continue;
          lines.push({ name, qty, price, sub: price*qty });
        }
      }
      return lines;
    }

    function renderBill(){
      const t = selectedTable;
      const req = checkoutRequests && t ? checkoutRequests[t] : null;

      $("billTable").textContent = t ? `T${t}` : "-";
      $("billTotal").textContent = req ? yen(req.total||0) : "-";

      if(!req){
        $("billMeta").textContent = "会計依頼はありません（テーブルを選択してください）";
        $("billLines").innerHTML = `<div class="muted"><small>明細がありません</small></div>`;
        $("btnConfirm").disabled = true;
        return;
      }

      $("btnConfirm").disabled = false;

      const meta = `依頼時刻: ${fmt(req.requestedAt)} / token: ${String(req.token||"") ? "あり" : "-"}`;
      $("billMeta").textContent = meta;

      const lines = flattenOrdersFromReq(req);

      if(lines.length === 0){
        $("billLines").innerHTML = `<div class="muted"><small>明細がありません（ordersが空）</small></div>`;
        return;
      }

      const map = new Map();
      for(const x of lines){
        const k = x.name + "|" + x.price;
        const cur = map.get(k) || { name:x.name, price:x.price, qty:0, sub:0 };
        cur.qty += x.qty;
        cur.sub += x.sub;
        map.set(k, cur);
      }
      const merged = Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name,"ja"));

      $("billLines").innerHTML = merged.map(x=>`
        <div class="line">
          <div>${esc2(x.name)} <span class="muted">x${esc2(String(x.qty))}</span></div>
          <div class="mono">${esc2(String(x.price))} / ${esc2(yen(x.sub))}</div>
        </div>
      `).join("");
    }

    function detectNewCheckout(shop){
      let maxRequestedAt = 0;
      for(const t of Object.keys(checkoutRequests||{})){
        const r = checkoutRequests[t];
        const ts = Number(r?.requestedAt||0);
        if(ts > maxRequestedAt) maxRequestedAt = ts;
      }

      const last = loadLastMax(shop);
      if(!last){
        saveLastMax(shop, maxRequestedAt);
        return;
      }
      if(maxRequestedAt > last){
        const newestTable = Object.keys(checkoutRequests||{})
          .sort((a,b)=>Number(checkoutRequests[b]?.requestedAt||0)-Number(checkoutRequests[a]?.requestedAt||0))[0];
        showBanner(`会計依頼！ T${newestTable || ""}`.trim());
        beep3sec();
        saveLastMax(shop, maxRequestedAt);
      }
    }

    async function refresh(){
      const shop = getShop2();
      if(!shop){
        setStatus(`<span class="ng">未ログイン</span> menu.html へ戻ります`);
        setTimeout(()=> location.href = `menu.html?v=${Date.now()}`, 400);
        return;
      }
      $("shopText").textContent = shop;

      try{
        setStatus(`<span class="mono">loading...</span>`);

        const sess = await rtdbGet2(`webActiveSessions/${encodeURIComponent(shop)}`);
        activeSessions = (sess && typeof sess==="object") ? sess : {};

        const filtered = {};
        for(const [t, s] of Object.entries(activeSessions)){
          if(!s || typeof s!=="object") continue;
          if(s.active === false) continue;
          if(!s.token) continue;
          filtered[String(t)] = s;
        }
        activeSessions = filtered;

        const req = await rtdbGet2(`shops/${encodeURIComponent(shop)}/checkoutRequests`);
        checkoutRequests = (req && typeof req==="object") ? req : {};

        detectNewCheckout(shop);

        renderTables();
        renderBill();

        setStatus(`<span class="ok">OK</span> 着席:${Object.keys(activeSessions).length} / 会計依頼:${Object.keys(checkoutRequests).length} （${new Date().toLocaleTimeString()}）`);

        const dbg = $("debug");
        if(dbg){
          dbg.textContent = JSON.stringify({
            shop,
            activeTables: Object.keys(activeSessions),
            checkoutTables: Object.keys(checkoutRequests),
            selectedTable
          }, null, 2);
        }

      }catch(e){
        setStatus(`<span class="ng">読込失敗</span> ${esc2(e.message||e)}`);
      }
    }

    function setAuto(){
      const sec = Number($("autoSec").value || 0);
      if(timer){ clearInterval(timer); timer = null; }
      if(sec > 0){
        timer = setInterval(refresh, sec * 1000);
      }
    }

    $("btnBack").onclick = ()=> location.href = `menu.html?v=${Date.now()}`;
    $("btnRefresh").onclick = refresh;
    $("autoSec").onchange = setAuto;

    $("btnSound").onclick = async ()=>{
      soundEnabled = !soundEnabled;
      $("btnSound").textContent = soundEnabled ? "🔔音ON" : "🔔音OFF";
      if(soundEnabled){
        try{
          ensureAudio();
          if(audioCtx && audioCtx.state === "suspended"){
            await audioCtx.resume();
          }
        }catch{}
      }
    };
    $("btnBeep").onclick = ()=>{
      soundEnabled = true;
      $("btnSound").textContent = "🔔音ON";
      beep3sec();
    };

    $("btnPdf").onclick = ()=>{
      window.print();
    };

    $("btnConfirm").onclick = async ()=>{
      const shop = getShop2();
      const t = selectedTable;
      if(!shop || !t){
        setConfirmMsg(`<span class="ng">テーブル未選択</span>`);
        return;
      }
      const req = checkoutRequests[t];
      if(!req){
        setConfirmMsg(`<span class="ng">このテーブルに会計依頼がありません</span>`);
        return;
      }

      if(!confirm(`T${t} の会計を確定します。\ncheckoutRequests / orders / webActiveSessions を削除します。`)){
        return;
      }

      $("btnConfirm").disabled = true;
      setConfirmMsg(`<span class="mono">処理中...</span>`);

      try{
        await rtdbDelete(`shops/${encodeURIComponent(shop)}/checkoutRequests/${encodeURIComponent(String(t))}`);
        await rtdbDelete(`shops/${encodeURIComponent(shop)}/orders/${encodeURIComponent(String(t))}`);
        await rtdbDelete(`webActiveSessions/${encodeURIComponent(shop)}/${encodeURIComponent(String(t))}`);

        setConfirmMsg(`<span class="ok">会計確定しました</span>（T${esc2(t)} をリセット）`);
        selectedTable = "";
        await refresh();

      }catch(e){
        setConfirmMsg(`<span class="ng">失敗</span> ${esc2(e.message||e)}`);
      }finally{
        $("btnConfirm").disabled = false;
      }
    };

    setAuto();
    refresh();
  })();
  </script>
</body>
</html>
