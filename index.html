<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>izakaya-relay</title>
</head>
<body style="margin:0">
  <div id="msg" style="padding:16px;font-family:sans-serif;white-space:pre-wrap;">loading...</div>

<script>
(() => {
  // ====== 設定（ここだけ自分のに合わせる）======
  const VERSION        = "relay-fixedqr-20260112-1";
  const FIREBASE_DB_URL = "https://izakayaorder-default-rtdb.firebaseio.com";
  const THUNKABLE_URL   = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH";
  // 書き込み先（あなたの現状に合わせて固定）
  const ACTIVE_PATH = "webActiveSessions"; // /webActiveSessions/{shop}/{table}
  const SESS_PATH   = "webSessions";       // /webSessions/{token}
  // ===============================================

  const msgEl = document.getElementById("msg");
  const msg = (t) => { msgEl.textContent = t; };

  const enc = encodeURIComponent;
  const params = new URLSearchParams(location.search);
  const shop  = params.get("shop");
  const table = params.get("table");

  msg(`VERSION=${VERSION}\n`);

  if (!shop || !table) {
    msg(`VERSION=${VERSION}\nmissing params: shop / table\n例: ?shop=daboya&table=1`);
    return;
  }

  const activeUrl  = `${FIREBASE_DB_URL}/${ACTIVE_PATH}/${enc(shop)}/${enc(table)}.json`;

  const makeToken4 = () => String(Math.floor(Math.random()*10000)).padStart(4,"0");
  const makeRand4  = () => String(Math.floor(Math.random()*10000)).padStart(4,"0");

  const GET = async (url) => {
    const r = await fetch(url, { method:"GET" });
    const t = await r.text();
    if (!r.ok) throw new Error(t || ("HTTP " + r.status));
    return t ? JSON.parse(t) : null;
  };

  const PUT = async (url, obj) => {
    const r = await fetch(url, {
      method:"PUT",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(obj)
    });
    const t = await r.text();
    if (!r.ok) throw new Error(t || ("HTTP " + r.status));
    return true;
  };

  const thunkableGoUrl = () => {
    const qs = `shop=${enc(shop)}&table=${enc(table)}`;
    return `${THUNKABLE_URL}?${qs}#${qs}`;
  };

  const showLink = (url) => {
    const a = document.createElement("a");
    a.href = url;
    a.textContent = "→ 注文ページへ進む（タップ）";
    a.style.display = "inline-block";
    a.style.marginTop = "12px";
    a.style.fontSize = "20px";
    document.body.appendChild(a);
  };

  (async () => {
    msg(`VERSION=${VERSION}\nshop=${shop} table=${table}\nactive確認中…`);

    const active = await GET(activeUrl);

    // 既にactiveがある → 上書きしない（会計まで固定）
    if (active && active.token) {
      const go = thunkableGoUrl();
      msg(
        `VERSION=${VERSION}\nshop=${shop} table=${table}\n` +
        `既存セッション使用\ntoken=${active.token}\ntoken4=${active.token4 || ""}\n\n` +
        `進まない場合は下のリンクをタップしてください。`
      );
      showLink(go);
      // 自動遷移（ブロックされてもリンクで行ける）
      setTimeout(() => { location.href = go; }, 200);
      return;
    }

    // activeが無い → 初回だけ作成（客が読んだ瞬間に発行）
    const t4 = makeToken4();
    const token = `${shop}-${table}-${t4}-${makeRand4()}`;

    const activePayload  = { token, token4: t4, updatedAt: Date.now() };
    const sessionPayload = { shop, table, token, token4: t4, createdAt: Date.now() };
    const sessionUrl = `${FIREBASE_DB_URL}/${SESS_PATH}/${enc(token)}.json`;

    msg(`VERSION=${VERSION}\nshop=${shop} table=${table}\n初回セッション作成中…\ntoken4=${t4}`);

    await Promise.all([
      PUT(activeUrl, activePayload),
      PUT(sessionUrl, sessionPayload)
    ]);

    const go = thunkableGoUrl();
    msg(
      `VERSION=${VERSION}\nshop=${shop} table=${table}\n` +
      `OK（初回発行）\ntoken=${token}\ntoken4=${t4}\n\n` +
      `進まない場合は下のリンクをタップしてください。`
    );
    showLink(go);
    setTimeout(() => { location.href = go; }, 200);

  })().catch((e) => {
    msg(`VERSION=${VERSION}\nERROR:\n${(e && e.message) ? e.message : String(e)}`);
  });
})();
</script>
</body>
</html>
