<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>params_v2</title>

  <!-- Thunkable WebViewer Extension -->
  <script src="https://cdn.jsdelivr.net/gh/thunkable/webviewer-extension@latest/thunkableWebviewerExtension.js"></script>
  <!-- ※公式のWebViewer拡張を使う。詳細はThunkable Web Viewer Extensions参照 -->
</head>
<body style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
  <h2>params_v2 debug</h2>
  <pre id="out" style="background:#f3f3f3;padding:12px;border-radius:8px;overflow:auto;"></pre>

  <script>
    const out = document.getElementById("out");

    const qs = new URLSearchParams(location.search);
    const shop = (qs.get("shop") || "").trim();
    const table = (qs.get("table") || "").trim();

    const payload = {
      type: "PARAMS",
      shop,
      table,
      href: location.href,
      ts: Date.now()
    };

    out.textContent = JSON.stringify(payload, null, 2);

    // shop/table が空なら説明を出す（これは“成功に見せるIF”じゃなく、入力不足の表示）
    if (!shop || !table) {
      out.textContent =
        "missing params: shop / table\n\n例) " +
        location.origin + location.pathname +
        "?shop=daboya&table=1\n\n---\n" +
        JSON.stringify(payload, null, 2);
    }

    // Thunkable WebViewer内なら postMessage できる
    try {
      if (window.ThunkableWebviewerExtension && window.ThunkableWebviewerExtension.postMessage) {
        window.ThunkableWebviewerExtension.postMessage(JSON.stringify(payload));
      } else {
        // Safariで直接開いたときはここになる（正常）
        out.textContent =
          "✘ Thunkable extension not found (postMessageできてない)\n\n" +
          out.textContent;
      }
    } catch (e) {
      out.textContent = "✘ postMessage error: " + e + "\n\n" + out.textContent;
    }
  </script>
</body>
</html>
