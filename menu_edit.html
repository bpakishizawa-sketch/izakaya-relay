<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メニュー編集（確認用）</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:16px; max-width:720px; margin:0 auto;}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0;}
    button{font-size:16px;padding:12px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:900}
    .dark{background:#111827;color:#fff}
    .light{background:#f3f4f6;color:#111827;border:1px solid #ddd}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .muted{color:#6b7280}
  </style>
</head>
<body>
  <h2>メニュー編集（確認用）</h2>

  <div class="card">
    <div>shop: <b id="shopText" class="mono">-</b></div>
    <div id="status" class="muted">-</div>
    <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
      <button id="btnBack" class="light">← menuへ</button>
      <button id="btnTest" class="dark">テスト発火</button>
    </div>
  </div>

  <div class="card">
    <div class="muted">デバッグ</div>
    <pre id="dbg" class="mono" style="white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto">-</pre>
  </div>

  <script src="shop_common.js?v=20260117"></script>
  <script>
    const $ = (id)=>document.getElementById(id);
    function log(x){ $("dbg").textContent = ( $("dbg").textContent==="-" ? "" : $("dbg").textContent+"\n" ) + String(x); }

    try{
      if(typeof requireLogin !== "function"){
        $("status").innerHTML = '<span class="ng">shop_common.js が読めていません</span>';
      }else{
        if(!requireLogin()) return;
        $("shopText").textContent = getShop();
        $("status").innerHTML = '<span class="ok">JS動作OK</span>';
      }
    }catch(e){
      $("status").innerHTML = '<span class="ng">初期化エラー</span>';
      log(e && e.stack ? e.stack : e);
    }

    $("btnBack").onclick = ()=> {
      location.href = "menu.html?v=" + Date.now();
    };

    $("btnTest").onclick = ()=> {
      alert("ボタン発火OK");
      log("clicked: " + new Date().toLocaleTimeString("ja-JP"));
    };
  </script>
</body>
</html>
