<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>shop login</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px;max-width:720px;margin:0 auto}
    input,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #ccc}
    button{cursor:pointer;border:0;font-weight:800}
    .row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
    .btn{background:#111827;color:#fff}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0}
    .ok{color:#16a34a;font-weight:800}
    .ng{color:#dc2626;font-weight:800}
    .muted{color:#6b7280;font-size:12px}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}
    a{color:#2563eb}
  </style>
</head>
<body>
  <h2>店側ログイン</h2>

  <div class="card">
    <div class="row">
      <input id="shop" placeholder="shopコード（例：daboya）" style="flex:1;min-width:240px">
      <input id="pin"  placeholder="スタッフPIN" style="width:160px" inputmode="numeric">
      <button id="btnLogin" class="btn">ログイン</button>
    </div>
    <div id="msg" class="muted">shop と PIN を入力してください。</div>

    <details style="margin-top:10px">
      <summary style="cursor:pointer;font-weight:800">デバッグ（開いて確認）</summary>
      <pre id="debug">-</pre>
    </details>
  </div>

  <div class="card" id="logged" style="display:none;">
    <div class="ok">ログイン中：<span id="who"></span></div>
    <div class="row" style="margin-top:10px">
      <a href="menu.html">menuへ</a>
      <button id="btnLogout" style="background:#ef4444;color:#fff">ログアウト</button>
    </div>
  </div>

  <script src="shop_common.js"></script>
  <script>
    const $ = (id)=>document.getElementById(id);

    function showLogged(){
      const shop = getShop();
      const pin  = getPin();
      if(shop && pin){
        $("logged").style.display = "block";
        $("who").textContent = `${shop} / PIN ****`;
      }else{
        $("logged").style.display = "none";
      }
    }

    function normStr(v){
      return String(v ?? "").trim();
    }

    // ✅ 先頭0問題も吸収する比較
    // - DBが数値(123)でも、入力が"0123"でもOKにする
    function pinMatches(dbPin, inputPin){
      const a = normStr(dbPin);
      const b = normStr(inputPin);

      if(!a || !b) return false;

      // まずは文字列一致
      if(a === b) return true;

      // 次に数値比較（"0123" vs 123 を吸収）
      const na = Number(a);
      const nb = Number(b);
      if(Number.isFinite(na) && Number.isFinite(nb) && na === nb) return true;

      return false;
    }

    // すでにログイン済みなら表示
    showLogged();

    $("btnLogout").onclick = ()=>{
      lsClearShopLogin();
      location.reload();
    };

    $("btnLogin").onclick = async ()=>{
      const shop = $("shop").value.trim();
      const pin  = $("pin").value.trim();

      if(!shop || !pin){
        $("msg").innerHTML = `<span class="ng">shop と PIN を入れてください</span>`;
        return;
      }

      $("btnLogin").disabled = true;
      $("msg").innerHTML = `<span class="muted">照合中...</span>`;
      $("debug").textContent = "-";

      try{
        // staffPin 取得
        const r = await rtdbGet(`shops/${encodeURIComponent(shop)}/staffPin`);

        // rtdbGet は {ok,status,json,url,raw...} の想定
        const dbg = {
          requestShop: shop,
          inputPin: pin,
          staffPinPath: `shops/${shop}/staffPin`,
          fetchStatus: r?.status,
          ok: r?.ok,
          url: r?.url,
          gotJson: r?.json,
          gotType: typeof (r?.json)
        };
        $("debug").textContent = JSON.stringify(dbg, null, 2);

        if(!r || !r.ok){
          $("msg").innerHTML = `<span class="ng">PIN取得に失敗</span> <span class="muted">(HTTP ${r ? r.status : "?"})</span>`;
          $("btnLogin").disabled = false;
          return;
        }

        const staffPin = r.json; // ここが「1234」だったり 1234 だったり null だったりする
        if(!normStr(staffPin)){
          $("msg").innerHTML = `<span class="ng">staffPin が未設定</span> <span class="muted">（FBRD: shops/${shop}/staffPin を確認）</span>`;
          $("btnLogin").disabled = false;
          return;
        }

        if(!pinMatches(staffPin, pin)){
          $("msg").innerHTML = `<span class="ng">PINが違います</span>`;
          $("btnLogin").disabled = false;
          return;
        }

        // ✅ 一致 → 保存
        lsSetShopLogin(shop, pin);

        $("msg").innerHTML = `<span class="ok">ログインしました</span>`;
        showLogged();
        location.href = `menu.html?v=${Date.now()}`;

      }catch(e){
        $("msg").innerHTML = `<span class="ng">例外エラー</span> <span class="muted">${String(e.message||e)}</span>`;
        $("btnLogin").disabled = false;
      }
    };
  </script>
</body>
</html>
