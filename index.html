<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>izakaya-relay</title>
</head>
<body style="margin:0">
  <div id="msg" style="padding:16px;font-family:sans-serif;white-space:pre-wrap;">
    読み込み中…
  </div>

<script>
const FIREBASE_DB_URL = "https://izakayaorder-default-rtdb.firebaseio.com";
const THUNKABLE_URL   = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH"; // ←あなたのURLのまま
const msg = (t) => document.getElementById("msg").textContent = t;

const params = new URLSearchParams(location.search);
const shop  = params.get("shop");
const table = params.get("table");

if (!shop || !table) {
  msg("missing params: shop / table\n例: ?shop=daboya&table=1");
  throw new Error("missing params");
}

// token自動発行（毎回変わる）
const token = `${shop}-${table}-${Math.random().toString(36).slice(2,10)}`;

const sessionPayload = { shop, table, token, createdAt: Date.now() };
const activePayload  = { token, updatedAt: Date.now() };

// ★ ここは今あなたが作れてるパスに合わせて「webSessions / webActiveSessions」に固定
const sessionUrl = `${FIREBASE_DB_URL}/webSessions/${encodeURIComponent(token)}.json`;
const activeUrl  = `${FIREBASE_DB_URL}/webActiveSessions/${encodeURIComponent(shop)}/${encodeURIComponent(table)}.json`;

msg("セッション作成中…");

Promise.all([
  fetch(sessionUrl, { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(sessionPayload) }),
  fetch(activeUrl,  { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(activePayload)  })
])
.then(async (results) => {
  for (const r of results) if (!r.ok) throw new Error(await r.text());
  msg("OK。注文ページへ移動…");
  // ★ Thunkableへは「#」じゃなく「?」で渡す（ここが重要）
  location.replace(`${THUNKABLE_URL}?shop=${encodeURIComponent(shop)}&table=${encodeURIComponent(table)}`);
})
.catch((e) => {
  console.error(e);
  msg("Firebase書き込み失敗。Rules/URLを確認。");
});
</script>
</body>
</html>
