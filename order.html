<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>注文（お客さん）</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px;max-width:980px;margin:0 auto;background:#f6f7f9}
    h1{font-size:22px;margin:0 0 10px}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0;background:#fff}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .muted{color:#6b7280;font-size:12px}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}

    button{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;font-weight:900}
    .btn{background:#2563eb;color:#fff}
    .btn2{background:#e5e7eb;color:#111827}
    .danger{background:#dc2626;color:#fff}

    input,select{font-size:16px;padding:10px;border-radius:10px;border:1px solid #d1d5db;background:#fff}
    select{width:100%}
    input{width:100%;box-sizing:border-box}

    .grid2{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:860px){
      .grid2{grid-template-columns:1fr 1fr;}
    }

    table{width:100%;border-collapse:separate;border-spacing:0 8px}
    th{font-size:12px;color:#6b7280;text-align:left}
    td{background:#fff;border:1px solid #e5e7eb;padding:10px;border-radius:12px;vertical-align:middle}
    .qtyBtn{background:#111827;color:#fff;border-radius:10px;padding:8px 10px;font-weight:900}
    .qty{min-width:26px;text-align:center;font-weight:900;display:inline-block}
    .right{text-align:right}
    .nowrap{white-space:nowrap}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}
    details summary{cursor:pointer;font-weight:900;color:#374151}

    .histCard{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px;background:#fff}
    .histTop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .histItems{margin-top:8px;font-size:14px}
    .histItems .line{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed #eee;padding-top:6px;margin-top:6px}
    .histItems .left{min-width:0}
    .histItems .name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
    .histItems .meta{font-size:12px;color:#6b7280;margin-top:2px}
    .histItems .right{font-weight:900;white-space:nowrap}
  </style>
</head>
<body>
  <h1>注文</h1>

  <div class="card">
    <div class="row">
      <div class="mono"><b>shop</b>: <span id="shopText">-</span></div>
      <div class="mono"><b>table</b>: <span id="tableText">-</span></div>
      <div class="mono"><b>token</b>: <span id="tokenText">-</span></div>
    </div>
    <div id="status" class="muted" style="margin-top:6px;">-</div>
  </div>

  <div class="grid2">
    <div class="card">
      <div style="font-weight:900;margin-bottom:8px;">ドリンクを追加</div>
      <div class="row">
        <div style="flex:1;min-width:220px;">
          <select id="selDrink">
            <option value="">（ドリンクを選択）</option>
          </select>
        </div>
        <button id="btnAddDrink" class="btn">追加</button>
      </div>
      <div class="muted">件数: <span id="drinkCount" class="mono">0</span></div>
    </div>

    <div class="card">
      <div style="font-weight:900;margin-bottom:8px;">フードを追加</div>
      <div class="row">
        <div style="flex:1;min-width:220px;">
          <select id="selFood">
            <option value="">（フードを選択）</option>
          </select>
        </div>
        <button id="btnAddFood" class="btn">追加</button>
      </div>
      <div class="muted">件数: <span id="foodCount" class="mono">0</span></div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div style="font-weight:900">カート（送信待ち）</div>
      <div class="mono" style="font-weight:900">カート合計: <span id="cartSum">0</span> 円</div>
    </div>

    <div id="cartEmpty" class="muted" style="margin-top:8px;">カートは空です</div>

    <div style="overflow:auto;margin-top:8px;">
      <table id="cartTable" style="display:none;">
        <thead>
          <tr>
            <th class="nowrap">種別</th>
            <th>メニュー</th>
            <th class="right nowrap">単価</th>
            <th class="right nowrap">数量</th>
            <th class="right nowrap">小計</th>
            <th class="right nowrap">操作</th>
          </tr>
        </thead>
        <tbody id="cartTbody"></tbody>
      </table>
    </div>

    <div class="row" style="margin-top:10px;">
      <button id="btnSend" class="btn">注文送信</button>
      <button id="btnClear" class="btn2">カートクリア</button>
      <span class="muted">※送信すると orders と /shops/{shop}/orderFeed に書き込みます</span>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;">
      <div style="font-weight:900">注文履歴（この token の累計）</div>
      <div class="row">
        <button id="btnHist" class="btn2">履歴更新</button>
        <div class="mono" style="font-weight:900;">累計: <span id="tokenSum">0</span> 円</div>
      </div>
    </div>
    <div id="histLine" class="muted" style="margin-top:6px;">-</div>
    <div id="histList"></div>
  </div>

  <details class="card">
    <summary>デバッグ</summary>
    <pre id="debug" class="mono">-</pre>
  </details>

<script>
/** ====== 設定ここだけ ====== */
const RTDB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
/** ========================= */

const $ = (id)=>document.getElementById(id);
function esc(s){ return String(s??"").replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function getParam(name){ const u=new URL(location.href); return (u.searchParams.get(name)||"").trim(); }

async function rtdbGet(path){
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url, { method:"GET" });
  const txt = await res.text();
  let json=null; try{ json = txt ? JSON.parse(txt) : null; }catch{ json=null; }
  return { ok: res.ok, status: res.status, json, url, raw: txt };
}
async function rtdbPut(path, data){
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(data)
  });
  const txt = await res.text();
  let json=null; try{ json = txt ? JSON.parse(txt) : null; }catch{ json=null; }
  return { ok: res.ok, status: res.status, json, url, raw: txt };
}
async function rtdbPost(path, data){
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(data)
  });
  const txt = await res.text();
  let json=null; try{ json = txt ? JSON.parse(txt) : null; }catch{ json=null; }
  return { ok: res.ok, status: res.status, json, url, raw: txt };
}

function parseMenuValue(v){
  if(v && typeof v === "object"){
    return { name: String(v.name ?? ""), price: Number(v.price ?? 0) };
  }
  if(typeof v === "string"){
    return { name: v, price: 0 };
  }
  return { name:"", price:0 };
}
function idNum(id){
  const m = String(id||"").match(/\d+/);
  return m ? Number(m[0]) : 999999;
}
function setStatus(html){ $("status").innerHTML = html || ""; }

const state = {
  shop:"", table:"", token:"",
  menuDrink:{}, menuFood:{},
  cart: [] // {cat,id,name,price,qty}
};

function money(n){ return Number(n||0).toLocaleString("ja-JP"); }
function fmtTime(ts){
  if(!ts) return "-";
  try{
    const d = new Date(Number(ts));
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `${hh}:${mm}`;
  }catch{ return "-"; }
}

function cartSum(){
  return state.cart.reduce((s,x)=> s + (Number(x.price||0) * Number(x.qty||0)), 0);
}
function syncCartView(){
  const sum = cartSum();
  $("cartSum").textContent = money(sum);

  const empty = state.cart.length === 0;
  $("cartEmpty").style.display = empty ? "block" : "none";
  $("cartTable").style.display = empty ? "none" : "table";

  const tb = $("cartTbody");
  tb.innerHTML = "";

  for(const x of state.cart){
    const sub = Number(x.price||0) * Number(x.qty||0);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="nowrap">${esc(x.cat==="drink" ? "ドリンク" : "フード")}</td>
      <td><b>${esc(x.name)}</b> <span class="muted mono">(${esc(x.id)})</span></td>
      <td class="right nowrap">${esc(money(x.price))}</td>
      <td class="right nowrap"><span class="qty mono">${esc(x.qty)}</span></td>
      <td class="right nowrap"><b>${esc(money(sub))}</b></td>
      <td class="right nowrap">
        <button class="qtyBtn" data-act="dec" data-cat="${esc(x.cat)}" data-id="${esc(x.id)}">-</button>
        <button class="qtyBtn" data-act="inc" data-cat="${esc(x.cat)}" data-id="${esc(x.id)}">+</button>
        <button class="btn2" style="padding:8px 10px;" data-act="del" data-cat="${esc(x.cat)}" data-id="${esc(x.id)}">削除</button>
      </td>
    `;
    tb.appendChild(tr);
  }
}

function upsertCart(cat, id, name, price){
  const idx = state.cart.findIndex(x => x.cat===cat && x.id===id);
  if(idx >= 0){
    state.cart[idx].qty = Number(state.cart[idx].qty||0) + 1;
  }else{
    state.cart.push({ cat, id, name, price:Number(price||0), qty:1 });
  }
  syncCartView();
}
function incCart(cat,id){
  const idx = state.cart.findIndex(x => x.cat===cat && x.id===id);
  if(idx<0) return;
  state.cart[idx].qty++;
  syncCartView();
}
function decCart(cat,id){
  const idx = state.cart.findIndex(x => x.cat===cat && x.id===id);
  if(idx<0) return;
  state.cart[idx].qty--;
  if(state.cart[idx].qty<=0) state.cart.splice(idx,1);
  syncCartView();
}
function delCart(cat,id){
  const idx = state.cart.findIndex(x => x.cat===cat && x.id===id);
  if(idx<0) return;
  state.cart.splice(idx,1);
  syncCartView();
}

function rebuildSelects(){
  const selD = $("selDrink");
  const selF = $("selFood");
  selD.innerHTML = `<option value="">（ドリンクを選択）</option>`;
  selF.innerHTML = `<option value="">（フードを選択）</option>`;

  const dKeys = Object.keys(state.menuDrink||{}).sort((a,b)=>idNum(a)-idNum(b));
  const fKeys = Object.keys(state.menuFood||{}).sort((a,b)=>idNum(a)-idNum(b));
  $("drinkCount").textContent = String(dKeys.length);
  $("foodCount").textContent  = String(fKeys.length);

  for(const id of dKeys){
    const v = parseMenuValue(state.menuDrink[id]);
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = `${id}｜${v.name}｜${money(v.price)}円`;
    opt.dataset.name = v.name;
    opt.dataset.price = String(v.price||0);
    selD.appendChild(opt);
  }
  for(const id of fKeys){
    const v = parseMenuValue(state.menuFood[id]);
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = `${id}｜${v.name}｜${money(v.price)}円`;
    opt.dataset.name = v.name;
    opt.dataset.price = String(v.price||0);
    selF.appendChild(opt);
  }
}

async function loadMenu(){
  setStatus(`<span class="mono">menu loading...</span>`);
  const d = await rtdbGet(`shops/${encodeURIComponent(state.shop)}/menu/drink`);
  const f = await rtdbGet(`shops/${encodeURIComponent(state.shop)}/menu/food`);
  if(!d.ok || !f.ok){
    setStatus(`<span class="ng">メニュー読込失敗</span> <span class="muted">(${d.status}/${f.status})</span>`);
    $("debug").textContent = JSON.stringify({ drink:d, food:f }, null, 2);
    return false;
  }
  state.menuDrink = (d.json && typeof d.json==="object") ? d.json : {};
  state.menuFood  = (f.json && typeof f.json==="object") ? f.json : {};
  rebuildSelects();

  setStatus(`<span class="ok">メニュー読み込みOK</span>`);
  $("debug").textContent = JSON.stringify({
    shop: state.shop, table: state.table, token: state.token,
    drinkKeys: Object.keys(state.menuDrink).length,
    foodKeys: Object.keys(state.menuFood).length
  }, null, 2);
  return true;
}

async function verifyToken(){
  const sessPath = `webActiveSessions/${encodeURIComponent(state.shop)}/${encodeURIComponent(String(state.table))}`;
  const g = await rtdbGet(sessPath);
  if(!g.ok){
    return { ok:false, reason:`セッション読込失敗: ${g.status}`, data:g };
  }
  const serverToken = g.json && g.json.token ? String(g.json.token).trim() : "";
  if(!serverToken){
    return { ok:false, reason:`セッションtokenなし（未入店扱い）`, data:g.json };
  }
  if(serverToken !== state.token){
    return { ok:false, reason:`token不一致（server=${serverToken} / url=${state.token}）`, data:g.json };
  }
  return { ok:true, serverToken, session:g.json };
}

function getSelected(selId){
  const sel = $(selId);
  const id = sel.value;
  if(!id) return null;
  const opt = sel.options[sel.selectedIndex];
  return {
    id,
    name: opt.dataset.name || "",
    price: Number(opt.dataset.price || 0)
  };
}

async function sendOrder(){
  if(state.cart.length===0){
    setStatus(`<span class="ng">カートが空です</span>`);
    return;
  }

  setStatus(`<span class="mono">送信中...</span>`);

  // token検証
  const v = await verifyToken();
  if(!v.ok){
    setStatus(`<span class="ng">送信失敗</span> <span class="muted">${esc(v.reason)}</span>`);
    $("debug").textContent = JSON.stringify({ verify:v }, null, 2);
    return;
  }

  const now = Date.now();
  const ua = navigator.userAgent;
  const total = cartSum();

  // orders（table配下にpush）
  const orderPayload = {
    shop: state.shop,
    table: String(state.table),
    token: state.token,
    createdAt: now,
    items: state.cart.map(x => ({
      id: x.id,
      cat: x.cat,
      name: x.name,
      price: Number(x.price||0),
      qty: Number(x.qty||0)
    })),
    total: total,
    ua: ua
  };

  const ordersPath = `shops/${encodeURIComponent(state.shop)}/orders/${encodeURIComponent(String(state.table))}`;
  const oRes = await rtdbPost(ordersPath, orderPayload);

  if(!oRes.ok || !oRes.json || !oRes.json.name){
    setStatus(`<span class="ng">送信失敗</span> <span class="muted">orders POST ${oRes.status}</span>`);
    $("debug").textContent = JSON.stringify({ orders:oRes, payload:orderPayload }, null, 2);
    return;
  }

  const orderKey = oRes.json.name;

  // /shops/{shop}/orderFeed にも push（厨房用）
  const feedPayload = {
    shop: state.shop,
    table: String(state.table),
    token: state.token,
    createdAt: now,
    status: "new",
    total: total,
    itemsCount: state.cart.reduce((s,x)=> s + Number(x.qty||0), 0),
    orderKey: orderKey,
    orderPath: `/shops/${state.shop}/orders/${state.table}/${orderKey}`
  };

  const feedPath = `shops/${encodeURIComponent(state.shop)}/orderFeed`;
  const fRes = await rtdbPost(feedPath, feedPayload);

  if(!fRes.ok){
    setStatus(`<span class="ng">送信失敗</span> <span class="muted">orderFeed POST ${fRes.status}</span>`);
    $("debug").textContent = JSON.stringify({ orders:oRes, feed:fRes, feedPayload }, null, 2);
    return;
  }

  // 成功：カートクリア
  state.cart = [];
  syncCartView();

  setStatus(`<span class="ok">送信OK</span> 注文キー: <span class="mono">${esc(orderKey)}</span>`);
  $("debug").textContent = JSON.stringify({ orders:oRes, feed:fRes }, null, 2);

  // 履歴更新（累計表示）
  await refreshHistory();
}

async function refreshHistory(){
  const path = `shops/${encodeURIComponent(state.shop)}/orders/${encodeURIComponent(String(state.table))}`;
  const g = await rtdbGet(path);
  if(!g.ok){
    $("histLine").innerHTML = `<span class="ng">履歴取得失敗</span> <span class="muted">${esc(g.status)}</span>`;
    $("histList").innerHTML = `<div class="muted">読み込みに失敗しました</div>`;
    return;
  }

  const obj = (g.json && typeof g.json==="object") ? g.json : {};
  const list = [];
  for(const [k,v] of Object.entries(obj)){
    if(!v || typeof v !== "object") continue;
    if(String(v.token||"") !== String(state.token||"")) continue; // ★token一致だけ
    const items = Array.isArray(v.items) ? v.items : [];
    list.push({
      key: k,
      createdAt: Number(v.createdAt||0),
      total: Number(v.total||0),
      items: items.map(it => ({
        name: String(it?.name ?? ""),
        qty: Number(it?.qty ?? 0),
        price: Number(it?.price ?? 0)
      }))
    });
  }
  list.sort((a,b)=> (a.createdAt||0) - (b.createdAt||0));

  const sum = list.reduce((s,x)=> s + Number(x.total||0), 0);
  $("tokenSum").textContent = money(sum);
  $("histLine").textContent = `件数: ${list.length} / 最終更新: ${new Date().toLocaleTimeString("ja-JP")}`;

  const wrap = $("histList");
  wrap.innerHTML = "";
  if(list.length===0){
    wrap.innerHTML = `<div class="muted">このtokenの注文履歴はまだありません</div>`;
    return;
  }

  for(const o of list){
    const card = document.createElement("div");
    card.className = "histCard";
    card.innerHTML = `
      <div class="histTop">
        <div>
          <div class="mono muted">注文ID: ${esc(o.key)}</div>
          <div style="font-weight:900;">${esc(fmtTime(o.createdAt))} の注文</div>
        </div>
        <div class="mono" style="font-weight:900;">小計: ${esc(money(o.total))} 円</div>
      </div>
      <div class="histItems" id="items_${esc(o.key)}"></div>
    `;
    const itemsWrap = card.querySelector(`#items_${CSS.escape(o.key)}`);
    if(o.items.length===0){
      itemsWrap.innerHTML = `<div class="muted">（itemsなし）</div>`;
    }else{
      for(const it of o.items){
        const line = document.createElement("div");
        line.className = "line";
        const sub = Number(it.price||0) * Number(it.qty||0);
        line.innerHTML = `
          <div class="left">
            <div class="name">${esc(it.name || "-")}</div>
            <div class="meta">${esc(money(it.price))}円 × ${esc(it.qty)}個</div>
          </div>
          <div class="right">${esc(money(sub))} 円</div>
        `;
        itemsWrap.appendChild(line);
      }
    }
    wrap.appendChild(card);
  }
}

function init(){
  state.shop  = getParam("shop");
  state.table = getParam("table");
  state.token = getParam("token");

  $("shopText").textContent  = state.shop  || "(missing)";
  $("tableText").textContent = state.table || "(missing)";
  $("tokenText").textContent = state.token || "(missing)";

  if(!state.shop || !state.table || !state.token){
    setStatus(`<span class="ng">URLパラメータ不足</span>（shop/table/token）`);
    $("debug").textContent = JSON.stringify({
      hint: "例: order.html?shop=daboya&table=2&token=daboya-2-xxxx"
    }, null, 2);
    return;
  }

  document.body.addEventListener("click", (e)=>{
    const t = e.target;
    if(!(t instanceof HTMLElement)) return;
    const act = t.dataset.act;
    if(!act) return;
    const cat = t.dataset.cat;
    const id  = t.dataset.id;
    if(!cat || !id) return;

    if(act==="inc") incCart(cat,id);
    if(act==="dec") decCart(cat,id);
    if(act==="del") delCart(cat,id);
  });

  $("btnAddDrink").onclick = ()=>{
    const s = getSelected("selDrink");
    if(!s){ setStatus(`<span class="ng">ドリンクが未選択</span>`); return; }
    upsertCart("drink", s.id, s.name, s.price);
    setStatus(`<span class="ok">追加しました</span>`);
  };
  $("btnAddFood").onclick = ()=>{
    const s = getSelected("selFood");
    if(!s){ setStatus(`<span class="ng">フードが未選択</span>`); return; }
    upsertCart("food", s.id, s.name, s.price);
    setStatus(`<span class="ok">追加しました</span>`);
  };

  $("btnSend").onclick = sendOrder;
  $("btnClear").onclick = ()=>{
    state.cart = [];
    syncCartView();
    setStatus(`<span class="muted">カートをクリアしました</span>`);
  };

  $("btnHist").onclick = refreshHistory;

  syncCartView();
  loadMenu().then(()=> refreshHistory());
}

init();
</script>
</body>
</html>
