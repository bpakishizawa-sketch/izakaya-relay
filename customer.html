<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>入店処理</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 18px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin: 12px 0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .ok { color: #16a34a; font-weight: 800; }
    .ng { color: #dc2626; font-weight: 800; }
    small { color:#666; }
    .spin {
      display:inline-block; width:14px; height:14px; border:2px solid #bbb; border-top-color:#111;
      border-radius:50%; animation: rot .8s linear infinite; vertical-align:-2px; margin-right:8px;
    }
    @keyframes rot { to { transform: rotate(360deg);} }
    pre { white-space: pre-wrap; word-break: break-word; background: #f7f7f7; padding: 10px; border-radius: 10px; overflow:auto; }
    a,button { color:#2563eb; }
    button{cursor:pointer;border:0;border-radius:10px;padding:12px 14px;font-weight:900;background:#111827;color:#fff}
    .muted{color:#6b7280}
  </style>
</head>
<body>
  <h2>入店処理</h2>

  <div class="card">
    <div id="line1"><span class="spin"></span>処理中...</div>
    <div style="margin-top:10px;">
      <div><b>shop:</b> <span id="shopText" class="mono">-</span></div>
      <div><b>table:</b> <span id="tableText" class="mono">-</span></div>
      <div><b>token:</b> <span id="tokenText" class="mono">-</span></div>
      <div style="margin-top:8px;"><small id="hrefText" class="mono">-</small></div>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="resultLine" class="mono"></div>
    <pre id="resultJson" class="mono"></pre>
    <div id="retryBox" style="margin-top:10px;"></div>
  </div>

<script>
/** ====== 設定ここだけ ====== */
const RTDB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
const ORDER_URL = "https://bpakishizawa-sketch.github.io/izakaya-relay/order.html";
/** ======================== */

const $ = (id) => document.getElementById(id);

function esc(s){
  return String(s||"").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function getParam(name) {
  const u = new URL(location.href);
  return (u.searchParams.get(name) || "").trim();
}

function genToken(shop, table) {
  const n = Math.floor(100000 + Math.random() * 900000); // 6桁にして衝突を減らす
  return `${shop}-${table}-${n}`;
}

function showResult(ok, line, obj) {
  $("resultCard").style.display = "block";
  $("resultLine").innerHTML = ok ? `<span class="ok">OK</span> ${line}` : `<span class="ng">NG</span> ${line}`;
  $("resultJson").textContent = JSON.stringify(obj, null, 2);
}

async function rtdbGet(path){
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url, { method:"GET", cache:"no-store" });
  const txt = await res.text();
  let json; try{ json = txt ? JSON.parse(txt) : null; }catch{ json = null; }
  return { ok: res.ok, status: res.status, json, url, raw: txt };
}

async function rtdbPut(path, data) {
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method: "PUT",
    cache: "no-store",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  const txt = await res.text();
  let json;
  try { json = txt ? JSON.parse(txt) : null; } catch { json = { raw: txt }; }
  return { ok: res.ok, status: res.status, json, url, raw: txt };
}

function jumpToOrder(shop, table, token){
  const jump =
    ORDER_URL +
    `?shop=${encodeURIComponent(shop)}` +
    `&table=${encodeURIComponent(String(table))}` +
    `&token=${encodeURIComponent(token)}` +
    `&v=${Date.now()}`;
  location.href = jump;
}

// ---- 初期表示 ----
const shop = getParam("shop");
const table = getParam("table");

$("shopText").textContent = shop || "(missing)";
$("tableText").textContent = table || "(missing)";
$("hrefText").textContent = location.href;

if (!shop || !table) {
  $("line1").innerHTML = `<span class="ng">NG</span> URL params が不足です（shop/table）`;
  showResult(false, "missing params: shop / table", {
    example: `${location.origin}${location.pathname}?shop=daboya&table=1`
  });
  $("retryBox").innerHTML = `<a href="${esc(location.origin + location.pathname)}">戻る</a>`;
} else {
  (async ()=>{
    const now = Date.now();
    const ua = navigator.userAgent;
    const sessPath = `webActiveSessions/${encodeURIComponent(shop)}/${encodeURIComponent(String(table))}`;

    try {
      // 1) 既存セッションがあるか確認
      const g = await rtdbGet(sessPath);

      if (g.ok && g.json && g.json.token && g.json.active !== false) {
        const token = String(g.json.token).trim();
        $("tokenText").textContent = token;
        $("line1").innerHTML = `<span class="ok">OK</span> 既存セッションを再利用（2秒後に注文画面）`;
        showResult(true, `既存セッション利用: ${g.url}`, g.json);
        $("retryBox").innerHTML = `<button id="goBtn">今すぐ注文画面へ</button> <span class="muted">（2秒後に自動遷移）</span>`;
        setTimeout(()=> jumpToOrder(shop, table, token), 2000);
        setTimeout(()=> { const b=$("goBtn"); if(b) b.onclick=()=>jumpToOrder(shop,table,token); }, 0);
        return;
      }

      // 2) 無ければ新規発行してPUT
      const token = genToken(shop, table);
      $("tokenText").textContent = token;

      const payload = {
        shop: shop,
        table: String(table),
        token: token,
        active: true,
        createdAt: now,
        updatedAt: now,
        ua: ua
      };

      const p = await rtdbPut(sessPath, payload);

      if (!p.ok) {
        $("line1").innerHTML = `<span class="ng">NG</span> セッション作成失敗（Permission denied等）`;
        showResult(false, `PUT失敗: HTTP ${p.status} ${p.url}`, { payload, response: p.json, raw: p.raw });
        $("retryBox").innerHTML = `<button onclick="location.reload()">再試行</button>`;
        return;
      }

      // 3) 直後に読み戻して「本当に書けたか」確認（ここ重要）
      const g2 = await rtdbGet(sessPath);
      if(!(g2.ok && g2.json && g2.json.token)){
        $("line1").innerHTML = `<span class="ng">NG</span> 書き込み後の読み戻しで確認できませんでした`;
        showResult(false, `PUTは成功したがGETで確認できない`, { put: payload, get: g2 });
        $("retryBox").innerHTML = `<button onclick="location.reload()">再試行</button>`;
        return;
      }

      $("line1").innerHTML = `<span class="ok">OK</span> セッション新規作成（2秒後に注文画面）`;
      showResult(true, `新規作成→確認OK: ${g2.url}`, g2.json);

      $("retryBox").innerHTML = `<button id="goBtn">今すぐ注文画面へ</button> <span class="muted">（2秒後に自動遷移）</span>`;
      setTimeout(()=> jumpToOrder(shop, table, token), 2000);
      setTimeout(()=> { const b=$("goBtn"); if(b) b.onclick=()=>jumpToOrder(shop,table,token); }, 0);

    } catch (e) {
      $("line1").innerHTML = `<span class="ng">NG</span> 例外エラー（通信/CORS等）`;
      showResult(false, "例外エラー", { message: String(e), stack: (e && e.stack) ? String(e.stack) : "" });
      $("retryBox").innerHTML = `<button onclick="location.reload()">再試行</button>`;
    }
  })();
}
</script>
</body>
</html>
