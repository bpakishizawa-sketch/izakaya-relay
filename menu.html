<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>店側メニュー</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:18px; max-width:720px; margin:0 auto;}
    h1{font-size:22px;margin:0 0 10px}
    .sub{font-size:12px;color:#6b7280;margin-bottom:14px;line-height:1.6}
    .card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0;background:#fff;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    a.btn{
      display:inline-block; padding:12px 14px; border-radius:12px;
      border:1px solid #ddd; text-decoration:none; color:#111827; font-weight:800;
      min-width: 180px; text-align:center;
    }
    a.btn.warn{background:#fef3c7;border-color:#f59e0b}
    a.btn.kitchen{background:#dbeafe;border-color:#3b82f6}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .ok{color:#16a34a;font-weight:800}
    .ng{color:#dc2626;font-weight:800}
    button{font-size:16px;padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:800}
    button.dark{background:#111827;color:#fff}
    button.blue{background:#2563eb;color:#fff}
    select,input{font-size:16px;padding:10px;border-radius:10px;border:1px solid #d1d5db;background:#fff}
    .small{font-size:12px;color:#6b7280}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #ddd;font-weight:900;font-size:12px;background:#f9fafb}
  </style>
</head>
<body>
  <h1>店側メニュー</h1>
  <div class="sub">
    この端末は shopコード＋PIN でログイン済み。ここから各機能ページへ移動します。<br>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <div>shop: <b id="shopText" class="mono">-</b></div>
        <div>PIN: <b id="pinText" class="mono">-</b> <span class="small">（表示はマスク）</span></div>
      </div>
      <div class="row">
        <button type="button" id="btnLogout" class="dark">ログアウト</button>
        <button type="button" id="btnCheck" class="dark">接続チェック</button>
      </div>
    </div>

    <div id="status" style="margin-top:10px;"></div>
  </div>

  <!-- 店員ハンディ（ここが唯一 webActiveSessions を作る） -->
  <div class="card">
    <div style="font-weight:900;margin-bottom:8px;">店員ハンディ（注文入力）</div>
    <div class="small" style="margin-bottom:10px;">
      テーブルを選んで「注文を取る」を押すと、<b>order.html</b> をそのテーブルの token 付きで開きます。<br>
      既に着席中（webActiveSessionsにtokenあり）ならその token を使い、無ければ新規 token を作って着席扱いにします。
    </div>

    <div class="row">
      <span class="pill">TABLE</span>
      <select id="selTable" style="min-width:140px"></select>

      <span class="pill">上限</span>
      <input id="inpMaxTables" type="number" min="1" max="200" value="30" style="width:120px" inputmode="numeric" />

      <button type="button" id="btnRebuildTables" class="dark">更新</button>
      <button type="button" id="btnGoOrder" class="blue">このテーブルで注文を取る</button>
    </div>

    <div id="handyStatus" class="small" style="margin-top:10px;color:#6b7280;">-</div>
  </div>

  <div class="card">
    <div class="row">
      <a class="btn kitchen" href="./kitchen.html?v=1">厨房：オーダーリスト</a>
      <a class="btn warn" href="./checkout.html?v=1">会計：テーブル別お会計</a>
      <a class="btn" href="./qr.html?v=1">QR：印刷用</a>
      <a class="btn" href="./menu_edit.html?v=1">メニュー編集</a>
    </div>
  </div>

  <script src="shop_common.js"></script>
  <script>
    const $ = (id)=>document.getElementById(id);

    function maskPin(pin){
      if(!pin) return "-";
      return "*".repeat(Math.min(String(pin).length, 8));
    }
    function esc2(s){
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }
    function E(s){ return (typeof esc === "function") ? esc(s) : esc2(s); }

    // RTDB（shop_common.js の関数があれば優先）
    const DB_BASE_FALLBACK = "https://izakayaorder-default-rtdb.firebaseio.com";
    async function rtdbGetLocal(path){
      const base = (typeof RTDB_BASE !== "undefined" && RTDB_BASE) ? RTDB_BASE : DB_BASE_FALLBACK;
      const url = `${base}/${path}.json`;
      const res = await fetch(url, { cache:"no-store" });
      const txt = await res.text();
      return { ok: res.ok, status: res.status, json: (()=>{ try{return JSON.parse(txt||"null");}catch{return null;} })(), raw: txt, url };
    }
    async function rtdbPutLocal(path, data){
      const base = (typeof RTDB_BASE !== "undefined" && RTDB_BASE) ? RTDB_BASE : DB_BASE_FALLBACK;
      const url = `${base}/${path}.json`;
      const res = await fetch(url, { method:"PUT", cache:"no-store", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(data) });
      const txt = await res.text();
      return { ok: res.ok, status: res.status, json: (()=>{ try{return JSON.parse(txt||"null");}catch{return null;} })(), raw: txt, url };
    }

    async function RTDB_GET(path){
      if(typeof rtdbGet === "function") return await rtdbGet(path);
      const r = await rtdbGetLocal(path);
      if(!r.ok) throw new Error(`HTTP ${r.status} ${r.raw}`);
      return r.json;
    }
    async function RTDB_PUT(path, data){
      if(typeof rtdbPut === "function") return await rtdbPut(path, data);
      const r = await rtdbPutLocal(path, data);
      if(!r.ok) throw new Error(`HTTP ${r.status} ${r.raw}`);
      return r.json;
    }

    function genTokenLocal(shop, table){
      // tokenは「テーブルのセッションID」なので、ここだけで発行する
      const n = Math.floor(100000 + Math.random() * 900000); // 6桁
      return `${shop}-${table}-${n}`;
    }

    function setStatus(html){ $("status").innerHTML = html || ""; }
    function setHandyStatus(html){ $("handyStatus").innerHTML = html || ""; }

    // ログイン必須（shop_common.js に任せる）
    if(typeof requireLogin === "function"){
      if(!requireLogin()) { /* redirect */ }
    }

    const shop = (typeof getShop === "function") ? getShop() : (localStorage.getItem("shopCode")||"").trim();
    const pin  = (typeof getPin === "function") ? getPin() : (localStorage.getItem("shopPin")||"").trim();

    $("shopText").textContent = shop || "-";
    $("pinText").textContent  = maskPin(pin);

    if(shop){
      setStatus(`<span class="ok">OK</span> ログイン状態`);
    }else{
      setStatus(`<span class="ng">NG</span> 未ログイン`);
    }

    // ログアウト
    $("btnLogout").onclick = ()=>{
      try{
        if(typeof lsClearShopLogin === "function"){ lsClearShopLogin(); }
        localStorage.removeItem("shopCode");
        localStorage.removeItem("shopPin");
        localStorage.removeItem("shop");
        localStorage.removeItem("pin");
        sessionStorage.removeItem("shopCode");
        sessionStorage.removeItem("shopPin");
        sessionStorage.removeItem("shop");
        sessionStorage.removeItem("pin");
      }catch(e){}
      location.href = "login.html?v=" + Date.now();
    };

    // 接続チェック
    $("btnCheck").onclick = async ()=>{
      try{
        const r = await (typeof rtdbGet === "function"
          ? rtdbGet(`shops/${encodeURIComponent(shop)}/staffPin`)
          : rtdbGetLocal(`shops/${encodeURIComponent(shop)}/staffPin`));
        if(r && r.ok === false) throw new Error(`HTTP ${r.status}`);
        setStatus(`<span class="ok">OK</span> FBRD 接続OK`);
      }catch(e){
        setStatus(`<span class="ng">NG</span> ${E(e.message||e)}`);
      }
    };

    /* ===== ハンディ：テーブルセレクタ ===== */
    const MAX_KEY = "handyMaxTables";
    function getMaxTables(){
      const v = Number(localStorage.getItem(MAX_KEY) || $("inpMaxTables").value || 30);
      if(!Number.isFinite(v) || v < 1) return 30;
      return Math.min(200, Math.floor(v));
    }
    function buildTableOptions(){
      const max = getMaxTables();
      $("inpMaxTables").value = String(max);

      const sel = $("selTable");
      const prev = sel.value || "1";
      sel.innerHTML = "";

      for(let i=1;i<=max;i++){
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = "T" + i;
        sel.appendChild(opt);
      }
      sel.value = (Number(prev) >= 1 && Number(prev) <= max) ? prev : "1";
      setHandyStatus(`テーブル上限: ${max}（変更可）`);
    }
    $("btnRebuildTables").onclick = ()=>{
      const v = Number($("inpMaxTables").value || 30);
      localStorage.setItem(MAX_KEY, String(v));
      buildTableOptions();
    };

    async function openOrderForTable(table){
      if(!shop){
        setHandyStatus(`<span class="ng">NG</span> shopCode がありません（未ログイン）`);
        return;
      }
      const t = String(table||"").trim();
      if(!t){
        setHandyStatus(`<span class="ng">NG</span> テーブル未選択`);
        return;
      }

      try{
        setHandyStatus(`<span class="mono">準備中...</span>`);

        // 1) webActiveSessions/{shop}/{table} を確認（tokenがあれば流用）
        const sessPath = `webActiveSessions/${encodeURIComponent(shop)}/${encodeURIComponent(t)}`;
        const sess = await RTDB_GET(sessPath);

        let token = "";
        if(sess && typeof sess === "object" && sess.token && sess.active !== false){
          token = String(sess.token).trim();
        }else{
          // 2) 無ければ token 新規発行して着席扱いにする（★ここだけがPUTする）
          token = genTokenLocal(shop, t);
          const payload = {
            shop,
            table: String(t),
            token,
            active: true,
            createdAt: Date.now(),
            updatedAt: Date.now(),
            source: "handy"
          };
          await RTDB_PUT(sessPath, payload);
        }

        // 3) order.html へ直通
        const url = `order.html?shop=${encodeURIComponent(shop)}&table=${encodeURIComponent(t)}&token=${encodeURIComponent(token)}&v=${Date.now()}`;
        setHandyStatus(`<span class="ok">OK</span> T${E(t)} を開きます（token固定運用）`);
        location.href = url;

      }catch(e){
        setHandyStatus(`<span class="ng">失敗</span> ${E(e.message||e)}`);
      }
    }

    $("btnGoOrder").onclick = ()=>{
      const t = $("selTable").value;
      openOrderForTable(t);
    };

    // boot
    buildTableOptions();
  </script>
</body>
</html>
