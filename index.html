<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>izakaya-relay</title>
</head>
<body style="margin:0">
  <pre id="msg" style="padding:16px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;">loading...</pre>

<script>
(() => {
  const VERSION = "relay-2026-01-12-a"; // ここが表示されれば反映できてる
  const FIREBASE_DB_URL = "https://izakayaorder-default-rtdb.firebaseio.com";
  const THUNKABLE_URL   = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH";

  const out = document.getElementById("msg");
  const log = (s) => { out.textContent += s + "\n"; };

  out.textContent = "";
  log("VERSION=" + VERSION);

  const params = new URLSearchParams(location.search);
  const shop  = params.get("shop");
  const table = params.get("table");
  const v     = params.get("v"); // キャッシュ潰し用
  log("v=" + v);

  if (!shop || !table) {
    log("missing params. ex: ?shop=daboya&table=1");
    return;
  }
  log("shop=" + shop + " table=" + table);

  const enc = encodeURIComponent;
  const activeUrl  = `${FIREBASE_DB_URL}/webActiveSessions/${enc(shop)}/${enc(table)}.json`;

  const token4 = () => String(Math.floor(Math.random()*10000)).padStart(4,"0");
  const rand3  = () => String(Math.floor(Math.random()*1000)).padStart(3,"0");

  const GET = async (url) => {
    const r = await fetch(url, { method:"GET" });
    const t = await r.text();
    return { ok:r.ok, status:r.status, text:t, json: t ? JSON.parse(t) : null };
  };

  const PUT = async (url, obj) => {
    const r = await fetch(url, {
      method:"PUT",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(obj)
    });
    const t = await r.text();
    return { ok:r.ok, status:r.status, text:t };
  };

  const goUrl = () => {
    // Thunkable側が拾いやすいように query と hash 両方付ける
    const qs = `shop=${enc(shop)}&table=${enc(table)}`;
    return `${THUNKABLE_URL}?${qs}#${qs}`;
  };

  const showLinkAndGo = () => {
    const url = goUrl();
    log("\nGO=" + url);

    // 手動リンク（iOSで自動遷移ブロック対策）
    const a = document.createElement("a");
    a.href = url;
    a.textContent = "→ 注文ページへ進む（タップ）";
    a.style.display = "inline-block";
    a.style.marginTop = "12px";
    a.style.fontSize = "18px";
    document.body.appendChild(a);

    // 自動遷移も試す
    setTimeout(() => { location.href = url; }, 200);
  };

  (async () => {
    log("\nGET active...");
    log(activeUrl);
    const g = await GET(activeUrl);
    log(`GET status=${g.status}`);
    log(`GET text=${g.text}`);

    if (!g.ok) {
      log("\nERROR: GET blocked (Rules?)");
      return;
    }

    // ✅ 既に active がある → 上書きせずそのまま進む（会計まで固定）
    if (g.json && g.json.token) {
      log("\nactive exists -> NO WRITE (OK)");
      showLinkAndGo();
      return;
    }

    // ✅ 無い → 初回だけ作る
    const t4 = token4();
    const token = `${shop}-${table}-${t4}-${rand3()}`; // token4は短い/キーは衝突しにくい
    log("\nactive is null -> CREATE");
    log("token=" + token);

    const activePayload  = { token, token4: t4, updatedAt: Date.now() };
    const sessionPayload = { shop, table, token, token4: t4, createdAt: Date.now() };

    const sessionUrl = `${FIREBASE_DB_URL}/webSessions/${enc(token)}.json`;

    log("\nPUT active...");
    const pa = await PUT(activeUrl, activePayload);
    log(`PUT active status=${pa.status}`);
    log(`PUT active text=${pa.text}`);

    log("\nPUT session...");
    log(sessionUrl);
    const ps = await PUT(sessionUrl, sessionPayload);
    log(`PUT session status=${ps.status}`);
    log(`PUT session text=${ps.text}`);

    if (!pa.ok || !ps.ok) {
      log("\nERROR: PUT blocked (Rules?)");
      return;
    }

    log("\nOK -> GO");
    showLinkAndGo();
  })().catch(e => {
    log("\nFATAL: " + (e && e.message ? e.message : String(e)));
  });
})();
</script>
</body>
</html>
