<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>shop login</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px;max-width:720px;margin:0 auto}
    input,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #ccc}
    button{cursor:pointer;border:0;font-weight:800}
    .row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
    .btn{background:#111827;color:#fff}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0;background:#fff}
    .ok{color:#16a34a;font-weight:800}
    .ng{color:#dc2626;font-weight:800}
    .muted{color:#6b7280;font-size:12px;line-height:1.5}
    label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:#111827}
    input[type="checkbox"]{width:18px;height:18px}
  </style>
</head>
<body>
  <h2>店側ログイン</h2>

  <div class="card">
    <div class="row">
      <input id="shop" placeholder="shopコード（例：daboya）" style="flex:1;min-width:240px">
      <input id="pin"  placeholder="PIN（例：1111）" style="width:160px" inputmode="numeric">
      <button id="btnLogin" class="btn">ログイン</button>
    </div>

    <div class="row" style="justify-content:space-between">
      <label class="chk">
        <input id="remember" type="checkbox">
        この端末でログインを保持（推奨）
      </label>
      <button id="btnLogout" style="background:#ef4444;color:#fff;display:none">ログアウト</button>
    </div>

    <div id="msg" class="muted">端末ごとにログインします（厨房／会計で分けてもOK）。</div>
  </div>

  <!-- 共通JS -->
  <script src="shop_common.js"></script>

  <script>
    const $ = (id)=>document.getElementById(id);

    function setMsg(html){ $("msg").innerHTML = html; }

    // 起動時：Remember があれば session に復元（shop_common.js側で restoreRememberedLogin を後で統一します）
    // いまの shop_common.js に無ければ、この部分は後で shop_common.js を上書きした時に効きます。
    try{
      if(typeof restoreRememberedLogin === "function"){ restoreRememberedLogin(); }
    }catch{}

    // 既にログイン済みならボタン切り替え
    (function init(){
      const shop = getShop();
      const pin  = getPin();
      if(shop && pin){
        $("btnLogout").style.display = "inline-block";
        setMsg(`<span class="ok">ログイン中：</span>${shop}（PINは非表示）<br><span class="muted">続きは店側メニューへ移動します</span>`);
      }
    })();

    $("btnLogin").onclick = async () => {
      const shop = $("shop").value.trim();
      const pin  = $("pin").value.trim();
      const remember = $("remember").checked;

      if(!shop || !pin){
        setMsg(`<span class="ng">shop と PIN を入れてください</span>`);
        return;
      }

      try{
        setMsg(`checking...`);

        // ✅ PIN照合：shops/{shop}/staffPin と一致したらOK
        const r = await rtdbGet(`shops/${encodeURIComponent(shop)}/staffPin`);
        if(!r.ok){
          setMsg(`<span class="ng">shopが見つからない/取得失敗</span><br><small>${esc(r.status)} ${esc(r.url)}</small>`);
          return;
        }

        const staffPin = String(r.json ?? "").trim();
        if(!staffPin){
          setMsg(`<span class="ng">staffPin が未設定です</span>（RTDB: shops/${esc(shop)}/staffPin）`);
          return;
        }

        if(String(pin) !== staffPin){
          setMsg(`<span class="ng">PINが違います</span>`);
          return;
        }

        // ✅ sessionStorage に統一保存
        ssSet("shop", shop);
        ssSet("pin",  pin);

        // ✅ Remember（任意）：localStorageにも保存（後で shop_common.js の restoreRememberedLogin で復元）
        if(remember){
          localStorage.setItem("shop", shop);
          localStorage.setItem("pin",  pin);
        }else{
          localStorage.removeItem("shop");
          localStorage.removeItem("pin");
        }

        $("btnLogout").style.display = "inline-block";
        setMsg(`<span class="ok">ログイン成功</span> → 店側メニューへ移動します`);

        // 店側メニュー入口へ
        setTimeout(()=>{ location.href = `menu.html?v=${Date.now()}`; }, 200);

      }catch(e){
        setMsg(`<span class="ng">エラー</span> <small>${esc(e.message||e)}</small>`);
      }
    };

    $("btnLogout").onclick = () => {
      // session統一：ログアウトも session を消す
      ssClear();
      // Rememberも消す
      localStorage.removeItem("shop");
      localStorage.removeItem("pin");
      location.reload();
    };
  </script>
</body>
</html>
