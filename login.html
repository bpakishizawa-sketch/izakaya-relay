<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>店側ログイン</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:18px; max-width:720px; margin:0 auto; background:#f6f7f9;}
    h1{font-size:22px;margin:0 0 10px}
    .sub{font-size:12px;color:#6b7280;margin-bottom:14px;line-height:1.6}
    .card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0;background:#fff;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input,button{font-size:16px;padding:12px;border-radius:12px}
    input{border:1px solid #d1d5db; background:#fff; width:100%; box-sizing:border-box}
    button{cursor:pointer;border:0;font-weight:900}
    .btn{background:#111827;color:#fff; min-width:140px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .small{font-size:12px;color:#6b7280}
    details summary{cursor:pointer;font-weight:900;color:#374151}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}
  </style>

  <!-- ✅ Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body>
  <h1>店側ログイン</h1>
  <div class="sub">
    shopコード と（Authの）メール/パスワードでログインします。<br>
    成功すると <b>localStorage.shopCode</b> を保存して menu.html に移動します。
  </div>

  <div class="card">
    <div class="row">
      <input id="shopInp" placeholder="shopコード（例：daboya）" autocomplete="username" />
      <input id="emailInp" placeholder="メール（Auth）" inputmode="email" autocomplete="email" />
      <input id="passInp" placeholder="パスワード（Auth）" type="password" autocomplete="current-password" style="max-width:240px" />
      <button id="btnLogin" class="btn">ログイン</button>
    </div>

    <div id="msg" style="margin-top:10px;" class="small">-</div>
  </div>

  <details class="card">
    <summary>デバッグ（開いて確認）</summary>
    <pre id="debug" class="mono">-</pre>
  </details>

<script>
/** ===== 設定（ここだけ） ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCZTWH0Lv1EfUiW5iSX1skQ9MvUao6Dx10",
  authDomain: "izakayaorder.firebaseapp.com",
  databaseURL: "https://izakayaorder-default-rtdb.firebaseio.com",
  projectId: "izakayaorder",
  storageBucket: "izakayaorder.firebasestorage.app",
  messagingSenderId: "1083271376500",
  appId: "1:1083271376500:web:248f32d5aa470be087ab21",
  measurementId: "G-009BPY8BFP"
};
/** ============================ */

const $ = (id)=>document.getElementById(id);

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function setMsg(html){ $("msg").innerHTML = html; }

/** localStorage（店側） */
const KEY_SHOP = "shopCode";
const KEY_PIN  = "shopPin"; // 互換維持用（Auth運用なら固定値でOK）
function lsSet(k,v){ localStorage.setItem(k, String(v||"")); }
function lsGet(k){ return (localStorage.getItem(k)||"").trim(); }

function initFirebaseOnce(){
  if(typeof firebase === "undefined") throw new Error("firebase SDK が読み込まれていません");
  if(!firebase.apps || firebase.apps.length === 0){
    firebase.initializeApp(FIREBASE_CONFIG);
  }
}

async function doLogin(){
  const shop = ($("shopInp").value || "").trim();
  const email = ($("emailInp").value || "").trim();
  const pass  = ($("passInp").value || "").trim();

  if(!shop){
    setMsg(`<span class="ng">NG</span> shopコードを入力してください`);
    return;
  }
  if(!email || !pass){
    setMsg(`<span class="ng">NG</span> メール/パスワードを入力してください`);
    return;
  }

  $("btnLogin").disabled = true;
  setMsg(`<span class="mono">ログイン中...</span>`);

  try{
    initFirebaseOnce();

    const cred = await firebase.auth().signInWithEmailAndPassword(email, pass);

    // ✅ ここが重要：shopCode を必ず保存
    lsSet(KEY_SHOP, shop);

    // ✅ 互換のため pin も埋める（requireLogin対策）
    lsSet(KEY_PIN, "AUTH");

    const dbg = {
      shopSaved: lsGet(KEY_SHOP),
      pinSaved: lsGet(KEY_PIN),
      user: { uid: cred.user?.uid || "-", email: cred.user?.email || "-" }
    };
    $("debug").textContent = JSON.stringify(dbg, null, 2);

    setMsg(`<span class="ok">OK</span> ログインしました → menuへ移動します`);
    setTimeout(()=> location.href = `menu.html?v=${Date.now()}`, 150);

  }catch(e){
    setMsg(`<span class="ng">NG</span> ${esc(e.message || e)}`);
    $("btnLogin").disabled = false;
  }
}

$("btnLogin").onclick = doLogin;
$("passInp").addEventListener("keydown", (e)=>{ if(e.key==="Enter") doLogin(); });

(function boot(){
  // shopCodeが残ってるならshop入力へ反映（便利）
  const s = lsGet(KEY_SHOP);
  if(s) $("shopInp").value = s;
})();
</script>
</body>
</html>
