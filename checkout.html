<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - 会計</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:18px; max-width:1200px; margin:0 auto; background:#f6f7f9;}
    h1{font-size:22px;margin:0 0 8px}
    .sub{font-size:12px;color:#6b7280;margin-bottom:12px;line-height:1.6}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:10px 0;background:#fff;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .muted{color:#6b7280}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    select,input{font-size:16px;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
    button{font-size:14px;padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:900}
    button.dark{background:#111827;color:#fff}
    button.light{background:#f3f4f6;color:#111827;border:1px solid #ddd}
    button.green{background:#16a34a;color:#fff}
    button.red{background:#dc2626;color:#fff}
    button.purple{background:#7c3aed;color:#fff}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #ddd;font-weight:900;font-size:12px}
    .grid2{display:grid;grid-template-columns:1fr; gap:12px; align-items:start;}
    @media(min-width:860px){ .grid2{grid-template-columns: 1fr 1fr;} }

    .tableGrid{display:grid;grid-template-columns: repeat(6, 1fr); gap:10px; margin-top:10px;}
    @media(max-width:860px){ .tableGrid{grid-template-columns: repeat(4, 1fr);} }
    .tbtn{padding:14px 10px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:900}
    .tbtn.active{border-color:#3b82f6;background:#dbeafe}
    .tbtn.request{border-color:#f59e0b;background:#fff7ed}
    .tmeta{font-size:11px;color:#6b7280;margin-top:4px}

    .lines{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .line{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed #eee;padding-top:8px}
    .line:first-child{border-top:0;padding-top:0}
    .sumBig{font-size:22px;font-weight:900}
    .hr{height:1px;background:#eee;margin:12px 0}

    /* alert banner */
    .alertBanner{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 10px;
      z-index: 9999;
      background: #dc2626;
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      display: none;
      max-width: 92vw;
      text-align: center;
    }

    /* bill print area */
    #printArea{background:#fff; padding:14px; border-radius:12px; border:1px solid #e5e7eb;}
    .printHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
    .printTitle{font-weight:1000;font-size:18px}
    .printMeta{font-size:12px;color:#6b7280;line-height:1.5}
    .taxBox{margin-top:10px;border:1px dashed #ddd;border-radius:12px;padding:10px;background:#fafafa}
    .taxRow{display:flex;justify-content:space-between;gap:10px}
    .taxRow b{font-weight:1000}
    .right{ text-align:right }

    /* sales print card (screen: hidden) */
    #salesPrintCard{display:none;}
    #salesPrintArea{background:#fff; padding:14px; border-radius:12px; border:1px solid #e5e7eb;}

    /* ===== 印刷モード切替 ===== */
    @media print{
      body{background:#fff; padding:0; max-width:none; margin:0;}
      .noPrint{display:none !important;}

      /* デフォルト全部隠す（モードで表示する） */
      body *{ visibility: hidden; }

      /* 明細（通常会計） */
      body[data-print="bill"] #printArea,
      body[data-print="bill"] #printArea *{
        visibility: visible;
      }
      body[data-print="bill"] #printArea{
        position: absolute; left:0; top:0; width:100%;
        border:0; padding:0;
      }

      /* 売上（日別） */
      body[data-print="sales"] #salesPrintCard,
      body[data-print="sales"] #salesPrintCard *{
        visibility: visible;
      }
      body[data-print="sales"] #salesPrintCard{
        display:block !important; /* ★inline display:none を強制上書き */
        position:absolute; left:0; top:0; width:100%;
        border:0; padding:0; margin:0;
        background:#fff;
      }
      body[data-print="sales"] #salesPrintArea{
        border:0; padding:0;
      }
    }

    details summary{cursor:pointer;font-weight:900;color:#374151}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}
  </style>
</head>
<body>
  <div id="alertBanner" class="alertBanner">会計依頼！</div>

  <h1>会計（Checkout）</h1>
  <div class="sub"></div>

  <div class="card noPrint">
    <div class="row">
      <span class="pill">shop: <b id="shopText" class="mono">-</b></span>
      <span class="pill">店名: <b id="shopNameText" class="mono">-</b></span>
      <span class="pill">税率: <b id="taxText" class="mono">-</b></span>
      <span class="pill">選択テーブル: <b id="selTableText" class="mono">-</b></span>

      <button id="btnBack" class="light">← menuへ</button>
      <button id="btnKitchen" class="light">← kitchenへ</button>
      <button id="btnRefresh" class="dark">更新</button>

      <label class="row">
        <span class="muted" style="font-size:12px">自動更新</span>
        <select id="autoSec">
          <option value="0">OFF</option>
          <option value="2">2秒</option>
          <option value="5">5秒</option>
          <option value="10" selected>10秒</option>
        </select>
      </label>

      <button id="btnSound" class="light">🔔音OFF</button>
      <button id="btnBeep" class="light">テスト</button>
    </div>

    <div id="status" class="muted" style="margin-top:8px;">-</div>
  </div>

  <div class="grid2">
    <!-- left -->
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:900">テーブル状況（着席中のみ）</div>
      </div>

      <div class="hr"></div>

      <div class="row" style="gap:8px">
        <span class="pill">着席 <b id="activeCount" class="mono">0</b></span>
        <span class="pill" style="background:#fff7ed;border-color:#f59e0b">会計依頼 <b id="reqCount" class="mono">0</b></span>
      </div>

      <div id="tableGrid" class="tableGrid"></div>
    </div>

    <!-- right -->
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:900">会計明細（インボイス表示）</div>
        <div class="row noPrint" style="gap:8px">
          <button id="btnPdf" class="light">PDF</button>
          <button id="btnConfirm" class="green">会計確定</button>
        </div>
      </div>

      <div class="hr"></div>

      <div id="printArea">
        <div class="printHead">
          <div>
            <div class="printTitle" id="printShopName">-</div>
            <div class="printMeta" id="printMeta">-</div>
          </div>
          <div class="right">
            <div class="muted" style="font-size:12px">テーブル</div>
            <div style="font-weight:1000;font-size:18px" id="billTable">-</div>
            <div class="muted" style="font-size:12px;margin-top:6px">税込合計</div>
            <div class="sumBig mono" id="billTotal">-</div>
          </div>
        </div>

        <div class="taxBox">
          <div class="taxRow"><div class="muted">税率</div><div class="mono"><b id="billTaxRate">-</b></div></div>
          <div class="taxRow"><div class="muted">税抜価格</div><div class="mono"><b id="billEx">-</b></div></div>
          <div class="taxRow"><div class="muted">消費税額</div><div class="mono"><b id="billTax">-</b></div></div>
          <div class="taxRow"><div class="muted">税込価格</div><div class="mono"><b id="billIn">-</b></div></div>
        </div>

        <div class="hr"></div>

        <div class="muted" style="font-size:12px;margin-bottom:6px">明細</div>
        <div id="billLines" class="lines"></div>
      </div>

      <div class="muted noPrint" id="confirmMsg" style="margin-top:10px;">-</div>
    </div>
  </div>

  <!-- ===== 日別売上（PDF/削除） ===== -->
  <div class="card noPrint">
    <div class="row" style="justify-content:space-between">
      <div style="font-weight:900">日別売上（明細PDF）</div>
      <div class="row" style="gap:8px">
        <input id="salesDate" type="date" />
        <button id="btnSalesRefresh" class="dark">売上更新</button>
        <button id="btnSalesPdf" class="purple">売上PDF</button>
        <button id="btnSalesDelete" class="red">この日の履歴を削除</button>
      </div>
    </div>
    <div class="muted" id="salesStatus" style="margin-top:8px;">-</div>

    <div class="hr"></div>

    <div class="row" style="justify-content:space-between;">
      <div class="muted">件数</div>
      <div class="mono" style="font-weight:900"><span id="salesCount">0</span> 件</div>
    </div>

    <div class="row" style="justify-content:space-between; margin-top:6px;">
      <div class="muted">税込合計</div>
      <div class="mono" style="font-weight:1000;font-size:18px" id="salesTotal">0 円</div>
    </div>

    <div class="row" style="justify-content:space-between; margin-top:6px;">
      <div class="muted">税抜合計</div>
      <div class="mono" style="font-weight:1000" id="salesExTotal">0 円</div>
    </div>

    <div class="row" style="justify-content:space-between; margin-top:6px;">
      <div class="muted">消費税合計</div>
      <div class="mono" style="font-weight:1000" id="salesTaxTotal">0 円</div>
    </div>

    <div class="hr"></div>

    <div id="salesList" class="lines"></div>
  </div>

  <!-- 売上印刷用（screenでは隠す／printで強制表示） -->
  <div class="card" id="salesPrintCard">
    <div id="salesPrintArea">
      <div class="printHead">
        <div>
          <div class="printTitle" id="salesPrintShop">-</div>
          <div class="printMeta" id="salesPrintMeta">-</div>
        </div>
        <div class="right">
          <div class="muted" style="font-size:12px">日付</div>
          <div style="font-weight:1000;font-size:18px" id="salesPrintDate">-</div>
          <div class="muted" style="font-size:12px;margin-top:6px">税込合計</div>
          <div class="sumBig mono" id="salesPrintTotal">-</div>
        </div>
      </div>

      <div class="taxBox">
        <div class="taxRow"><div class="muted">税率</div><div class="mono"><b id="salesPrintTaxRate">-</b></div></div>
        <div class="taxRow"><div class="muted">税抜合計</div><div class="mono"><b id="salesPrintEx">-</b></div></div>
        <div class="taxRow"><div class="muted">消費税合計</div><div class="mono"><b id="salesPrintTax">-</b></div></div>
        <div class="taxRow"><div class="muted">税込合計</div><div class="mono"><b id="salesPrintIn">-</b></div></div>
      </div>

      <div class="hr"></div>
      <div class="muted" style="font-size:12px;margin-bottom:6px">明細（会計履歴）</div>
      <div id="salesPrintLines" class="lines"></div>
    </div>
  </div>

<script>
/** ===== 設定 ===== */
const DB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
/** ============== */

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

function getShop(){
  return (localStorage.getItem("shopCode") || "").trim();
}

async function rtdbGet(path){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url);
  const txt = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${txt}`);
  return JSON.parse(txt || "null");
}
async function rtdbPut(path, data){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });
  const txt = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${txt}`);
  return JSON.parse(txt || "null");
}
async function rtdbPost(path, data){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });
  const txt = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${txt}`);
  return JSON.parse(txt || "null");
}
async function rtdbDelete(path){
  return rtdbPut(path, null);
}

function yen(n){
  const x = Number(n||0);
  return x.toLocaleString("ja-JP") + " 円";
}
function jstDateKey(ts=Date.now()){
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const da = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${da}`;
}
function normalizeTaxRate(v){
  let x = Number(v);
  if(!Number.isFinite(x) || x <= 0) return 0.1;
  if(x > 1.0) x = x / 100;
  return x;
}
function splitTaxFromInclusive(inclusiveTotal, rate){
  const r = Number(rate||0);
  const inc = Math.max(0, Number(inclusiveTotal||0));
  if(r <= 0) return { ex: inc, tax: 0, in: inc };
  const ex = Math.floor(inc / (1 + r));
  const tax = inc - ex;
  return { ex, tax, in: inc };
}

/* ===== iOS音（省略せず残す） ===== */
let soundEnabled = false;
let audioCtx = null;
function ensureAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();
}
function beepOnce(){
  if(!soundEnabled) return;
  try{
    ensureAudio();
    if(!audioCtx) return;
    if(audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = 880;
    g.gain.value = 0.06;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    setTimeout(()=>{ o.stop(); }, 220);
  }catch{}
}
function beep3sec(){
  if(!soundEnabled) return;
  const pattern = [0, 350, 700, 1050, 1400, 1750, 2100, 2450, 2800];
  for(const ms of pattern){ setTimeout(()=>beepOnce(), ms); }
}

function lastReqKey(shop){ return `checkout_lastMax_${shop}`; }
function loadLastMax(shop){ return Number(localStorage.getItem(lastReqKey(shop)) || 0); }
function saveLastMax(shop, n){ localStorage.setItem(lastReqKey(shop), String(Number(n||0))); }

let timer = null;
let selectedTable = "";
let activeSessions = {};
let checkoutRequests = {};

let shopName = "";
let taxRate = 0.1;

function setStatus(html){ $("status").innerHTML = html || ""; }
function setConfirmMsg(html){ $("confirmMsg").innerHTML = html || ""; }
function setSalesStatus(html){ $("salesStatus").innerHTML = html || ""; }

function pickTable(t){
  selectedTable = String(t||"");
  $("selTableText").textContent = selectedTable ? `T${selectedTable}` : "-";
  renderBill();
}

function renderTables(){
  const grid = $("tableGrid");
  grid.innerHTML = "";

  const activeTables = Object.keys(activeSessions || {}).sort((a,b)=>Number(a)-Number(b));
  const reqTables = new Set(Object.keys(checkoutRequests || {}));

  $("activeCount").textContent = String(activeTables.length);
  $("reqCount").textContent = String(reqTables.size);

  if(activeTables.length === 0){
    grid.innerHTML = `<div class="muted"><small>着席中のテーブルがありません</small></div>`;
    return;
  }

  for(const t of activeTables){
    const sess = activeSessions[t] || {};
    const hasReq = reqTables.has(String(t));

    const btn = document.createElement("button");
    btn.className = "tbtn" + (String(t)===String(selectedTable) ? " active" : "") + (hasReq ? " request" : "");
    btn.innerHTML = `
      <div>T${esc(t)}</div>
      <div class="tmeta mono">${hasReq ? "会計依頼あり" : (sess.token ? "着席中" : "")}</div>
    `;
    btn.onclick = ()=> pickTable(t);
    grid.appendChild(btn);
  }

  if(!selectedTable){
    const firstReq = activeTables.find(t => reqTables.has(String(t)));
    pickTable(firstReq || activeTables[0]);
  }else{
    if(!activeSessions[selectedTable]){
      pickTable(activeTables[0]);
    }
  }
}

function flattenOrdersFromReq(req){
  const lines = [];
  if(!req || !Array.isArray(req.orders)) return lines;
  for(const o of req.orders){
    const items = Array.isArray(o.items) ? o.items : [];
    for(const it of items){
      const name = String(it.name||"");
      const qty = Number(it.qty||0);
      const price = Number(it.price||0);
      if(!name) continue;
      lines.push({ name, qty, price, sub: price*qty });
    }
  }
  return lines;
}

function renderBill(){
  const t = selectedTable;
  const req = checkoutRequests && t ? checkoutRequests[t] : null;

  $("billTable").textContent = t ? `T${t}` : "-";

  const incTotal = req ? Number(req.total||0) : 0;
  $("billTotal").textContent = req ? yen(incTotal) : "-";

  $("printShopName").textContent = shopName ? shopName : "店名未設定";
  $("printMeta").textContent = `shopCode: ${getShop() || "-"} / 印刷: ${new Date().toLocaleString("ja-JP")}`;

  const sp = splitTaxFromInclusive(incTotal, taxRate);
  $("billTaxRate").textContent = `${Math.round(taxRate*1000)/10}%`;
  $("billEx").textContent = yen(sp.ex);
  $("billTax").textContent = yen(sp.tax);
  $("billIn").textContent = yen(sp.in);

  if(!req){
    $("billLines").innerHTML = `<div class="muted"><small>会計依頼はありません（テーブルを選択してください）</small></div>`;
    $("btnConfirm").disabled = true;
    return;
  }
  $("btnConfirm").disabled = false;

  const lines = flattenOrdersFromReq(req);
  if(lines.length === 0){
    $("billLines").innerHTML = `<div class="muted"><small>明細がありません（ordersが空）</small></div>`;
    return;
  }

  const map = new Map();
  for(const x of lines){
    const k = x.name + "|" + x.price;
    const cur = map.get(k) || { name:x.name, price:x.price, qty:0, sub:0 };
    cur.qty += x.qty;
    cur.sub += x.sub;
    map.set(k, cur);
  }
  const merged = Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name,"ja"));

  $("billLines").innerHTML = merged.map(x=>`
    <div class="line">
      <div>${esc(x.name)} <span class="muted">x${esc(String(x.qty))}</span></div>
      <div class="mono">${esc(String(x.price))} / ${esc(yen(x.sub))}</div>
    </div>
  `).join("");
}

function detectNewCheckout(shop){
  let maxRequestedAt = 0;
  for(const t of Object.keys(checkoutRequests||{})){
    const r = checkoutRequests[t];
    const ts = Number(r?.requestedAt||0);
    if(ts > maxRequestedAt) maxRequestedAt = ts;
  }

  const last = loadLastMax(shop);
  if(!last){
    saveLastMax(shop, maxRequestedAt);
    return;
  }
  if(maxRequestedAt > last){
    beep3sec();
    saveLastMax(shop, maxRequestedAt);
  }
}

async function loadShopSettings(shop){
  try{
    const sn = await rtdbGet(`shops/${encodeURIComponent(shop)}/shopname`);
    shopName = (typeof sn === "string") ? sn : (sn?.name ? String(sn.name) : "");
  }catch{ shopName=""; }

  try{
    const tx = await rtdbGet(`shops/${encodeURIComponent(shop)}/tax`);
    taxRate = normalizeTaxRate(tx);
  }catch{ taxRate=0.1; }

  $("shopNameText").textContent = shopName ? shopName : "-";
  $("taxText").textContent = `${Math.round(taxRate*1000)/10}%`;
}

async function refresh(){
  const shop = getShop();
  if(!shop){
    setStatus(`<span class="ng">未ログイン</span> menu.html へ戻ります`);
    setTimeout(()=> location.href = `menu.html?v=${Date.now()}`, 400);
    return;
  }
  $("shopText").textContent = shop;

  try{
    setStatus(`<span class="mono">loading...</span>`);
    await loadShopSettings(shop);

    const sess = await rtdbGet(`webActiveSessions/${encodeURIComponent(shop)}`);
    activeSessions = (sess && typeof sess==="object") ? sess : {};

    const filtered = {};
    for(const [t, s] of Object.entries(activeSessions)){
      if(!s || typeof s!=="object") continue;
      if(s.active === false) continue;
      if(!s.token) continue;
      filtered[String(t)] = s;
    }
    activeSessions = filtered;

    const req = await rtdbGet(`shops/${encodeURIComponent(shop)}/checkoutRequests`);
    checkoutRequests = (req && typeof req==="object") ? req : {};

    detectNewCheckout(shop);

    renderTables();
    renderBill();

    setStatus(`<span class="ok">OK</span> 着席:${Object.keys(activeSessions).length} / 会計依頼:${Object.keys(checkoutRequests).length} （${new Date().toLocaleTimeString()}）`);
  }catch(e){
    setStatus(`<span class="ng">読込失敗</span> ${esc(e.message||e)}`);
  }
}

function setAuto(){
  const sec = Number($("autoSec").value || 0);
  if(timer){ clearInterval(timer); timer = null; }
  if(sec > 0){
    timer = setInterval(refresh, sec * 1000);
  }
}

/* ===== 売上（日別） ===== */
let salesDayData = {};

function renderSalesDay(dateKey){
  const listWrap = $("salesList");
  listWrap.innerHTML = "";

  const entries = Object.entries(salesDayData || {});
  if(entries.length === 0){
    $("salesCount").textContent = "0";
    $("salesTotal").textContent = yen(0);
    $("salesExTotal").textContent = yen(0);
    $("salesTaxTotal").textContent = yen(0);
    listWrap.innerHTML = `<div class="muted"><small>この日の売上履歴はありません</small></div>`;
    return;
  }

  const rows = entries
    .map(([k,v]) => ({ key:k, v }))
    .sort((a,b)=>Number(a.v?.confirmedAt||0)-Number(b.v?.confirmedAt||0));

  let sumIn = 0, sumEx = 0, sumTax = 0;

  for(const r of rows){
    const v = r.v || {};
    const inc = Number(v.inclusiveTotal||0);
    const ex = Number(v.exclusiveTotal||0);
    const tax = Number(v.taxAmount||0);

    sumIn += inc; sumEx += ex; sumTax += tax;

    const t = String(v.table||"-");
    const time = v.confirmedAt ? new Date(Number(v.confirmedAt)).toLocaleTimeString("ja-JP") : "-";

    const div = document.createElement("div");
    div.className = "line";
    div.innerHTML = `
      <div>
        <b>T${esc(t)}</b> <span class="muted">${esc(time)}</span>
      </div>
      <div class="mono" style="font-weight:900">${esc(yen(inc))}</div>
    `;
    listWrap.appendChild(div);
  }

  $("salesCount").textContent = String(rows.length);
  $("salesTotal").textContent = yen(sumIn);
  $("salesExTotal").textContent = yen(sumEx);
  $("salesTaxTotal").textContent = yen(sumTax);
}

async function loadSalesDay(dateKey){
  const shop = getShop();
  if(!shop) return;

  setSalesStatus(`<span class="mono">売上 loading...</span>`);
  try{
    const data = await rtdbGet(`shops/${encodeURIComponent(shop)}/salesDaily/${encodeURIComponent(dateKey)}`);
    salesDayData = (data && typeof data === "object") ? data : {};
    renderSalesDay(dateKey);
    setSalesStatus(`<span class="ok">OK</span> ${dateKey}（${Object.keys(salesDayData).length}件）`);
  }catch(e){
    salesDayData = {};
    renderSalesDay(dateKey);
    setSalesStatus(`<span class="ng">読込失敗</span> ${esc(e.message||e)}`);
  }
}

function showSalesPrint(dateKey){
  const entries = Object.entries(salesDayData||{})
    .map(([k,v])=>({key:k,v}))
    .sort((a,b)=>Number(a.v?.confirmedAt||0)-Number(b.v?.confirmedAt||0));

  let sumIn=0,sumEx=0,sumTax=0;

  const linesHtml = entries.map(r=>{
    const v = r.v||{};
    const t = String(v.table||"-");
    const time = v.confirmedAt ? new Date(Number(v.confirmedAt)).toLocaleTimeString("ja-JP") : "-";
    const inc = Number(v.inclusiveTotal||0);
    sumIn += inc;
    sumEx += Number(v.exclusiveTotal||0);
    sumTax += Number(v.taxAmount||0);
    return `
      <div class="line">
        <div><b>T${esc(t)}</b> <span class="muted">${esc(time)}</span></div>
        <div class="mono" style="font-weight:900">${esc(yen(inc))}</div>
      </div>
    `;
  }).join("");

  $("salesPrintShop").textContent = shopName ? shopName : "店名未設定";
  $("salesPrintMeta").textContent = `shopCode: ${getShop()||"-"} / 印刷: ${new Date().toLocaleString("ja-JP")}`;
  $("salesPrintDate").textContent = dateKey;
  $("salesPrintTotal").textContent = yen(sumIn);

  $("salesPrintTaxRate").textContent = `${Math.round(taxRate*1000)/10}%`;
  $("salesPrintEx").textContent = yen(sumEx);
  $("salesPrintTax").textContent = yen(sumTax);
  $("salesPrintIn").textContent = yen(sumIn);

  $("salesPrintLines").innerHTML = linesHtml || `<div class="muted"><small>明細がありません</small></div>`;
}

/* ===== actions ===== */
$("btnBack").onclick = ()=> location.href = `menu.html?v=${Date.now()}`;
$("btnKitchen").onclick = ()=> location.href = `kitchen.html?v=${Date.now()}`;
$("btnRefresh").onclick = refresh;
$("autoSec").onchange = setAuto;

$("btnSound").onclick = async ()=>{
  soundEnabled = !soundEnabled;
  $("btnSound").textContent = soundEnabled ? "🔔音ON" : "🔔音OFF";
  if(soundEnabled){
    try{
      ensureAudio();
      if(audioCtx && audioCtx.state === "suspended"){
        await audioCtx.resume();
      }
    }catch{}
  }
};
$("btnBeep").onclick = ()=>{
  soundEnabled = true;
  $("btnSound").textContent = "🔔音ON";
  beep3sec();
};

/* ★印刷モードをセットしてから print */
function setPrintMode(mode){
  document.body.dataset.print = mode; // "bill" or "sales"
}
function clearPrintMode(){
  delete document.body.dataset.print;
}
window.addEventListener("afterprint", ()=> clearPrintMode());

$("btnPdf").onclick = ()=>{
  setPrintMode("bill");
  // Safariに状態を認識させる
  void document.body.offsetHeight;
  setTimeout(()=>window.print(), 50);
};

/* ===== 日別売上 ===== */
$("btnSalesRefresh").onclick = async ()=>{
  const dk = $("salesDate").value || jstDateKey();
  await loadSalesDay(dk);
};

$("btnSalesPdf").onclick = ()=>{
  const dk = $("salesDate").value || jstDateKey();
  showSalesPrint(dk);

  setPrintMode("sales");
  void document.body.offsetHeight;
  setTimeout(()=>window.print(), 50);
};

$("btnSalesDelete").onclick = async ()=>{
  const shop = getShop();
  const dk = $("salesDate").value || jstDateKey();
  if(!shop) return;

  if(!confirm(`${dk} の売上履歴をすべて削除します。\n（元に戻せません）`)) return;

  try{
    setSalesStatus(`<span class="mono">削除中...</span>`);
    await rtdbDelete(`shops/${encodeURIComponent(shop)}/salesDaily/${encodeURIComponent(dk)}`);
    salesDayData = {};
    renderSalesDay(dk);
    setSalesStatus(`<span class="ok">削除しました</span>`);
  }catch(e){
    setSalesStatus(`<span class="ng">削除失敗</span> ${esc(e.message||e)}`);
  }
};

/* boot */
(function boot(){
  $("salesDate").value = jstDateKey();
  setAuto();
  refresh();
  loadSalesDay(jstDateKey());
})();
</script>
