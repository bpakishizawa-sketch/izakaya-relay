<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>メニュー編集</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:16px; max-width:820px; margin:0 auto;}
    h2{margin:0 0 10px}
    .card{border:1px solid #e5e5e5;border-radius:12px;padding:12px;margin:12px 0;background:#fff;}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{cursor:pointer;border:0;border-radius:10px;padding:12px 14px;font-weight:900;font-size:16px}
    .btnDark{background:#111827;color:#fff}
    .btnLight{background:#e5e7eb;color:#111}
    .btnBlue{background:#2563eb;color:#fff}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;}
    .ok{color:#0a7a2a;font-weight:900}
    .ng{color:#b00020;font-weight:900}
    .muted{color:#777}
    label{display:block;font-size:12px;color:#666;margin-bottom:6px}
    input{font-size:16px;padding:12px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box;width:100%}
    .grid2{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:760px){ .grid2{grid-template-columns:1fr 1fr;} }
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #ddd;font-weight:900;font-size:12px}
    .pillDrink{background:#dbeafe;border-color:#3b82f6}
    .pillFood{background:#dcfce7;border-color:#16a34a}
    .mini{font-size:12px;color:#6b7280;line-height:1.6}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}
    @media print{
      .noPrint{display:none !important;}
      body{padding:0;max-width:none}
      .card{border:0;margin:0}
    }
  </style>
</head>
<body>
  <h2>メニュー編集（店側）</h2>

  <div class="card noPrint">
    <div class="row">
      <div>shop: <b id="shopText" class="mono">-</b></div>
      <button id="btnBack" class="btn btnLight" type="button">← menuへ</button>
      <button id="btnReload" class="btn btnDark" type="button">再読み込み</button>
      <button id="btnPrint" class="btn btnLight" type="button">番号順で印刷</button>
    </div>
    <div id="status" class="mini muted">-</div>
  </div>

  <div class="card noPrint">
    <div class="grid2">
      <!-- DRINK -->
      <div>
        <div class="row" style="align-items:flex-end">
          <span class="pill pillDrink">ドリンク追加</span>
          <div style="flex:1">
            <label>ID（例：d1）</label>
            <input id="dId" class="mono" placeholder="d1" />
          </div>
        </div>
        <div style="margin-top:10px">
          <label>メニュー名</label>
          <input id="dName" placeholder="例：レモンサワー" />
        </div>
        <div class="row" style="margin-top:10px">
          <div style="flex:1">
            <label>価格</label>
            <input id="dPrice" type="number" min="0" step="1" placeholder="例：550" />
          </div>
          <button id="btnAddDrink" class="btn btnBlue" type="button" style="align-self:flex-end">追加</button>
        </div>
      </div>

      <!-- FOOD -->
      <div>
        <div class="row" style="align-items:flex-end">
          <span class="pill pillFood">フード追加</span>
          <div style="flex:1">
            <label>ID（例：f101）</label>
            <input id="fId" class="mono" placeholder="f101" />
          </div>
        </div>
        <div style="margin-top:10px">
          <label>メニュー名</label>
          <input id="fName" placeholder="例：唐揚げ" />
        </div>
        <div class="row" style="margin-top:10px">
          <div style="flex:1">
            <label>価格</label>
            <input id="fPrice" type="number" min="0" step="1" placeholder="例：680" />
          </div>
          <button id="btnAddFood" class="btn btnBlue" type="button" style="align-self:flex-end">追加</button>
        </div>
      </div>
    </div>
    <div class="mini muted" style="margin-top:10px">
      既存IDに上書きすると更新になります。
    </div>
  </div>

  <div class="card">
    <div class="row">
      <b>一覧</b>
      <span class="muted mini" id="countLine" style="margin-left:auto">-</span>
    </div>
    <div id="listArea"></div>
  </div>

  <div class="card noPrint">
    <div class="mini">デバッグ</div>
    <pre id="debug" class="mono">-</pre>
  </div>

<script>
/** ===== 設定 ===== */
const DB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
/** ============== */

const $ = (id)=>document.getElementById(id);
function now(){ return Date.now(); }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
function getShop(){ return (localStorage.getItem("shopCode") || "").trim(); }

async function rtdbGet(path){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url);
  const txt = await res.text();
  if(!res.ok) throw new Error(`GET ${res.status} ${url} ${txt}`);
  return JSON.parse(txt || "null");
}
async function rtdbPatch(path, obj){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method:"PATCH",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(obj)
  });
  const txt = await res.text();
  if(!res.ok) throw new Error(`PATCH ${res.status} ${url} ${txt}`);
  return JSON.parse(txt || "null");
}
async function rtdbPut(path, data){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(data)
  });
  const txt = await res.text();
  if(!res.ok) throw new Error(`PUT ${res.status} ${url} ${txt}`);
  return JSON.parse(txt || "null");
}

function idNumber(id){
  const m = String(id||"").match(/\d+/);
  return m ? Number(m[0]) : 999999;
}
function sortIds(a,b){
  const na = idNumber(a), nb = idNumber(b);
  if(na !== nb) return na - nb;
  return String(a).localeCompare(String(b), "ja");
}

function normalizeValue(v){
  // {name,price} でも "xxx" でも吸収
  if(v && typeof v === "object"){
    return { name: String(v.name ?? ""), price: Number(v.price ?? 0), raw:v };
  }
  return { name: String(v ?? ""), price: 0, raw:v };
}

function setStatus(html){ $("status").innerHTML = html; }

async function loadMenus(){
  const shop = getShop();
  $("shopText").textContent = shop || "-";

  if(!shop){
    setStatus(`<span class="ng">未ログイン</span>（shopCode がありません）`);
    $("debug").textContent = JSON.stringify({ shopCode: shop, hint:"login.html で localStorage.shopCode が保存されているか確認" }, null, 2);
    return;
  }

  setStatus("loading...");
  const drinkPath = `shops/${encodeURIComponent(shop)}/menu/drink`;
  const foodPath  = `shops/${encodeURIComponent(shop)}/menu/food`;

  const [drink, food] = await Promise.all([
    rtdbGet(drinkPath),
    rtdbGet(foodPath)
  ]);

  const dObj = (drink && typeof drink === "object") ? drink : {};
  const fObj = (food  && typeof food  === "object") ? food  : {};

  const dIds = Object.keys(dObj).sort(sortIds);
  const fIds = Object.keys(fObj).sort(sortIds);

  let html = "";

  html += `<div class="row" style="margin:0 0 8px 0"><span class="pill pillDrink">ドリンク</span><span class="mini muted">(${dIds.length})</span></div>`;
  html += `<div class="mini" style="margin-bottom:10px">`;
  html += dIds.length ? "" : `<span class="muted">（空）</span>`;
  html += `</div>`;
  html += `<pre class="mono" style="display:none" id="rawDrink"></pre>`;

  html += `<table style="margin-bottom:16px">
    <thead><tr><th style="width:120px">ID</th><th>名前</th><th style="width:120px">価格</th></tr></thead><tbody>`;
  for(const id of dIds){
    const nv = normalizeValue(dObj[id]);
    html += `<tr><td class="mono">${esc(id)}</td><td>${esc(nv.name)}</td><td class="mono">${esc(nv.price)}</td></tr>`;
  }
  html += `</tbody></table>`;

  html += `<div class="row" style="margin:0 0 8px 0"><span class="pill pillFood">フード</span><span class="mini muted">(${fIds.length})</span></div>`;
  html += `<table>
    <thead><tr><th style="width:120px">ID</th><th>名前</th><th style="width:120px">価格</th></tr></thead><tbody>`;
  for(const id of fIds){
    const nv = normalizeValue(fObj[id]);
    html += `<tr><td class="mono">${esc(id)}</td><td>${esc(nv.name)}</td><td class="mono">${esc(nv.price)}</td></tr>`;
  }
  html += `</tbody></table>`;

  $("listArea").innerHTML = html;
  $("countLine").textContent = `drink:${dIds.length} / food:${fIds.length}`;

  $("debug").textContent = JSON.stringify({
    shop,
    paths:{ drink:`/${drinkPath}`, food:`/${foodPath}` },
    counts:{ drink:dIds.length, food:fIds.length },
    sampleDrink: dIds[0] ? { id:dIds[0], value:dObj[dIds[0]] } : null
  }, null, 2);

  setStatus(`<span class="ok">OK</span> 読み込み完了（${new Date().toLocaleTimeString("ja-JP")}）`);
}

async function upsert(cat, id, name, price){
  const shop = getShop();
  if(!shop) throw new Error("shopCode がありません（未ログイン）");
  if(!cat || !id) throw new Error("カテゴリとIDは必須です");
  const p = `shops/${encodeURIComponent(shop)}/menu/${encodeURIComponent(cat)}/${encodeURIComponent(id)}`;
  await rtdbPut(p, { name:String(name||""), price:Number(price||0) });
}

$("btnAddDrink").onclick = async ()=>{
  try{
    setStatus("saving...");
    await upsert("drink", $("dId").value.trim(), $("dName").value.trim(), $("dPrice").value);
    setStatus(`<span class="ok">OK</span> ドリンク保存`);
    await loadMenus();
  }catch(e){
    setStatus(`<span class="ng">NG</span> ${esc(e.message||e)}`);
  }
};
$("btnAddFood").onclick = async ()=>{
  try{
    setStatus("saving...");
    await upsert("food", $("fId").value.trim(), $("fName").value.trim(), $("fPrice").value);
    setStatus(`<span class="ok">OK</span> フード保存`);
    await loadMenus();
  }catch(e){
    setStatus(`<span class="ng">NG</span> ${esc(e.message||e)}`);
  }
};

$("btnReload").onclick = loadMenus;
$("btnPrint").onclick = ()=> window.print();
$("btnBack").onclick = ()=> location.href = `menu.html?v=${Date.now()}`;
$("backMenuBtn")?.addEventListener?.("click", ()=>{});
$("backLoginBtn")?.addEventListener?.("click", ()=>{});

$("btnBack").onclick = ()=> location.href = `menu.html?v=${Date.now()}`;
$("backMenuBtn") && ($("backMenuBtn").onclick = ()=> location.href = `menu.html?v=${Date.now()}`);
$("backLoginBtn") && ($("backLoginBtn").onclick = ()=> location.href = `login.html?v=${Date.now()}`);

loadMenus();
</script>
</body>
</html>
