<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>params_v2</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 16px; }
    .err { color: #d00; font-weight: 700; }
    pre { background:#f6f6f6; padding:12px; border-radius:8px; overflow:auto; }
  </style>
</head>
<body>
  <h3>params_v2 debug</h3>
  <div id="msg"></div>
  <pre id="out"></pre>

  <script>
    function pickFromUrl(urlStr) {
      const u = new URL(urlStr);
      return {
        shop: u.searchParams.get("shop") || "",
        table: u.searchParams.get("table") || ""
      };
    }

    // 1) まずは自分のURLから（単体で開いた時用）
    let shop = "";
    let table = "";
    try {
      const selfPicked = pickFromUrl(window.location.href);
      shop = selfPicked.shop;
      table = selfPicked.table;
    } catch (e) {}

    // 2) 無ければ referrer（WebViewer内で開いた時の本命）
    const ref = document.referrer || "";
    if ((!shop || !table) && ref) {
      try {
        const refPicked = pickFromUrl(ref);
        shop = refPicked.shop;
        table = refPicked.table;
      } catch (e) {}
    }

    const payload = {
      type: "params",
      shop,
      table,
      href: window.location.href,
      referrer: ref
    };

    // 画面にも出す
    const ok = (shop && table);
    document.getElementById("msg").innerHTML = ok
      ? "OK: shop/table 取得できた"
      : '<span class="err">missing params: shop / table</span><br>例) https://thunkable.site/... ?shop=daboya&table=1';

    document.getElementById("out").textContent = JSON.stringify(payload, null, 2);

    // Thunkableへ送る
    try {
      if (window.ThunkableWebBridge && window.ThunkableWebBridge.postMessage) {
        window.ThunkableWebBridge.postMessage(JSON.stringify(payload));
      }
    } catch (e) {}
  </script>
</body>
</html>
