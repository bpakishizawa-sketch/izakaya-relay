<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>店側ログイン</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px;max-width:720px;margin:0 auto}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0;background:#fff}
    .row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
    input,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #ccc}
    button{cursor:pointer;border:0;font-weight:900}
    .btn{background:#111827;color:#fff}
    .btn2{background:#e5e7eb;color:#111;border:1px solid #ddd}
    .danger{background:#ef4444;color:#fff}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .muted{color:#6b7280;font-size:12px;line-height:1.6}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    a{display:inline-block;padding:12px 14px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <h2>店側ログイン</h2>

  <div class="card" id="loggedCard" style="display:none;">
    <div class="ok">ログイン済み</div>
    <div class="row">
      <div>shop: <b class="mono" id="lsShop">-</b></div>
      <div>PIN: <b class="mono" id="lsPin">****</b></div>
    </div>
    <div class="row" style="margin-top:12px;">
      <button id="goMenu" class="btn">メニューへ</button>
      <button id="logout" class="danger">ログアウト</button>
    </div>
    <div class="muted">
      ※ login.html は自動で移動しません（戻される現象防止）。<br>
      「メニューへ」を押して移動してください。
    </div>
  </div>

  <div class="card" id="formCard">
    <div class="row">
      <input id="shop" placeholder="shopコード（例：daboya）" style="flex:1;min-width:240px">
      <input id="pin"  placeholder="PIN（例：1111）" style="width:180px">
      <button id="btnLogin" class="btn">ログイン</button>
    </div>
    <div id="msg" class="muted">厨房／会計で端末を分けてもOK（各端末でログイン）。</div>
    <div class="muted">
      PINは数字だけでも英数字でもOK（ここでは制限しません）。
    </div>
  </div>

<script>
  // localStorage 統一キー
  const KEY_SHOP = "shopCode";
  const KEY_PIN  = "shopPin";

  const $ = (id)=>document.getElementById(id);

  function readLogin(){
    return {
      shop: (localStorage.getItem(KEY_SHOP) || "").trim(),
      pin:  (localStorage.getItem(KEY_PIN)  || "").trim()
    };
  }
  function maskPin(pin){
    if(!pin) return "----";
    return "*".repeat(Math.min(pin.length, 8));
  }

  function render(){
    const {shop, pin} = readLogin();
    if(shop && pin){
      $("formCard").style.display = "none";
      $("loggedCard").style.display = "block";
      $("lsShop").textContent = shop;
      $("lsPin").textContent = maskPin(pin);
    }else{
      $("loggedCard").style.display = "none";
      $("formCard").style.display = "block";
    }
  }

  $("btnLogin").onclick = ()=>{
    const shop = $("shop").value.trim();
    const pin  = $("pin").value.trim();

    if(!shop || !pin){
      $("msg").innerHTML = `<span class="ng">shop と PIN を入力してください</span>`;
      return;
    }

    // 保存（※ここで初めてログイン状態になる）
    localStorage.setItem(KEY_SHOP, shop);
    localStorage.setItem(KEY_PIN,  pin);

    $("msg").innerHTML = `<span class="ok">ログイン情報を保存しました</span>`;
    render();
  };

  $("logout").onclick = ()=>{
    localStorage.removeItem(KEY_SHOP);
    localStorage.removeItem(KEY_PIN);
    render();
  };

  $("goMenu").onclick = ()=>{
    // 店側メニューへ（あなたの店側トップが menu.html ならこれ）
    location.href = `menu.html?v=${Date.now()}`;
  };

  render();
</script>
</body>
</html>
