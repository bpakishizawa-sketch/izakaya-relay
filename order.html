<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注文</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:16px;}
    input,button,select{font-size:16px;padding:10px;}
    button{cursor:pointer}
    .row{display:flex;gap:8px;align-items:center;margin:10px 0}
    .ok{color:#0a7a2a;font-weight:700}
    .ng{color:#b00020;font-weight:700}
    pre{background:#f5f5f5;padding:12px;border-radius:8px;overflow:auto}
    .meta{margin:10px 0; line-height:1.7}
    .small{font-size:12px;color:#444}
  </style>
</head>
<body>
  <h2>注文</h2>

  <div class="meta" id="meta"></div>

  <div class="row">
    <select id="cat" style="width:140px">
      <option value="food">food</option>
      <option value="drink">drink</option>
    </select>

    <select id="menu" style="flex:1">
      <option value="">メニュー読込中...</option>
    </select>

    <input id="qty" type="number" min="1" value="1" style="width:90px">
    <button id="add">追加</button>
  </div>

  <div class="small" id="menuStatus"></div>

  <pre id="list">[]</pre>

  <div class="row">
    <button id="send" style="flex:1">注文送信</button>
  </div>

  <div id="status"></div>

<script>
/**
 * あなたのDB
 * menu: /shops/{shop}/menu/{cat}/{id}  (id例: f103)
 * order保存先: /shops/{shop}/orders/{table}/{pushId}
 */
const DB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";

function qs(name){
  const u = new URL(location.href);
  return (u.searchParams.get(name) || "").trim();
}

async function getJson(path){
  const url = `${DB_BASE}${path}.json`;
  const res = await fetch(url);
  const text = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${text}`);
  return text ? JSON.parse(text) : null;
}

async function postJson(path, obj){
  const url = `${DB_BASE}${path}.json`;
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(obj)
  });
  const text = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${text}`);
  return JSON.parse(text);
}

const shop  = qs("shop");
const table = qs("table");
const token = qs("token");

const meta = document.getElementById("meta");
meta.innerHTML = `
  <div>shop: <b>${shop||"(none)"}</b></div>
  <div>table: <b>${table||"(none)"}</b></div>
  <div>token: <b style="font-size:12px">${token||"(none)"}</b></div>
`;

if(!shop || !table || !token){
  document.getElementById("status").innerHTML =
    `<span class="ng">URL params が不足です（shop/table/token）</span>`;
}

const catSel  = document.getElementById("cat");
const menuSel = document.getElementById("menu");
const qtyEl   = document.getElementById("qty");
const menuStatus = document.getElementById("menuStatus");

let menuCache = { food: [], drink: [] }; // [{id,cat,name,price}]
let items = []; // 注文リスト
const listEl = document.getElementById("list");

function render(){
  listEl.textContent = JSON.stringify(items, null, 2);
}

function normalizeMenuObj(cat, obj){
  // obj は { f103: {id,cat,name,price}, ... } の想定
  if(!obj) return [];
  const out = [];
  for(const key of Object.keys(obj)){
    const v = obj[key] || {};
    out.push({
      id: v.id || key,
      cat: v.cat || cat,
      name: v.name || String(key),
      price: String(v.price ?? "")
    });
  }
  // 表示が安定するように name でソート
  out.sort((a,b)=> (a.name||"").localeCompare(b.name||"", "ja"));
  return out;
}

function fillMenuDropdown(cat){
  const arr = menuCache[cat] || [];
  menuSel.innerHTML = "";
  if(arr.length === 0){
    const op = document.createElement("option");
    op.value = "";
    op.textContent = "メニューなし（または読込失敗）";
    menuSel.appendChild(op);
    return;
  }
  const first = document.createElement("option");
  first.value = "";
  first.textContent = "選択してください";
  menuSel.appendChild(first);

  for(const m of arr){
    const op = document.createElement("option");
    op.value = m.id;
    op.textContent = `${m.name} (${m.price})`;
    op.dataset.name = m.name;
    op.dataset.price = m.price;
    op.dataset.cat = m.cat;
    menuSel.appendChild(op);
  }
}

async function loadMenuAll(){
  if(!shop) return;
  menuStatus.textContent = "メニュー読込中...";
  try{
    const [foodObj, drinkObj] = await Promise.all([
      getJson(`/shops/${encodeURIComponent(shop)}/menu/food`),
      getJson(`/shops/${encodeURIComponent(shop)}/menu/drink`)
    ]);
    menuCache.food  = normalizeMenuObj("food",  foodObj);
    menuCache.drink = normalizeMenuObj("drink", drinkObj);
    menuStatus.innerHTML = `<span class="ok">メニュー読込OK</span> food:${menuCache.food.length} / drink:${menuCache.drink.length}`;
    fillMenuDropdown(catSel.value);
  }catch(e){
    menuStatus.innerHTML = `<span class="ng">メニュー読込失敗</span> <span class="small">${String(e.message||e)}</span>`;
    menuCache.food = [];
    menuCache.drink = [];
    fillMenuDropdown(catSel.value);
  }
}

catSel.addEventListener("change", ()=>{
  fillMenuDropdown(catSel.value);
});

document.getElementById("add").onclick = () => {
  const cat = catSel.value;
  const selectedId = menuSel.value;
  const qty = Number(qtyEl.value || 1);

  if(!selectedId){
    document.getElementById("status").innerHTML = `<span class="ng">メニューを選んでください</span>`;
    return;
  }
  const arr = menuCache[cat] || [];
  const m = arr.find(x => x.id === selectedId);
  if(!m){
    document.getElementById("status").innerHTML = `<span class="ng">メニュー取得エラー（選択が見つからない）</span>`;
    return;
  }

  items.push({
    id: m.id,
    cat: m.cat,
    name: m.name,
    price: m.price,
    qty: qty
  });
  qtyEl.value = 1;
  render();
  document.getElementById("status").textContent = "";
};

document.getElementById("send").onclick = async () => {
  try{
    if(!shop || !table || !token) return;

    if(items.length === 0){
      document.getElementById("status").innerHTML = `<span class="ng">注文が空です</span>`;
      return;
    }

    const ts = Date.now();
    const orderObj = {
      shop,
      table: String(table),
      token,
      items,
      createdAt: ts,
      ua: navigator.userAgent
    };

    document.getElementById("status").textContent = "sending...";

    // ✅ 保存先は shops 配下に固定
    await postJson(`/shops/${encodeURIComponent(shop)}/orders/${encodeURIComponent(String(table))}`, orderObj);

    document.getElementById("status").innerHTML = `<span class="ok">送信OK（shops/${shop}/orders/${table}）</span>`;
    items = [];
    render();

  }catch(e){
    document.getElementById("status").innerHTML =
      `<span class="ng">送信失敗</span><div class="small">${String(e.message||e)}</div>`;
  }
};

// 起動時にメニューを読みに行く
loadMenuAll();
render();
</script>
</body>
</html>
