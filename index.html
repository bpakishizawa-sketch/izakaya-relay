<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>readhash</title>
</head>
<body style="margin:0;font-family:sans-serif;">
  <div id="msg" style="padding:16px;white-space:pre-wrap;">loading…</div>

<script>
const out = (t) => document.getElementById("msg").textContent = t;

function send() {
  // 親(Thunkableページ)のURLは referrer で取れることが多い
  const ref = document.referrer || "";
  let topUrl = "";
  try { topUrl = window.top.location.href || ""; } catch(e) {}

  const payload = (ref.includes("#token=") ? ref : (topUrl.includes("#token=") ? topUrl : ref || topUrl || "NO_URL"));
  out(payload);

  try {
    ThunkableWebviewerExtension.postMessage(payload);
  } catch(e) {
    // ここで落ちるなら WebViewer message が使えてない
    out("ERR:" + e.message + "\n\n" + payload);
  }
}

// 1回だけだと間に合わない事があるので数回送る
setTimeout(send, 200);
setTimeout(send, 600);
setTimeout(send, 1200);
</script>
</body>
</html>
