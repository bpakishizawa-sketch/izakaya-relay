<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PARAMS PAGE</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; padding: 20px; }
    pre { background:#f4f4f4; padding:12px; border-radius:10px; overflow:auto; }
    h1 { margin: 0 0 10px; }
    .muted { color:#666; }
  </style>
</head>
<body>
  <h1>PARAMS PAGE</h1>
  <p class="muted">shop/table を受け取って Thunkable に渡します。</p>
  <pre id="out">loading...</pre>

  <script>
    // ★あなたのThunkable Web App URL（固定）
    const THUNKABLE_BASE = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH";

    const qs = new URLSearchParams(location.search);
    const shop = qs.get("shop") || "";
    const table = qs.get("table") || "";
    const debug = qs.get("debug") === "1";

    const payload = {
      type: "PARAMS",
      shop,
      table,
      raw: location.search,
      at: Date.now()
    };

    // 次に飛ぶURL（キャッシュ避けで v を付ける）
    const next = `${THUNKABLE_BASE}?shop=${encodeURIComponent(shop)}&table=${encodeURIComponent(table)}&v=${Date.now()}`;

    // 表示
    document.getElementById("out").textContent =
      (debug ? "DEBUG MODE (no redirect)\nnext:\n" + next + "\n\n" : "") +
      JSON.stringify(payload, null, 2);

    // 本番はリダイレクト
    if (!debug) {
      location.replace(next);
    }
  </script>
</body>
</html>
