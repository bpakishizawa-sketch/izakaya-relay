<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メニュー編集</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:16px; max-width:1100px; margin:0 auto;}
    h2{margin:0 0 10px;}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0;background:#fff;}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .muted{color:#6b7280}
    input,select,button{font-size:16px;padding:10px;border-radius:10px}
    input,select{border:1px solid #cbd5e1}
    button{border:0;cursor:pointer;font-weight:900}
    .dark{background:#111827;color:#fff}
    .light{background:#f3f4f6;color:#111827;border:1px solid #ddd}
    .danger{background:#ef4444;color:#fff}
    .grid{display:grid;grid-template-columns:1fr; gap:12px; align-items:start}
    @media(min-width:900px){ .grid{grid-template-columns: 1fr 1fr;} }
    .list{display:flex;flex-direction:column;gap:8px}
    .item{border:1px solid #e5e7eb;border-radius:10px;padding:10px;cursor:pointer}
    .item:hover{background:#f8fafc}
    .itemActive{border-color:#2563eb;background:#eff6ff}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid #ddd;font-weight:900;font-size:12px}
    .pillDrink{background:#dbeafe;border-color:#3b82f6}
    .pillFood{background:#dcfce7;border-color:#16a34a}
    .small{font-size:12px;color:#6b7280}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}

    /* 印刷 */
    @media print{
      .noPrint{display:none !important;}
      body{padding:0; max-width:none}
      .card{border:0; margin:0; padding:0}
      .item{page-break-inside:avoid}
    }
    body[data-print="drink"] .printFood{display:none !important;}
    body[data-print="food"]  .printDrink{display:none !important;}
  </style>
</head>
<body>
  <h2>メニュー編集</h2>

  <div class="card noPrint">
    <div class="row">
      <div>shop: <b id="shopText" class="mono">-</b></div>
      <div class="muted small" id="pinText">-</div>
      <span style="margin-left:auto" class="muted small" id="lastLine">-</span>
    </div>

    <div class="row" style="margin-top:10px;">
      <button id="btnBack" class="light">← メニューへ</button>
      <button id="btnReload" class="dark">再読み込み</button>
      <button id="btnFixKeys" class="light">キー修復</button>
      <button id="btnPrintDrink" class="light">ドリンク印刷</button>
      <button id="btnPrintFood" class="light">フード印刷</button>
      <button id="btnPrintAll" class="light">全部印刷</button>
    </div>

    <div id="status" style="margin-top:10px;" class="muted">-</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="row noPrint">
        <b>選択</b>
        <select id="pickCat" style="width:160px">
          <option value="drink">ドリンク</option>
          <option value="food">フード</option>
        </select>
        <select id="pickId" style="flex:1; min-width:220px">
          <option value="">（未選択）</option>
        </select>
      </div>

      <div class="row noPrint" style="margin-top:10px;">
        <div style="flex:1; min-width:220px;">
          <div class="small">番号（例：d1 / f12）</div>
          <input id="editId" placeholder="例：d1 または f12" style="width:100%" />
        </div>
        <div style="flex:2; min-width:260px;">
          <div class="small">メニュー名</div>
          <input id="editName" placeholder="メニュー名" style="width:100%" />
        </div>
        <div style="width:160px;">
          <div class="small">価格</div>
          <input id="editPrice" type="number" min="0" step="1" value="0" style="width:100%" />
        </div>
      </div>

      <div class="row noPrint" style="margin-top:10px;">
        <button id="btnSave" class="dark" style="flex:1; min-width:200px;">保存</button>
        <button id="btnDelete" class="danger" style="flex:1; min-width:200px;">削除</button>
        <button id="btnClear" class="light" style="flex:1; min-width:200px;">クリア</button>
      </div>

      <div class="card">
        <div class="muted small">デバッグ</div>
        <pre id="dbg" class="mono">-</pre>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <b class="printDrink">ドリンク一覧</b>
        <b class="printFood">フード一覧</b>
        <span class="mono muted" id="countLine" style="margin-left:auto">-</span>
      </div>

      <div class="grid" style="grid-template-columns:1fr 1fr; gap:12px; margin-top:10px;">
        <div class="printDrink">
          <div class="row"><span class="pill pillDrink">ドリンク</span> <span class="mono" id="drinkCount">0</span></div>
          <div class="list" id="drinkList"></div>
        </div>

        <div class="printFood">
          <div class="row"><span class="pill pillFood">フード</span> <span class="mono" id="foodCount">0</span></div>
          <div class="list" id="foodList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./shop_common.js?v=20260117"></script>
  <script>
    const $ = (id)=>document.getElementById(id);

    function setStatus(html){ $("status").innerHTML = html || ""; }
    function setDbg(obj){ $("dbg").textContent = typeof obj==="string" ? obj : JSON.stringify(obj, null, 2); }
    function maskPin(pin){ if(!pin) return "-"; return "*".repeat(Math.min(String(pin).length, 8)); }

    // 互換：昔の localStorage.shop / localStorage.pin が残っていたら shopCode/shopPin へ移す
    function fixKeysIfNeeded(){
      const shopCode = (localStorage.getItem("shopCode") || "").trim();
      const shop     = (localStorage.getItem("shop") || "").trim();
      if(!shopCode && shop) localStorage.setItem("shopCode", shop);

      const shopPin = (localStorage.getItem("shopPin") || "").trim();
      const pin     = (localStorage.getItem("pin") || "").trim();
      if(!shopPin && pin) localStorage.setItem("shopPin", pin);
    }

    function requireShop(){
      fixKeysIfNeeded();
      if(typeof requireLogin === "function"){
        if(!requireLogin()) return null;
      }else{
        // 保険（shop_common.js が壊れている場合）
        const s = (localStorage.getItem("shopCode")||"").trim();
        const p = (localStorage.getItem("shopPin")||"").trim();
        if(!s || !p){
          location.href = "login.html?v=" + Date.now();
          return null;
        }
      }
      const shop = (localStorage.getItem("shopCode")||"").trim();
      const pin  = (localStorage.getItem("shopPin")||"").trim();
      return { shop, pin };
    }

    function idNumber(id){
      const m = String(id||"").match(/\d+/);
      return m ? Number(m[0]) : 999999;
    }

    function sortId(a,b){
      const na = idNumber(a.id), nb = idNumber(b.id);
      if(na !== nb) return na - nb;
      return String(a.id||"").localeCompare(String(b.id||""), "ja");
    }

    let auth = null;
    let menu = { drink: {}, food: {} }; // raw objects
    let activeKey = ""; // "drink:d1" など

    function normalizeValue(v){
      if(v && typeof v === "object"){
        return { name: String(v.name ?? ""), price: Number(v.price ?? 0) };
      }
      // 旧形式（文字列など）
      return { name: String(v ?? ""), price: 0 };
    }

    function setActive(cat, id){
      activeKey = `${cat}:${id}`;
      $("pickCat").value = cat;
      $("editId").value = id;
      const val = normalizeValue((menu[cat]||{})[id]);
      $("editName").value = val.name || "";
      $("editPrice").value = String(Number(val.price||0));

      // プルダウン同期
      $("pickId").value = id;

      // 一覧ハイライト
      document.querySelectorAll(".item").forEach(el=>{
        el.classList.remove("itemActive");
      });
      const target = document.querySelector(`.item[data-key="${cat}:${id}"]`);
      if(target) target.classList.add("itemActive");
    }

    function clearEditor(){
      activeKey = "";
      $("editId").value = "";
      $("editName").value = "";
      $("editPrice").value = "0";
      $("pickId").value = "";
      document.querySelectorAll(".item").forEach(el=> el.classList.remove("itemActive"));
    }

    function rebuildPick(){
      const cat = $("pickCat").value;
      const sel = $("pickId");
      sel.innerHTML = `<option value="">（未選択）</option>`;

      const obj = menu[cat] || {};
      const arr = Object.keys(obj).map(id=>({id, ...normalizeValue(obj[id])}));
      arr.sort(sortId);

      for(const x of arr){
        const opt = document.createElement("option");
        opt.value = x.id;
        opt.textContent = `${x.id} / ${x.name} (${x.price})`;
        sel.appendChild(opt);
      }
    }

    function rebuildLists(){
      const dRoot = $("drinkList");
      const fRoot = $("foodList");
      dRoot.innerHTML = "";
      fRoot.innerHTML = "";

      const drinkArr = Object.keys(menu.drink||{}).map(id=>({id, ...normalizeValue(menu.drink[id])})).sort(sortId);
      const foodArr  = Object.keys(menu.food||{}).map(id=>({id, ...normalizeValue(menu.food[id])})).sort(sortId);

      $("drinkCount").textContent = String(drinkArr.length);
      $("foodCount").textContent  = String(foodArr.length);
      $("countLine").textContent  = `合計 ${drinkArr.length + foodArr.length} 件`;

      for(const x of drinkArr){
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.key = `drink:${x.id}`;
        div.innerHTML = `
          <div class="row" style="margin:0;">
            <span class="pill pillDrink">D</span>
            <b class="mono">${esc(x.id)}</b>
            <span class="mono" style="margin-left:auto">${esc(String(x.price))}</span>
          </div>
          <div style="margin-top:6px; font-weight:900;">${esc(x.name||"")}</div>
        `;
        div.onclick = ()=> setActive("drink", x.id);
        dRoot.appendChild(div);
      }

      for(const x of foodArr){
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.key = `food:${x.id}`;
        div.innerHTML = `
          <div class="row" style="margin:0;">
            <span class="pill pillFood">F</span>
            <b class="mono">${esc(x.id)}</b>
            <span class="mono" style="margin-left:auto">${esc(String(x.price))}</span>
          </div>
          <div style="margin-top:6px; font-weight:900;">${esc(x.name||"")}</div>
        `;
        div.onclick = ()=> setActive("food", x.id);
        fRoot.appendChild(div);
      }

      // 選択状態の復元
      if(activeKey){
        const [cat,id] = activeKey.split(":");
        const target = document.querySelector(`.item[data-key="${cat}:${id}"]`);
        if(target) target.classList.add("itemActive");
      }
    }

    async function loadMenu(){
      try{
        auth = requireShop();
        if(!auth) return;

        $("shopText").textContent = auth.shop;
        $("pinText").textContent  = "PIN: " + maskPin(auth.pin);

        setStatus("loading...");
        $("lastLine").textContent = "-";

        // RTDB 読み込み
        const base = `shops/${encodeURIComponent(auth.shop)}/menu`;
        const r1 = await rtdbGet(`${base}/drink`);
        const r2 = await rtdbGet(`${base}/food`);

        if(!r1.ok || !r2.ok){
          setStatus(`<span class="ng">読込失敗</span> drink:${r1.status} / food:${r2.status}`);
          setDbg({ drink: r1, food: r2 });
          return;
        }

        menu.drink = (r1.json && typeof r1.json==="object") ? r1.json : {};
        menu.food  = (r2.json && typeof r2.json==="object") ? r2.json : {};

        rebuildLists();
        rebuildPick();

        $("lastLine").textContent = "更新: " + new Date().toLocaleTimeString("ja-JP");
        setStatus(`<span class="ok">OK</span>`);
        setDbg({
          shop: auth.shop,
          drinkKeys: Object.keys(menu.drink||{}).length,
          foodKeys: Object.keys(menu.food||{}).length
        });
      }catch(e){
        setStatus(`<span class="ng">エラー</span> ${esc(String(e.message||e))}`);
        setDbg(String(e.stack || e));
      }
    }

    async function saveItem(){
      try{
        auth = requireShop();
        if(!auth) return;

        const cat = $("pickCat").value;
        const id  = ($("editId").value || "").trim();
        const name= ($("editName").value || "").trim();
        const price = Number($("editPrice").value || 0);

        if(!cat || !id){
          setStatus(`<span class="ng">カテゴリと番号が必要</span>`);
          return;
        }
        if(!name){
          setStatus(`<span class="ng">メニュー名が必要</span>`);
          return;
        }

        setStatus("saving...");

        const path = `shops/${encodeURIComponent(auth.shop)}/menu/${encodeURIComponent(cat)}/${encodeURIComponent(id)}`;
        const payload = { name, price: Number.isFinite(price) ? price : 0 };

        const r = await rtdbPut(path, payload);
        if(!r.ok){
          setStatus(`<span class="ng">保存失敗</span> HTTP ${r.status}`);
          setDbg(r);
          return;
        }

        // ローカル反映
        menu[cat] = menu[cat] || {};
        menu[cat][id] = payload;

        rebuildLists();
        rebuildPick();
        setActive(cat, id);

        setStatus(`<span class="ok">保存OK</span>`);
        $("lastLine").textContent = "更新: " + new Date().toLocaleTimeString("ja-JP");
      }catch(e){
        setStatus(`<span class="ng">保存エラー</span> ${esc(String(e.message||e))}`);
        setDbg(String(e.stack || e));
      }
    }

    async function deleteItem(){
      try{
        auth = requireShop();
        if(!auth) return;

        const cat = $("pickCat").value;
        const id  = ($("editId").value || "").trim();
        if(!cat || !id){
          setStatus(`<span class="ng">削除する番号が必要</span>`);
          return;
        }

        setStatus("deleting...");

        const path = `shops/${encodeURIComponent(auth.shop)}/menu/${encodeURIComponent(cat)}/${encodeURIComponent(id)}`;
        const r = await rtdbPut(path, null);
        if(!r.ok){
          setStatus(`<span class="ng">削除失敗</span> HTTP ${r.status}`);
          setDbg(r);
          return;
        }

        if(menu[cat] && menu[cat][id]) delete menu[cat][id];
        clearEditor();
        rebuildLists();
        rebuildPick();

        setStatus(`<span class="ok">削除OK</span>`);
        $("lastLine").textContent = "更新: " + new Date().toLocaleTimeString("ja-JP");
      }catch(e){
        setStatus(`<span class="ng">削除エラー</span> ${esc(String(e.message||e))}`);
        setDbg(String(e.stack || e));
      }
    }

    // ---- events ----
    $("btnBack").onclick = ()=> location.href = "menu.html?v=" + Date.now();
    $("btnReload").onclick = loadMenu;
    $("btnFixKeys").onclick = ()=>{
      fixKeysIfNeeded();
      setStatus(`<span class="ok">OK</span> キー修復しました（再読み込みしてください）`);
      setDbg({
        shopCode: localStorage.getItem("shopCode"),
        shop: localStorage.getItem("shop"),
        shopPin: localStorage.getItem("shopPin"),
        pin: localStorage.getItem("pin")
      });
    };

    $("pickCat").onchange = ()=>{
      rebuildPick();
      clearEditor();
    };
    $("pickId").onchange = ()=>{
      const cat = $("pickCat").value;
      const id  = $("pickId").value;
      if(id) setActive(cat, id);
    };

    $("btnSave").onclick = saveItem;
    $("btnDelete").onclick = deleteItem;
    $("btnClear").onclick = clearEditor;

    $("btnPrintDrink").onclick = ()=>{
      document.body.setAttribute("data-print","drink");
      window.print();
      document.body.setAttribute("data-print","");
    };
    $("btnPrintFood").onclick = ()=>{
      document.body.setAttribute("data-print","food");
      window.print();
      document.body.setAttribute("data-print","");
    };
    $("btnPrintAll").onclick = ()=>{
      document.body.setAttribute("data-print","");
      window.print();
    };

    // 初期
    loadMenu();
  </script>
</body>
</html>
