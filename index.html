<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>izakaya-relay debug</title>
</head>
<body style="margin:0">
<pre id="msg" style="padding:16px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;">loading...</pre>

<script>
const FIREBASE_DB_URL = "https://izakayaorder-default-rtdb.firebaseio.com";
const out = document.getElementById("msg");
const log = (s) => out.textContent += s + "\n";

out.textContent = "";

const params = new URLSearchParams(location.search);
const shop  = params.get("shop");
const table = params.get("table");
const v     = params.get("v"); // キャッシュ潰し用（表示するだけ）
log("v=" + v);

if (!shop || !table) {
  log("missing params: ?shop=daboya&table=1");
  throw new Error("missing params");
}
log("shop=" + shop + " table=" + table);

const enc = encodeURIComponent;
const activeUrl  = `${FIREBASE_DB_URL}/webActiveSessions/${enc(shop)}/${enc(table)}.json`;

function token4() {
  return String(Math.floor(Math.random()*10000)).padStart(4,"0");
}

async function GET(url){
  const r = await fetch(url, { method:"GET" });
  const t = await r.text();
  return { ok:r.ok, status:r.status, text:t };
}
async function PUT(url, obj){
  const r = await fetch(url, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(obj)
  });
  const t = await r.text();
  return { ok:r.ok, status:r.status, text:t };
}

(async ()=>{
  log("ACTIVE URL:");
  log(activeUrl);

  log("\nGET active...");
  const g = await GET(activeUrl);
  log("GET status=" + g.status);
  log("GET text=" + g.text);

  // ここで「permission denied」かどうかが分かる
  if (g.text && g.text.includes("Permission")) {
    log("\n=> RULES BLOCKING (permission denied)");
    return;
  }

  // active が null なら作る
  if (g.text === "null" || g.text.trim() === "" ) {
    const t4 = token4();
    const token = `${shop}-${table}-${t4}`;
    log("\nactive is null -> CREATE token=" + token);

    const activePayload = { token, token4: t4, updatedAt: Date.now() };
    const sessionUrl = `${FIREBASE_DB_URL}/webSessions/${enc(token)}.json`;
    const sessionPayload = { shop, table, token, token4: t4, createdAt: Date.now() };

    log("\nPUT active...");
    const pa = await PUT(activeUrl, activePayload);
    log("PUT active status=" + pa.status);
    log("PUT active text=" + pa.text);

    log("\nPUT session...");
    log(sessionUrl);
    const ps = await PUT(sessionUrl, sessionPayload);
    log("PUT session status=" + ps.status);
    log("PUT session text=" + ps.text);

    log("\nDONE (if 200/OK then write succeeded)");
    return;
  }

  // active が既にあるなら「書かない」（会計リセット運用）
  log("\nactive exists -> NO WRITE (this is expected until checkout reset)");
})().catch(e=>{
  log("\nERROR: " + e.message);
  console.error(e);
});
</script>
</body>
</html>
