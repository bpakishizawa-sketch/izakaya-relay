<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>params</title>

  <!-- Thunkable Webviewer Extension -->
  <script src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js"></script>

  <script>
    (function () {
      function parse(search) {
        const p = new URLSearchParams(search || "");
        return {
          shop: p.get("shop") || "",
          table: p.get("table") || ""
        };
      }

      function send(obj) {
        ThunkableWebviewerExtension.postMessage(JSON.stringify(obj));
      }

      window.addEventListener("load", function () {
        let search = "";
        try {
          search = window.parent.location.search || "";
        } catch (e) {
          search = window.location.search || "";
        }

        const q = parse(search);
        send({ type: "PARAMS", ...q, raw: search, at: Date.now() });
      });
    })();
  </script>
</head>
<body>
  params loader
</body>
</html>
