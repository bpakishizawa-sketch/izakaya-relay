<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>params_v2 debug</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; padding: 16px; }
    .ok { color: #0a0; font-weight: 800; }
    .ng { color: #c00; font-weight: 800; }
    pre { background:#f5f5f5; padding:12px; border-radius:8px; overflow:auto; }
  </style>
</head>
<body>
  <h1>params_v2 debug</h1>
  <div id="status" class="ng">loading...</div>
  <pre id="out"></pre>

<script>
  function getParamsFromUrl(url) {
    try {
      const u = new URL(url);
      return {
        shop: u.searchParams.get("shop") || "",
        table: u.searchParams.get("table") || ""
      };
    } catch (e) {
      return { shop:"", table:"" };
    }
  }

  // 1) params_v2.html 自身のURLから取る
  let p = getParamsFromUrl(location.href);

  // 2) 無ければ 親(=thunkable.site)のURL(referrer)から取る
  if (!p.shop || !p.table) {
    const rp = getParamsFromUrl(document.referrer || "");
    if (!p.shop)  p.shop  = rp.shop;
    if (!p.table) p.table = rp.table;
  }

  const payload = {
    type: "PARAMS",
    shop: p.shop,
    table: p.table,
    href: location.href,
    referrer: document.referrer || "",
    ts: Date.now()
  };

  function postToThunkable(msgObj) {
    const s = JSON.stringify(msgObj);

    // Thunkable WebViewer拡張
    if (window.ThunkableWebviewerExtension && window.ThunkableWebviewerExtension.postMessage) {
      window.ThunkableWebviewerExtension.postMessage(s);
      return true;
    }
    // 予備（環境によってはこっち）
    if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
      window.ReactNativeWebView.postMessage(s);
      return true;
    }
    return false;
  }

  const ok = postToThunkable(payload);

  const status = document.getElementById("status");
  status.className = ok ? "ok" : "ng";
  status.textContent = ok ? "✅ postMessage sent to Thunkable" : "❌ Thunkable extension not found (ブラウザ直叩きはこれになる)";

  document.getElementById("out").textContent = JSON.stringify(payload, null, 2);
</script>
</body>
</html>
