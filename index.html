<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>izakaya-relay</title>
</head>
<body style="margin:0">
  <div id="msg" style="padding:16px;font-family:sans-serif;white-space:pre-wrap;">読み込み中…</div>

<script>
const FIREBASE_DB_URL = "https://izakayaorder-default-rtdb.firebaseio.com";
const msg = (t) => document.getElementById("msg").textContent = t;
const enc = encodeURIComponent;

const params = new URLSearchParams(location.search);
const shop  = params.get("shop");
const table = params.get("table");

if (!shop || !table) {
  msg("missing params: shop / table\n例: ?shop=daboya&table=1");
  throw new Error("missing params");
}

// ★WEB専用ツリー（Rulesに合わせる）
const activeUrl  = `${FIREBASE_DB_URL}/webActiveSessions/${enc(shop)}/${enc(table)}.json`;

function makeToken() {
  const r = (crypto && crypto.getRandomValues)
    ? crypto.getRandomValues(new Uint32Array(1))[0].toString(16)
    : Math.floor(Math.random()*1e12).toString(16);
  return `${shop}-${table}-${Date.now().toString(36)}-${r}`;
}

async function getJson(url){
  const r = await fetch(url, { method:"GET" });
  if (!r.ok) throw new Error(await r.text());
  return await r.json();
}
async function putJson(url, data){
  const r = await fetch(url, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(await r.text());
}

(async () => {
  msg(`着席処理…\nshop=${shop}\ntable=${table}`);

  // ① 既に会計中なら token 再利用（乱立しない）
  let active = null;
  try { active = await getJson(activeUrl); } catch(e) { active = null; }

  if (active && active.token) {
    msg("既に会計中 → token再利用 → 注文へ");
    location.replace(`order.html?shop=${enc(shop)}&table=${enc(table)}&token=${enc(active.token)}&v=${Date.now()}`);
    return;
  }

  // ② 無ければ新規発行
  const token = makeToken();
  const sessionUrl = `${FIREBASE_DB_URL}/webSessions/${enc(token)}.json`;

  msg("新規token発行中…");

  await Promise.all([
    putJson(sessionUrl, { shop, table, token, createdAt: Date.now() }),
    putJson(activeUrl,  { token, updatedAt: Date.now() })
  ]);

  msg("OK → 注文へ");
  location.replace(`order.html?shop=${enc(shop)}&table=${enc(table)}&token=${enc(token)}&v=${Date.now()}`);
})().catch(e=>{
  console.error(e);
  msg("NG: Firebase書き込み失敗（Rules/URL）\n" + e.message);
});
</script>
</body>
</html>
