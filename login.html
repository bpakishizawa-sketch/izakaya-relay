<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>shop login</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px;max-width:720px;margin:0 auto}
    input,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #ccc}
    button{cursor:pointer;border:0;font-weight:800}
    .row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
    .btn{background:#111827;color:#fff}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0}
    .ok{color:#16a34a;font-weight:800}
    .ng{color:#dc2626;font-weight:800}
    .muted{color:#6b7280;font-size:12px;line-height:1.6}
    small{color:#6b7280}
  </style>
</head>
<body>
  <h2>店側ログイン</h2>

  <div class="card">
    <div class="row">
      <input id="shop" placeholder="shopコード（例：daboya）" style="flex:1;min-width:240px">
      <input id="pin"  placeholder="PIN（例：1111）" style="width:180px">
      <button id="btnLogin" class="btn" type="button">ログイン</button>
    </div>

    <div id="msg" class="muted">
      端末ごとにログインします（厨房／会計で分けてもOK）。<br>
      保存先：<b>localStorage</b>（shopCode / shopPin）
    </div>

    <div class="row" style="margin-top:12px">
      <button id="btnClear" type="button">保存データ削除</button>
      <button id="btnToMenu" class="btn" type="button">メニューへ</button>
    </div>
  </div>

  <div class="card">
    <div class="muted"><small>デバッグ</small></div>
    <pre id="dbg" style="white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto">-</pre>
  </div>

<script>
  const $ = (id)=>document.getElementById(id);

  function dbg(obj){
    $("dbg").textContent = JSON.stringify(obj, null, 2);
  }

  function setMsg(html){
    $("msg").innerHTML = html;
  }

  function saveLogin(shop, pin){
    localStorage.setItem("shopCode", String(shop||"").trim());
    localStorage.setItem("shopPin",  String(pin||"").trim());
  }

  function readLogin(){
    return {
      shopCode: (localStorage.getItem("shopCode") || "").trim(),
      shopPin:  (localStorage.getItem("shopPin")  || "").trim(),
    };
  }

  function toMenu(){
    location.href = `menu.html?v=${Date.now()}`;
  }

  // 初期表示
  dbg({
    href: location.href,
    stored: readLogin(),
    note: "ここでログインできれば、shop_common.js が原因です"
  });

  $("btnLogin").addEventListener("click", ()=>{
    const shop = $("shop").value.trim();
    const pin  = $("pin").value.trim();

    if(!shop || !pin){
      setMsg(`<span class="ng">shop と PIN を入れてください</span>`);
      return;
    }

    saveLogin(shop, pin);
    const st = readLogin();
    setMsg(`<span class="ok">ログイン保存OK</span> shop=${st.shopCode}`);
    dbg({ action:"login", stored: st, time: Date.now() });

    // すぐメニューへ
    toMenu();
  });

  $("btnClear").addEventListener("click", ()=>{
    localStorage.removeItem("shopCode");
    localStorage.removeItem("shopPin");
    setMsg(`<span class="ok">保存データを削除しました</span>`);
    dbg({ action:"clear", stored: readLogin(), time: Date.now() });
  });

  $("btnToMenu").addEventListener("click", ()=>{
    toMenu();
  });
</script>
</body>
</html>
