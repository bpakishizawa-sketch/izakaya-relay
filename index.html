<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>izakaya-relay</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; padding: 16px; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <pre id="log"></pre>

<script>
/** ========= ここだけ差し替え ========= */
const FIREBASE_DB = "https://izakayaorder-default-rtdb.firebaseio.com";
const THUNKABLE_WEBAPP_URL = "PASTE_YOUR_THUNKABLE_WEBAPP_PUBLISHED_URL_HERE";
/** =================================== */

const VERSION = "relay-fixedqr-20260113-1";

const $log = document.getElementById("log");
function log(s) { $log.textContent += s + "\n"; }

function qs(name) {
  const u = new URL(location.href);
  return u.searchParams.get(name);
}
function hasDebug() {
  const u = new URL(location.href);
  return u.searchParams.get("debug") === "1";
}
function nowMs() { return Date.now(); }

function rand4() {
  // 0000〜9999
  return String(Math.floor(Math.random() * 10000)).padStart(4, "0");
}

function fbUrl(path) {
  // path は先頭スラッシュなしで渡す
  return `${FIREBASE_DB}/${path}.json`;
}

async function fbGet(path) {
  const r = await fetch(fbUrl(path), { method: "GET" });
  const t = await r.text();
  let j = null;
  try { j = t ? JSON.parse(t) : null; } catch(e) {}
  return { status: r.status, text: t, json: j };
}

async function fbPut(path, obj) {
  const r = await fetch(fbUrl(path), {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(obj),
  });
  const t = await r.text();
  let j = null;
  try { j = t ? JSON.parse(t) : null; } catch(e) {}
  return { status: r.status, text: t, json: j };
}

function redirectToThunkable(params) {
  // Thunkable 側が shop/table/token/token4 を受け取れるようにクエリを付ける
  const u = new URL(THUNKABLE_WEBAPP_URL);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  location.replace(u.toString());
}

(async function main() {
  const shop = qs("shop");
  const table = qs("table");

  log(`VERSION=${VERSION}`);
  if (!shop || !table) {
    log("missing params: shop / table");
    log("例: ?shop=daboya&table=1");
    return;
  }

  // デバッグ表示の有無
  const debug = hasDebug();
  if (!debug) {
    // debug=1 じゃない時は画面表示を最小化（でもログは一応残す）
    $log.style.display = "none";
  } else {
    log(`shop=${shop} table=${table}`);
  }

  // 1) active を読む（固定QRは shop/table だけ。active は「会計まで固定」）
  const activePath = `webActiveSessions/${shop}/${table}`;
  const activeUrl = fbUrl(activePath).replace(".json", ""); // 表示用
  if (debug) log(`ACTIVE URL:\n${activeUrl}`);

  const g1 = await fbGet(activePath);
  if (debug) {
    log("");
    log("GET active...");
    log(`GET status=${g1.status}`);
    log(`GET text=${g1.text}`);
  }

  // 2) active が存在するなら「書き換えない」→ そのトークンでThunkableへ
  if (g1.status === 200 && g1.json && g1.json.token) {
    if (debug) log("\nactive exists -> NO WRITE (until checkout reset)");
    const token = g1.json.token;
    const token4 = g1.json.token4 || "";
    redirectToThunkable({ shop, table, token, token4 });
    return;
  }

  // 3) active が無い（null）なら「初回着席」→ 発行して書く
  // ※ここが “着席したら固定” の実装
  const token4 = rand4();
  const token = `${shop}-${table}-${token4}`;
  const ts = nowMs();

  const activeObj = { token, token4, updatedAt: ts };
  const s1 = await fbPut(activePath, activeObj);

  if (debug) {
    log("");
    log("PUT active...");
    log(`PUT status=${s1.status}`);
    log(`PUT text=${s1.text}`);
  }

  // 4) webSessions も作成（履歴・検証用）
  const sessionPath = `webSessions/${token}`;
  const sessionObj = { createdAt: ts, shop, table: String(table), token, token4 };
  const s2 = await fbPut(sessionPath, sessionObj);

  if (debug) {
    log("");
    log("PUT session...");
    log(`PUT status=${s2.status}`);
    log(`PUT text=${s2.text}`);
  }

  // 5) Thunkableへ遷移
  redirectToThunkable({ shop, table, token, token4 });
})();
</script>
</body>
</html>
