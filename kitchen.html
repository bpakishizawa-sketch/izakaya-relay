<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitchen - Order Feed</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:18px; max-width:1200px; margin:0 auto;}
    h1{font-size:22px;margin:0 0 8px}
    .sub{font-size:12px;color:#6b7280;margin-bottom:12px;line-height:1.6}
    .topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
    .card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0;background:#fff;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    select,input{font-size:16px;padding:10px;border:1px solid #ccc;border-radius:10px}
    button{font-size:14px;padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:900}
    button.dark{background:#111827;color:#fff}
    button.light{background:#f3f4f6;color:#111827;border:1px solid #ddd}
    button.done{background:#16a34a;color:#fff}
    button.cancel{background:#ef4444;color:#fff}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .muted{color:#6b7280}
    .small{font-size:12px;color:#6b7280}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #ddd;font-weight:900;font-size:12px}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}

    /* 2カラム：左=drink / 右=food */
    .twoCol{display:grid;grid-template-columns:1fr; gap:12px; align-items:start;}
    @media(min-width:860px){
      .twoCol{grid-template-columns: 1fr 1fr;}
    }
    .colHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .colTitle{font-weight:900;font-size:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .badgeDrink{background:#dbeafe;border-color:#3b82f6}
    .badgeFood{background:#dcfce7;border-color:#16a34a}
    .list{display:flex;flex-direction:column;gap:10px}

    /* 注文カード */
    .oCard{border:1px solid #e5e7eb;border-radius:12px;padding:12px;background:#fff}
    .oTop{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .oName{font-weight:900;font-size:16px;margin-top:8px}
    .oMeta{font-size:12px;color:#6b7280;margin-top:4px}
    .oBtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

    /* 提供済みペンディング（10秒） */
    .pending{
      background:#f0fdf4;
      border-color:#22c55e;
    }
    .pending .pillPending{
      background:#dcfce7;border-color:#22c55e;
    }
    .countdown{font-weight:900;}

    /* 新規オーダーバナー */
    .alertBanner{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 10px;
      z-index: 9999;
      background: #dc2626;
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      display: none;
      max-width: 92vw;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="alertBanner" class="alertBanner">新規オーダー！</div>

  <h1>厨房：オーダーリスト</h1>
  <div class="sub">
    左＝ドリンク / 右＝フード
  </div>

  <div class="card">
    <div class="row">
      <div>shop: <b id="shopText" class="mono">-</b></div>
      <div class="small">（localStorage.shopCode）</div>
    </div>

    <div class="topbar">
      <button id="btnBack" class="light">← menuへ</button>
      <button id="btnRefresh" class="dark">更新</button>

      <label class="row">
        <span class="small">自動更新</span>
        <select id="autoSec">
          <option value="0">OFF</option>
          <option value="2" selected>2秒</option>
          <option value="5">5秒</option>
          <option value="10">10秒</option>
        </select>
      </label>

      <label class="row">
        <span class="small">テーブル</span>
        <input id="tableFilter" placeholder="例：1（空=全て）" style="width:160px" inputmode="numeric" />
      </label>

      <label class="row">
        <select id="hidePending">
          <option value="0" selected>提供処理中も表示</option>
          <option value="1">提供処理中は隠す</option>
        </select>
      </label>

      <button id="btnSound" class="light">🔔音OFF</button>
      <button id="btnBeep" class="light">テスト</button>

      <label class="row">
        <span class="small">回数</span>
        <select id="alarmRepeat">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>

      <label class="row">
        <span class="small">間隔ms</span>
        <select id="alarmGap">
          <option value="100">100</option>
          <option value="150" selected>150</option>
          <option value="200">200</option>
          <option value="250">250</option>
          <option value="300">300</option>
        </select>
      </label>

      <label class="row">
        <span class="small">音程</span>
        <select id="alarmFreq">
          <option value="660">660</option>
          <option value="880" selected>880</option>
          <option value="1046">1046</option>
          <option value="1320">1320</option>
        </select>
      </label>

      <label class="row">
        <span class="small">音量</span>
        <select id="alarmVol">
          <option value="0.03">小</option>
          <option value="0.05" selected>中</option>
          <option value="0.08">大</option>
        </select>
      </label>
    </div>

    <div id="status" class="small muted">-</div>
  </div>

  <div class="twoCol">
    <div class="card">
      <div class="colHead">
        <div class="colTitle">
          <span class="pill badgeDrink">ドリンク</span>
          <span class="mono" id="drinkCount">0</span>
        </div>
        <div class="small muted" id="drinkByTable">-</div>
      </div>
      <div class="list" id="drinkList"></div>
    </div>

    <div class="card">
      <div class="colHead">
        <div class="colTitle">
          <span class="pill badgeFood">フード</span>
          <span class="mono" id="foodCount">0</span>
        </div>
        <div class="small muted" id="foodByTable">-</div>
      </div>
      <div class="list" id="foodList"></div>
    </div>
  </div>

  <details class="card" style="display:none;">
    <summary>デバッグ</summary>
    <pre id="debug" class="mono">-</pre>
  </details>

<script>
/** ===== 設定 ===== */
const DB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
/** ============== */

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
function now(){ return Date.now(); }

async function rtdbGet(path){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url);
  const txt = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${txt}`);
  return JSON.parse(txt || "null");
}
async function rtdbPatch(path, obj){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method: "PATCH",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(obj)
  });
  const txt = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${txt}`);
  return JSON.parse(txt || "null");
}
async function rtdbPut(path, data){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url, {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });
  const txt = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${txt}`);
  return JSON.parse(txt || "null");
}

function getShop(){
  return (localStorage.getItem("shopCode") || "").trim();
}

function fmtTime(ts){
  if(!ts) return "-";
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  const ss = String(d.getSeconds()).padStart(2,"0");
  return `${hh}:${mm}:${ss}`;
}

function normalizeOrder(pushId, o){
  const table = String(o.table ?? "");
  const category = String(o.category ?? o.cat ?? "").toLowerCase();
  const createdAt = Number(o.createdAt ?? o.updatedAt ?? 0);

  let name = o.name ?? o.itemName ?? "";
  let qty = Number(o.qty ?? o.count ?? 1);
  let price = (o.price === undefined ? "" : o.price);

  if((!name || !qty) && Array.isArray(o.items) && o.items.length){
    name = o.items[0].name ?? name;
    qty = Number(o.items[0].qty ?? qty);
  }

  const status = String(o.status ?? "new");
  const providedAt = Number(o.providedAt ?? 0);
  const deleteAt = Number(o.deleteAt ?? 0);

  return { pushId, raw:o, table, category, name, qty, price, createdAt, status, providedAt, deleteAt };
}

/** 10秒後削除の管理 */
const deleteTimers = new Map();

function scheduleDelete(shop, pushId, deleteAt){
  if(deleteTimers.has(pushId)) return;
  const ms = Math.max(0, Number(deleteAt||0) - now());
  const t = setTimeout(async ()=>{
    deleteTimers.delete(pushId);
    try{
      await rtdbPut(`shops/${encodeURIComponent(shop)}/orderFeed/${encodeURIComponent(pushId)}`, null);
      await refresh();
    }catch(e){
      console.log("delete failed", e);
    }
  }, ms);
  deleteTimers.set(pushId, t);
}

function cancelScheduledDelete(pushId){
  const t = deleteTimers.get(pushId);
  if(t){
    clearTimeout(t);
    deleteTimers.delete(pushId);
  }
}

function sumByTable(list){
  const m = new Map();
  for(const o of list){
    const t = String(o.table||"?");
    const q = Number(o.qty||0);
    m.set(t, (m.get(t)||0) + q);
  }
  const arr = Array.from(m.entries()).sort((a,b)=>Number(a[0]) - Number(b[0]));
  if(arr.length===0) return "-";
  return arr.map(([t,q])=>`T${t}:${q}`).join(" / ");
}

function renderColumn(rootId, list, shop){
  const root = $(rootId);
  root.innerHTML = "";

  const tFilter = $("tableFilter").value.trim();
  const hidePending = $("hidePending").value === "1";

  let view = list.slice();
  if(tFilter) view = view.filter(x => String(x.table) === String(tFilter));
  if(hidePending) view = view.filter(x => !(x.deleteAt && x.deleteAt > now()));

  view.sort((a,b)=> (a.createdAt||0) - (b.createdAt||0));

  if(view.length === 0){
    root.innerHTML = `<div class="muted"><small>表示する注文がありません</small></div>`;
    return;
  }

  for(const o of view){
    const isPending = (o.deleteAt && o.deleteAt > now());
    const left = isPending ? Math.max(0, Math.ceil((o.deleteAt - now())/1000)) : 0;

    if(isPending){
      scheduleDelete(shop, o.pushId, o.deleteAt);
    }else if(o.deleteAt && o.deleteAt <= now()){
      scheduleDelete(shop, o.pushId, now()+10);
    }

    const div = document.createElement("div");
    div.className = "oCard" + (isPending ? " pending" : "");

    div.innerHTML = `
      <div class="oTop">
        <span class="pill">T${esc(o.table || "?")}</span>
        <span class="pill mono">${esc(fmtTime(o.createdAt))}</span>
        ${
          isPending
          ? `<span class="pill pillPending">提供処理中 <span class="countdown">${left}s</span></span>`
          : `<span class="pill" style="background:#fff7ed;border-color:#f59e0b">未提供</span>`
        }
      </div>

      <div class="oName">${esc(o.name || "(no name)")}</div>
      <div class="oMeta">数量：<b>${esc(o.qty)}</b>${o.price!=="" ? ` / 単価：<b>${esc(o.price)}</b>` : ""}</div>

      <div class="oBtns">
        ${
          isPending
          ? `<button class="cancel" data-act="undo" data-id="${esc(o.pushId)}">取消</button>`
          : `<button class="done" data-act="done" data-id="${esc(o.pushId)}">提供済み</button>`
        }
        <button class="light" data-act="copy" data-id="${esc(o.pushId)}">IDコピー</button>
      </div>

      <div class="small muted">pushId: <span class="mono">${esc(o.pushId)}</span></div>
    `;

    div.querySelectorAll("button").forEach(btn=>{
      btn.onclick = async ()=>{
        const act = btn.getAttribute("data-act");
        const id  = btn.getAttribute("data-id");

        if(act === "copy"){
          try{ await navigator.clipboard.writeText(id); }catch{}
          return;
        }

        if(act === "done"){
          try{
            const deleteAt = now() + 10000;
            await rtdbPatch(`shops/${encodeURIComponent(shop)}/orderFeed/${encodeURIComponent(id)}`, {
              status: "pending",
              providedAt: now(),
              deleteAt: deleteAt
            });
            scheduleDelete(shop, id, deleteAt);
            await refresh();
          }catch(e){
            $("status").innerHTML = `<span class="ng">更新失敗</span> ${esc(e.message||e)}`;
          }
          return;
        }

        if(act === "undo"){
          try{
            cancelScheduledDelete(id);
            await rtdbPatch(`shops/${encodeURIComponent(shop)}/orderFeed/${encodeURIComponent(id)}`, {
              status: "new",
              providedAt: null,
              deleteAt: null
            });
            await refresh();
          }catch(e){
            $("status").innerHTML = `<span class="ng">取消失敗</span> ${esc(e.message||e)}`;
          }
          return;
        }
      };
    });

    root.appendChild(div);
  }
}

/* ===== バナー ===== */
function showNewOrderBanner(msg){
  const el = $("alertBanner");
  if(!el) return;
  el.textContent = msg || "新規！";
  el.style.display = "block";
  clearTimeout(showNewOrderBanner._t);
  showNewOrderBanner._t = setTimeout(()=>{ el.style.display = "none"; }, 3500);
}

/* ===== 新規オーダー検知 ===== */
function getLastMaxKey(shop){ return `kitchen_lastMax_${shop}`; }
function loadLastMax(shop){
  const v = localStorage.getItem(getLastMaxKey(shop));
  return v ? Number(v) : 0;
}
function saveLastMax(shop, n){
  localStorage.setItem(getLastMaxKey(shop), String(Number(n||0)));
}

/* ===== 会計依頼検知 ===== */
function getLastCheckoutKey(shop){ return `kitchen_lastCheckout_${shop}`; }
function loadLastCheckout(shop){
  const v = localStorage.getItem(getLastCheckoutKey(shop));
  return v ? Number(v) : 0;
}
function saveLastCheckout(shop, n){
  localStorage.setItem(getLastCheckoutKey(shop), String(Number(n||0)));
}

/* iPhone対策：ユーザー操作後だけ鳴らせる */
let soundEnabled = false;
let audioCtx = null;

function ensureAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();
}

function getAlarmSettings(){
  const repeat = Math.max(1, Math.min(8, Number(($("alarmRepeat")?.value)||3)));
  const gapMs  = Math.max(60, Math.min(800, Number(($("alarmGap")?.value)||150)));
  const freq   = Math.max(200, Math.min(4000, Number(($("alarmFreq")?.value)||880)));
  const vol    = Math.max(0.005, Math.min(0.2, Number(($("alarmVol")?.value)||0.05)));
  return { repeat, gapMs, freq, vol };
}

function beepOnce(freq=880, vol=0.05, ms=180){
  if(!soundEnabled) return;
  try{
    ensureAudio();
    if(!audioCtx) return;
    if(audioCtx.state === "suspended"){ audioCtx.resume(); }
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    setTimeout(()=>{ try{o.stop();}catch{} }, ms);
  }catch{}
}

function alarmBeep(){
  if(!soundEnabled) return;
  const { repeat, gapMs, freq, vol } = getAlarmSettings();
  let i = 0;
  const one = () => {
    if(i >= repeat) return;
    i++;
    beepOnce(freq, vol, 180);
    setTimeout(one, 180 + gapMs);
  };
  one();
}

function detectNewOrders(shop, allOrders){
  let maxCreatedAt = 0;
  for(const o of allOrders){
    const t = Number(o.createdAt||0);
    if(t > maxCreatedAt) maxCreatedAt = t;
  }

  const last = loadLastMax(shop);
  if(!last){
    saveLastMax(shop, maxCreatedAt);
    return;
  }

  if(maxCreatedAt > last){
    showNewOrderBanner("新規オーダー！");
    try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch{}
    alarmBeep();
    saveLastMax(shop, maxCreatedAt);
  }
}

function detectCheckoutRequests(shop, reqs){
  // reqs: [{table, requestedAt, total, token}]
  let maxTs = 0;
  for(const r of reqs){
    const t = Number(r.requestedAt || 0);
    if(t > maxTs) maxTs = t;
  }

  const last = loadLastCheckout(shop);
  if(!last){
    saveLastCheckout(shop, maxTs);
    return;
  }

  if(maxTs > last){
    const latest = reqs.slice().sort((a,b)=>Number(b.requestedAt)-Number(a.requestedAt))[0];
    const msg = latest && latest.table ? `会計依頼！ T${latest.table}` : `会計依頼！`;
    showNewOrderBanner(msg);
    try{ navigator.vibrate && navigator.vibrate([160,80,160,80,160]); }catch{}
    alarmBeep();
    saveLastCheckout(shop, maxTs);
  }
}

/* =========================================== */

let timer = null;

async function refresh(){
  const shop = getShop();
  if(!shop){
    $("status").innerHTML = `<span class="ng">未ログイン</span>`;
    setTimeout(()=> location.href = `menu.html?v=${Date.now()}`, 400);
    return;
  }
  $("shopText").textContent = shop;

  try{
    $("status").textContent = "loading...";

    // ===== orderFeed =====
    const data = await rtdbGet(`shops/${encodeURIComponent(shop)}/orderFeed`);
    const all = [];
    if(data && typeof data === "object"){
      for(const [pushId, obj] of Object.entries(data)){
        if(!obj || typeof obj !== "object") continue;
        all.push(normalizeOrder(pushId, obj));
      }
    }

    detectNewOrders(shop, all);

    const drinks = all.filter(x => x.category === "drink");
    const foods  = all.filter(x => x.category === "food");

    $("drinkCount").textContent = String(drinks.length);
    $("foodCount").textContent  = String(foods.length);
    $("drinkByTable").textContent = "合計: " + sumByTable(drinks);
    $("foodByTable").textContent  = "合計: " + sumByTable(foods);

    renderColumn("drinkList", drinks, shop);
    renderColumn("foodList", foods, shop);

    // ===== checkoutRequests（会計依頼通知） =====
    const cr = await rtdbGet(`shops/${encodeURIComponent(shop)}/checkoutRequests`);
    const reqs = [];
    if(cr && typeof cr === "object"){
      for(const [tableKey, obj] of Object.entries(cr)){
        if(!obj || typeof obj !== "object") continue;
        reqs.push({
          table: String(obj.table ?? tableKey ?? ""),
          requestedAt: Number(obj.requestedAt ?? obj.requestedAtTs ?? obj.createdAt ?? 0),
          total: Number(obj.total ?? 0),
          token: String(obj.token ?? "")
        });
      }
    }
    detectCheckoutRequests(shop, reqs);

    $("status").innerHTML = `<span class="ok">OK</span> ${all.length} 件（${new Date().toLocaleTimeString()}）`;

    const dbg = $("debug");
    if(dbg){
      dbg.textContent = JSON.stringify({
        shop,
        total: all.length,
        drink: drinks.length,
        food: foods.length,
        checkoutRequests: reqs.length,
        alarm: { soundEnabled, ...getAlarmSettings() }
      }, null, 2);
    }

  }catch(e){
    $("status").innerHTML = `<span class="ng">読込失敗</span> ${esc(e.message||e)}`;
    const dbg = $("debug");
    if(dbg) dbg.textContent = String(e.stack || e);
    $("drinkList").innerHTML = `<div class="muted"><small>読み込みに失敗しました</small></div>`;
    $("foodList").innerHTML  = `<div class="muted"><small>読み込みに失敗しました</small></div>`;
  }
}

function setAuto(){
  const sec = Number($("autoSec").value || 0);
  if(timer){ clearInterval(timer); timer = null; }
  if(sec > 0){
    timer = setInterval(refresh, sec * 1000);
  }
}

$("btnBack").onclick = ()=> location.href = `menu.html?v=${Date.now()}`;
$("btnRefresh").onclick = refresh;
$("autoSec").onchange = setAuto;
$("tableFilter").onchange = refresh;
$("hidePending").onchange = refresh;

$("btnSound").onclick = async ()=>{
  soundEnabled = !soundEnabled;
  $("btnSound").textContent = soundEnabled ? "🔔音ON" : "🔔音OFF";
  if(soundEnabled){
    try{
      ensureAudio();
      if(audioCtx && audioCtx.state === "suspended"){
        await audioCtx.resume();
      }
    }catch{}
  }
};
$("btnBeep").onclick = ()=>{
  soundEnabled = true;
  $("btnSound").textContent = "🔔音ON";
  alarmBeep();
};

setAuto();
refresh();
</script>
</body>
</html>
