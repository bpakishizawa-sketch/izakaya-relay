<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - 会計</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:18px; max-width:1200px; margin:0 auto; background:#f6f7f9;}
    h1{font-size:22px;margin:0 0 8px}
    .sub{font-size:12px;color:#6b7280;margin-bottom:12px;line-height:1.6}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:12px 0;background:#fff;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    select,input{font-size:16px;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
    button{font-size:14px;padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:900}
    button.dark{background:#111827;color:#fff}
    button.light{background:#f3f4f6;color:#111827;border:1px solid #ddd}
    button.ok{background:#16a34a;color:#fff}
    .okText{color:#16a34a;font-weight:900}
    .ngText{color:#dc2626;font-weight:900}
    .muted{color:#6b7280}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #ddd;font-weight:900;font-size:12px;background:#fff}
    .grid2{display:grid;grid-template-columns:1fr; gap:12px; align-items:start;}
    @media(min-width:900px){ .grid2{grid-template-columns: 1fr 1fr;} }

    /* 着席中テーブルのみ表示 */
    .tableGrid{display:grid;grid-template-columns:repeat(3,1fr); gap:10px;}
    @media(min-width:700px){ .tableGrid{grid-template-columns:repeat(6,1fr);} }
    @media(min-width:1000px){ .tableGrid{grid-template-columns:repeat(10,1fr);} }
    .tBtn{padding:10px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:900}
    .tOn{border-color:#3b82f6; background:#dbeafe;}
    .tReq{border-color:#dc2626; background:#fee2e2;}
    .tSel{outline:3px solid rgba(17,24,39,.25);}

    /* 明細 */
    .receipt{border:1px solid #e5e7eb;border-radius:12px;padding:12px;background:#fff}
    .rcHead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
    .rcTitle{font-weight:900}
    .rcMeta{font-size:12px;color:#6b7280}
    .rcLines{margin-top:10px;display:flex;flex-direction:column;gap:8px}
    .line{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed #eee;padding-top:8px}
    .line:first-child{border-top:0;padding-top:0}
    .sumBig{font-size:22px;font-weight:900}

    /* バナー */
    .alertBanner{
      position: fixed; left: 50%; transform: translateX(-50%); top: 10px; z-index: 9999;
      background: #dc2626; color: #fff; padding: 10px 14px; border-radius: 999px;
      font-weight: 900; box-shadow: 0 10px 30px rgba(0,0,0,.2);
      display: none; max-width: 92vw; text-align: center;
    }

    /* 印刷用（PDF） */
    @media print{
      body{background:#fff; padding:0; max-width:none;}
      .noPrint{display:none !important;}
      .card{border:0; padding:0; margin:0;}
      .receipt{border:0;}
    }
  </style>
</head>
<body>
  <div id="alertBanner" class="alertBanner">会計依頼！</div>

  <h1>会計（Checkout）</h1>
  <div class="sub">
    監視：<span class="mono">/shops/{shop}/checkoutRequests</span>（新規で赤バナー＋アラーム）<br>
    会計確定で：<b>checkoutRequests削除 / orders削除 / webActiveSessions削除</b>
  </div>

  <div class="card noPrint">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <span class="pill">shop: <b id="shopText" class="mono">-</b></span>
        <span class="pill">監視: <b class="mono">checkoutRequests</b></span>
      </div>
      <div class="row">
        <button id="btnBack" class="light">← menuへ</button>
        <button id="btnRefresh" class="dark">更新</button>
      </div>
    </div>

    <div class="row" style="margin-top:10px;">
      <label class="row">
        <span class="muted" style="font-size:12px;">自動更新</span>
        <select id="autoSec">
          <option value="0">OFF</option>
          <option value="2" selected>2秒</option>
          <option value="5">5秒</option>
          <option value="10">10秒</option>
        </select>
      </label>

      <button id="btnSound" class="light">🔔音OFF</button>
      <button id="btnBeep" class="light">テスト</button>

      <span id="status" class="muted" style="font-size:12px;">-</span>
    </div>
  </div>

  <div class="grid2">
    <!-- 左：着席中テーブルのみ -->
    <div class="card noPrint">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:900">着席中テーブル（webActiveSessions があるものだけ）</div>
        <div class="muted" style="font-size:12px;">
          <span class="pill">青=着席</span> <span class="pill" style="margin-left:6px;">赤=会計依頼</span>
        </div>
      </div>

      <div id="tableGrid" class="tableGrid" style="margin-top:10px;"></div>

      <div class="muted" style="font-size:12px;margin-top:10px;">
        ※クリックでテーブル選択（右側に明細表示）
      </div>
    </div>

    <!-- 右：明細 -->
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:900">会計明細</div>
        <div class="row noPrint">
          <button id="btnPdf" class="light">PDF</button>
          <button id="btnConfirm" class="ok">会計確定</button>
        </div>
      </div>

      <div id="receiptBox" class="receipt" style="margin-top:10px;">
        <div class="rcHead">
          <div class="rcTitle">テーブル <span id="rcTable" class="mono">-</span></div>
          <div class="rcMeta">
            token: <span id="rcToken" class="mono">-</span><br>
            依頼時刻: <span id="rcReqAt" class="mono">-</span>
          </div>
        </div>

        <div id="rcLines" class="rcLines"></div>

        <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:center;">
          <div class="muted">合計</div>
          <div id="rcTotal" class="sumBig mono">0 円</div>
        </div>

        <div class="muted" style="margin-top:8px;font-size:12px;">
          ※メニュー名と金額のみ表示（ID/コードは非表示）
        </div>
      </div>

      <div id="confirmMsg" class="muted noPrint" style="margin-top:10px;">-</div>
    </div>
  </div>

<script>
/** ===== 設定 ===== */
const DB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
/** ============== */

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function getShop(){ return (localStorage.getItem("shopCode") || "").trim(); }
function fmtJst(ts){ if(!ts) return "-"; try{ return new Date(Number(ts)).toLocaleString("ja-JP"); }catch{ return String(ts); } }
function yen(n){ const x = Number(n||0); return x.toLocaleString("ja-JP") + " 円"; }

async function rtdbGet(path){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url);
  const txt = await res.text();
  if(!res.ok) throw new Error(`GET NG ${res.status} url=${url} body=${txt}`);
  return txt ? JSON.parse(txt) : null;
}
async function rtdbPut(path, data){
  const url = `${DB_BASE}/${path}.json`;
  const res = await fetch(url, { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(data) });
  const txt = await res.text();
  if(!res.ok) throw new Error(`PUT NG ${res.status} url=${url} body=${txt}`);
  return txt ? JSON.parse(txt) : null;
}

function setStatus(html){ $("status").innerHTML = html || ""; }
function setConfirmMsg(html){ $("confirmMsg").innerHTML = html || ""; }

/* ===== 通知（3秒） ===== */
let soundEnabled = false;
let audioCtx = null;
function ensureAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();
}
function beep3s(){
  if(!soundEnabled) return;
  try{
    ensureAudio();
    if(!audioCtx) return;
    if(audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.value = 0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    setTimeout(()=>{ try{o.stop();}catch{} }, 3000);
  }catch{}
}
function showBanner(msg){
  const el = $("alertBanner");
  el.textContent = msg || "会計依頼！";
  el.style.display = "block";
  clearTimeout(showBanner._t);
  showBanner._t = setTimeout(()=>{ el.style.display = "none"; }, 3500);
}
function notifyCheckout(){
  showBanner("会計依頼！");
  try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch{}
  beep3s();
}

/* ===== 状態 ===== */
let timer = null;
let selectedTable = "";
let lastReqAt = new Map(); // table -> requestedAt
let latestRequests = {};
let latestSessions = {};

/* ===== 明細表示 ===== */
function renderReceipt(req){
  if(!req){
    $("rcTable").textContent = selectedTable || "-";
    $("rcToken").textContent = "-";
    $("rcReqAt").textContent = "-";
    $("rcLines").innerHTML = `<div class="muted"><small>会計依頼がありません</small></div>`;
    $("rcTotal").textContent = yen(0);
    return;
  }

  $("rcTable").textContent = String(req.table || selectedTable || "-");
  $("rcToken").textContent = String(req.token || "-");
  $("rcReqAt").textContent = String(req.requestedAtText || fmtJst(req.requestedAt) || "-");

  const map = new Map(); // name|price -> {name, price, qty, sub}
  const orders = Array.isArray(req.orders) ? req.orders : [];
  for(const o of orders){
    const items = Array.isArray(o.items) ? o.items : [];
    for(const it of items){
      const name = String(it.name || "");
      const price = Number(it.price || 0);
      const qty = Number(it.qty || 0);
      if(!name || qty<=0) continue;
      const k = name + "|" + price;
      const cur = map.get(k) || { name, price, qty:0, sub:0 };
      cur.qty += qty;
      cur.sub = cur.price * cur.qty;
      map.set(k, cur);
    }
  }
  const lines = Array.from(map.values()).sort((a,b)=> (a.name||"").localeCompare(b.name||"ja"));

  if(lines.length===0){
    $("rcLines").innerHTML = `<div class="muted"><small>明細が空です</small></div>`;
  }else{
    $("rcLines").innerHTML = lines.map(x=>`
      <div class="line">
        <div>
          <div style="font-weight:900">${esc(x.name)}</div>
          <div class="muted" style="font-size:12px;">単価 ${esc(yen(x.price))} / 数量 x${esc(x.qty)}</div>
        </div>
        <div class="mono" style="font-weight:900">${esc(yen(x.sub))}</div>
      </div>
    `).join("");
  }

  $("rcTotal").textContent = yen(Number(req.total||0));
}

function renderSelected(){
  if(!selectedTable){ renderReceipt(null); return; }
  renderReceipt(latestRequests[selectedTable] || null);
}

/* ===== 着席中テーブルだけ表示 ===== */
function buildActiveTableButtons(){
  const root = $("tableGrid");
  root.innerHTML = "";

  // activeSessions の table一覧（tokenあり & active!==false）
  const tables = Object.keys(latestSessions || {}).filter(t=>{
    const s = latestSessions[t];
    return s && s.token && s.active !== false;
  }).sort((a,b)=> Number(a)-Number(b));

  if(tables.length === 0){
    root.innerHTML = `<div class="muted"><small>着席中テーブルがありません</small></div>`;
    return;
  }

  for(const t of tables){
    const btn = document.createElement("button");
    btn.className = "tBtn tOn";
    btn.textContent = "T" + t;

    // 会計依頼があるテーブルは赤
    if(latestRequests[t] && latestRequests[t].token){
      btn.classList.add("tReq");
    }
    if(String(selectedTable) === String(t)){
      btn.classList.add("tSel");
    }

    btn.onclick = ()=>{
      selectedTable = String(t);
      buildActiveTableButtons();
      renderSelected();
    };
    root.appendChild(btn);
  }
}

/* ===== 新規会計依頼の検知 ===== */
function detectNewCheckout(){
  for(const [t, req] of Object.entries(latestRequests)){
    const ra = Number(req?.requestedAt || 0);
    if(!ra) continue;

    const prev = lastReqAt.get(t) || 0;
    if(!prev){
      lastReqAt.set(t, ra); // 初回は通知しない
      continue;
    }
    if(ra > prev){
      lastReqAt.set(t, ra);
      notifyCheckout();
    }
  }
}

/* ===== 更新 ===== */
async function refresh(){
  const shop = getShop();
  if(!shop){
    setStatus(`<span class="ngText">未ログイン</span> menu.html へ戻ります`);
    setTimeout(()=> location.href = `menu.html?v=${Date.now()}`, 400);
    return;
  }
  $("shopText").textContent = shop;

  setStatus(`<span class="mono">loading...</span>`);

  // ① checkoutRequests は必ず読む（ここが命）
  try{
    const reqObj = await rtdbGet(`shops/${encodeURIComponent(shop)}/checkoutRequests`);
    latestRequests = (reqObj && typeof reqObj === "object") ? reqObj : {};
    detectNewCheckout();
  }catch(e){
    // ここが落ちたらアラームも無理なので表示だけ出す
    setStatus(`<span class="ngText">checkoutRequests 読込失敗</span> ${esc(e.message||e)}`);
    latestRequests = {};
  }

  // ② webActiveSessions は “失敗しても落ちない” ようにする（保険）
  try{
    const sessObj = await rtdbGet(`webActiveSessions/${encodeURIComponent(shop)}`);
    latestSessions = (sessObj && typeof sessObj === "object") ? sessObj : {};
  }catch(e){
    // ここが401でも、checkoutRequests の監視は生きる
    latestSessions = {};
    // 画面上には「参考」程度に出す
    setStatus((`<span class="ngText">webActiveSessions 読込失敗</span> ${esc(e.message||e)}`));
  }

  buildActiveTableButtons();
  renderSelected();

  const reqCount = Object.keys(latestRequests).length;
  const sessCount = Object.keys(latestSessions).filter(t=>{
    const s = latestSessions[t];
    return s && s.token && s.active !== false;
  }).length;

  // 両方OKのときはOK表示で上書き
  if(sessCount >= 0){
    setStatus(`<span class="okText">OK</span> 会計依頼:${reqCount} / 着席:${sessCount} （${new Date().toLocaleTimeString()}）`);
  }
}

/* ===== 自動更新 ===== */
function setAuto(){
  const sec = Number($("autoSec").value || 0);
  if(timer){ clearInterval(timer); timer = null; }
  if(sec > 0){
    timer = setInterval(refresh, sec * 1000);
  }
}

/* ===== 会計確定 ===== */
async function confirmCheckout(){
  const shop = getShop();
  if(!shop){ setConfirmMsg(`<span class="ngText">未ログイン</span>`); return; }
  if(!selectedTable){ setConfirmMsg(`<span class="ngText">テーブル未選択</span>`); return; }

  const req = latestRequests[selectedTable];
  if(!req || !req.token){
    setConfirmMsg(`<span class="ngText">このテーブルに会計依頼がありません</span>`);
    return;
  }

  const token = String(req.token || "");
  const ts = Date.now();

  $("btnConfirm").disabled = true;
  setConfirmMsg(`<span class="mono">確定処理中...</span>`);

  try{
    // receipts 保存（控え）
    const receiptKey = `${token}_${ts}`;
    await rtdbPut(`shops/${encodeURIComponent(shop)}/receipts/${encodeURIComponent(receiptKey)}`, {
      shop,
      table: String(selectedTable),
      token,
      settledAt: ts,
      settledAtText: new Date(ts).toLocaleString("ja-JP"),
      total: Number(req.total||0),
      orderCount: Number(req.orderCount||0),
      orders: req.orders || [],
      requestedAt: req.requestedAt || null,
      requestedAtText: req.requestedAtText || null
    });

    // checkoutRequests 削除
    await rtdbPut(`shops/${encodeURIComponent(shop)}/checkoutRequests/${encodeURIComponent(String(selectedTable))}`, null);

    // orders（そのテーブル）削除
    await rtdbPut(`shops/${encodeURIComponent(shop)}/orders/${encodeURIComponent(String(selectedTable))}`, null);

    // webActiveSessions（そのテーブル）削除
    await rtdbPut(`webActiveSessions/${encodeURIComponent(shop)}/${encodeURIComponent(String(selectedTable))}`, null);

    setConfirmMsg(`<span class="okText">会計確定しました</span>（リセット完了）`);
    await refresh();
  }catch(e){
    setConfirmMsg(`<span class="ngText">失敗</span> ${esc(e.message||e)}`);
  }finally{
    $("btnConfirm").disabled = false;
  }
}

/* ===== PDF ===== */
function doPdf(){ window.print(); }

/* ===== bind ===== */
$("btnBack").onclick = ()=> location.href = `menu.html?v=${Date.now()}`;
$("btnRefresh").onclick = refresh;
$("autoSec").onchange = setAuto;
$("btnConfirm").onclick = confirmCheckout;
$("btnPdf").onclick = doPdf;

/* 音ON/OFF */
$("btnSound").onclick = async ()=>{
  soundEnabled = !soundEnabled;
  $("btnSound").textContent = soundEnabled ? "🔔音ON" : "🔔音OFF";
  if(soundEnabled){
    try{
      ensureAudio();
      if(audioCtx && audioCtx.state === "suspended") await audioCtx.resume();
    }catch{}
  }
};
$("btnBeep").onclick = ()=>{
  soundEnabled = true;
  $("btnSound").textContent = "🔔音ON";
  beep3s();
};

setAuto();
refresh();
</script>
</body>
</html>
