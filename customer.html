<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>customer debug</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 18px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin: 12px 0; }
    .btn { display:inline-block; padding: 12px 14px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 700; }
    .btn-primary { background: #2563eb; color: white; }
    .ok { color: #16a34a; font-weight: 800; }
    .ng { color: #dc2626; font-weight: 800; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f7f7f7; padding: 10px; border-radius: 8px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body>
  <h1>customer debug</h1>

  <div class="card">
    <div><b>shop:</b> <span id="shopText" class="mono">-</span></div>
    <div><b>table:</b> <span id="tableText" class="mono">-</span></div>
    <div><b>href:</b> <span id="hrefText" class="mono">-</span></div>
  </div>

  <button id="btnGo" class="btn btn-primary">Firebaseに書き込み → orderへ</button>

  <div class="card" id="resultCard" style="display:none;">
    <div id="resultLine" class="mono"></div>
    <pre id="resultJson" class="mono"></pre>
  </div>

  <script>
    // ====== ここだけ必要なら差し替え ======
    const RTDB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
    // Thunkableへは飛ばさない。注文画面（order.html）へ飛ばす
    const ORDER_URL = "https://bpakishizawa-sketch.github.io/izakaya-relay/order.html";
    // =====================================

    const $ = (id) => document.getElementById(id);

    function getParam(name) {
      const u = new URL(location.href);
      return (u.searchParams.get(name) || "").trim();
    }

    // token生成（例: daboya-1-7284）
    function genToken(shop, table) {
      const n = Math.floor(1000 + Math.random() * 9000);
      return `${shop}-${table}-${n}`;
    }

    function showResult(ok, line, obj) {
      $("resultCard").style.display = "block";
      $("resultLine").innerHTML = ok ? `<span class="ok">OK</span> ${line}` : `<span class="ng">NG</span> ${line}`;
      $("resultJson").textContent = JSON.stringify(obj, null, 2);
    }

    async function rtdbPut(path, data) {
      // Realtime Database REST: .json 必須
      const url = `${RTDB_BASE}/${path}.json`;
      const res = await fetch(url, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const txt = await res.text();
      let json;
      try { json = JSON.parse(txt); } catch { json = { raw: txt }; }
      return { ok: res.ok, status: res.status, json, url };
    }

    // 初期表示
    const shop = getParam("shop");
    const table = getParam("table");
    $("shopText").textContent = shop || "(missing)";
    $("tableText").textContent = table || "(missing)";
    $("hrefText").textContent = location.href;

    // shop/table 無い場合はここで止める
    if (!shop || !table) {
      showResult(false, "missing params: shop / table", {
        example: `${location.origin}${location.pathname}?shop=daboya&table=1`
      });
    }

    $("btnGo").addEventListener("click", async () => {
      if (!shop || !table) return;

      const token = genToken(shop, table);
      const now = Date.now();
      const ua = navigator.userAgent;

      // webActiveSessions/{shop}/{table}
      const payload = {
        shop: shop,
        table: String(table),
        token: token,
        updatedAt: now,
        ua: ua
      };

      // 書き込み
      const path = `webActiveSessions/${encodeURIComponent(shop)}/${encodeURIComponent(table)}`;

      try {
        const r = await rtdbPut(path, payload);

        if (!r.ok) {
          showResult(false, `書き込み失敗: HTTP ${r.status}  ${r.url}`, { payload, response: r.json });
          return;
        }

        showResult(true, `書き込み成功: ${r.url}`, payload);

        // ✅ Thunkableへは飛ばさない。order.htmlへ shop/table/token を渡して遷移
        const jump =
          ORDER_URL +
          `?shop=${encodeURIComponent(shop)}` +
          `&table=${encodeURIComponent(table)}` +
          `&token=${encodeURIComponent(token)}` +
          `&v=${Date.now()}`;

        // デバッグ表示を見たいなら 600 などに。不要なら 0 で即遷移。
        setTimeout(() => { location.href = jump; }, 0);

      } catch (e) {
        showResult(false, "例外エラー", { message: String(e), payload });
      }
    });
  </script>
</body>
</html>
