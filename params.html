<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PARAMS PAGE</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; padding: 24px; }
    pre { background:#f5f5f5; padding: 16px; border-radius: 10px; overflow:auto; }
    .small { color:#666; font-size: 12px; }
  </style>
</head>
<body>
  <h2>PARAMS PAGE</h2>
  <p class="small">shop/table を受け取って Thunkable Web App に転送します。</p>

  <pre id="out">loading...</pre>

  <script>
    // ★ここだけあなたのThunkable URLを入れる（今のやつ）
    const THUNKABLE_WEBAPP_URL = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH";

    const qs = new URLSearchParams(location.search);
    const shop  = qs.get("shop");
    const table = qs.get("table");
    const debug = qs.get("debug") === "1";

    const payload = {
      type: "PARAMS",
      shop: shop,
      table: table,
      raw: location.search || "",
      at: Date.now()
    };

    const out = document.getElementById("out");

    if (!shop || !table) {
      out.textContent =
        "missing params: shop / table\n" +
        "例: ?shop=daboya&table=1\n\n" +
        JSON.stringify(payload, null, 2);
    } else {
      // キャッシュ回避（毎回変わる値）
      const v = Date.now();

      const next =
        THUNKABLE_WEBAPP_URL +
        "?shop=" + encodeURIComponent(shop) +
        "&table=" + encodeURIComponent(table) +
        "&v=" + v;

      if (debug) {
        out.textContent =
          "DEBUG MODE (no redirect)\n\nnext:\n" + next + "\n\n" +
          JSON.stringify(payload, null, 2);
      } else {
        // 本番：Thunkableに飛ぶ
        location.replace(next);
      }
    }
  </script>
</body>
</html>
