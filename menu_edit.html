<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>メニュー編集（店側）</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px;max-width:980px;margin:0 auto;background:#f6f7f9}
    h1{font-size:22px;margin:0 0 10px}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0;background:#fff}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .muted{color:#6b7280;font-size:12px}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}

    button{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;font-weight:900}
    .btn{background:#111827;color:#fff}
    .btn2{background:#e5e7eb;color:#111827}
    .btnBlue{background:#2563eb;color:#fff}
    .btnGreen{background:#16a34a;color:#fff}

    input,select{font-size:16px;padding:10px;border-radius:10px;border:1px solid #d1d5db;background:#fff}
    input{width:100%;box-sizing:border-box}
    .w160{width:160px}
    .w220{width:220px}
    .w260{width:260px}

    .tabs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
    .tab{padding:10px 14px;border-radius:999px;border:1px solid #d1d5db;background:#fff;font-weight:900}
    .tab.on{background:#111827;color:#fff;border-color:#111827}

    .grid2{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:860px){
      .grid2{grid-template-columns:1fr 1fr;}
    }

    .list{display:flex;flex-direction:column;gap:10px}
    .item{
      border:1px solid #e5e7eb;border-radius:12px;padding:10px;
      display:flex;gap:10px;align-items:center;justify-content:space-between;
      background:#fff;
    }
    .left{display:flex;gap:10px;align-items:center;min-width:0}
    .pill{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 10px;border-radius:999px;border:1px solid #d1d5db;font-weight:900;font-size:12px}
    .pillD{background:#dbeafe;border-color:#3b82f6}
    .pillF{background:#dcfce7;border-color:#16a34a}
    .id{font-weight:900}
    .name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
    .price{font-weight:900}
    .hint{font-size:12px;color:#6b7280;line-height:1.6}

    /* 編集欄は「既存選択 or ID手入力で新規」両対応 */
    .editBox{display:grid;grid-template-columns:1fr;gap:10px}
    @media(min-width:860px){
      .editBox{grid-template-columns:260px 240px 1fr 180px 140px}
    }

    /* デバッグは通常非表示 */
    details{margin-top:10px}
    details summary{cursor:pointer;color:#374151;font-weight:900}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:10px;border-radius:10px;overflow:auto}

    /* ===== 印刷最適化 =====
       - 選択カテゴリのみ表示
       - 2列で詰める
       - 行高/余白/フォントを少し詰める
    */
    @media print{
      body{background:#fff;padding:0;max-width:none;margin:0}
      .noPrint{display:none !important;}
      .card{border:0;border-radius:0;margin:0;padding:0}

      h1{margin:0 0 6px;font-size:14px}
      .printTitle{display:block !important;margin:0 0 6px}
      .printTitle .subLine{font-size:10px;color:#555;margin-top:1px}

      /* 重要：印刷時の一覧は2列 */
      .printGrid{
        display:grid !important;
        grid-template-columns:1fr 1fr !important;
        gap:6px !important;
        align-items:start;
      }

      .item{
        break-inside:avoid;page-break-inside:avoid;
        border:1px solid #ddd;border-radius:10px;padding:6px;
      }
      .pill{height:20px;min-width:24px;font-size:10px;padding:0 8px}
      .id{font-size:11px}
      .name{font-size:11px;max-width:220px}
      .price{font-size:11px}
      .left{gap:6px}
    }
    .printTitle{display:none}
    .printHide{display:none !important;}
  </style>
</head>
<body>
  <h1>メニュー編集（店側）</h1>

  <div class="card noPrint">
    <div class="row">
      <div>shop: <b id="shopText" class="mono">-</b></div>
      <div id="status" class="muted">-</div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnBack" class="btn2">← menuへ</button>
      <button id="btnReload" class="btn">再読み込み</button>
      <button id="btnPrintDrink" class="btnBlue">ドリンク印刷</button>
      <button id="btnPrintFood" class="btnGreen">フード印刷</button>
    </div>

    <div class="tabs">
      <button class="tab on" id="tabDrink">ドリンク</button>
      <button class="tab" id="tabFood">フード</button>
      <span class="muted">（一覧タップ → 編集欄に入ります）</span>
    </div>
  </div>

  <div class="printTitle" id="printHeader">
    <div style="font-weight:900;font-size:13px">メニュー一覧（<span id="printCat">-</span>）</div>
    <div class="subLine"><span id="printShop">-</span> / <span id="printTime">-</span></div>
  </div>

  <div class="card noPrint">
    <div style="font-weight:900;margin-bottom:10px">編集</div>

    <div class="editBox">
      <div>
        <div class="muted">既存を選択（プルダウン）</div>
        <select id="selTarget">
          <option value="">（未選択）</option>
        </select>
      </div>

      <div>
        <div class="muted">ID（新規追加はここに入力）</div>
        <input id="inpId" placeholder="例：d12 / f101" />
      </div>

      <div>
        <div class="muted">メニュー名</div>
        <input id="inpName" placeholder="例：レモンサワー" />
      </div>

      <div>
        <div class="muted">価格</div>
        <input id="inpPrice" placeholder="例：450" inputmode="numeric" />
      </div>

      <div class="row" style="align-items:end">
        <button id="btnSave" class="btn">保存</button>
        <button id="btnDelete" class="btn2">削除</button>
        <button id="btnClear" class="btn2">クリア</button>
      </div>
    </div>

    <div class="hint" style="margin-top:8px">
      ・既存編集：プルダウン or 一覧タップ → 編集 → 保存。<br>
      ・新規追加：ID欄に <b>dXX / fXXX</b> を入力 → 名前/価格 → 保存。<br>
      ・空き番号の提案表示はやめました（混乱の元なので）。
    </div>

    <details>
      <summary>デバッグ（必要な時だけ開く）</summary>
      <pre id="debug" class="mono">-</pre>
    </details>
  </div>

  <div class="grid2">
    <div class="card" id="drinkPanel">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:900">一覧（ドリンク）</div>
        <div class="muted">件数: <span id="drinkCount" class="mono">0</span></div>
      </div>
      <div class="list" id="drinkList"></div>
    </div>

    <div class="card" id="foodPanel">
      <div class="row" style="justify-content:space-between">
        <div style="font-weight:900">一覧（フード）</div>
        <div class="muted">件数: <span id="foodCount" class="mono">0</span></div>
      </div>
      <div class="list" id="foodList"></div>
    </div>
  </div>

<script>
/** ====== 設定ここだけ ====== */
const RTDB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
/** ========================= */

const KEY_SHOP = "shopCode"; // localStorage
function lsGet(k){ return (localStorage.getItem(k) || "").trim(); }

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

async function rtdbGet(path){
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url);
  const txt = await res.text();
  let json = null;
  try{ json = JSON.parse(txt || "null"); }catch{ json = null; }
  return { ok: res.ok, status: res.status, json, url };
}
async function rtdbPut(path, data){
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url, { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(data) });
  const txt = await res.text();
  let json = null;
  try{ json = JSON.parse(txt || "null"); }catch{ json = null; }
  return { ok: res.ok, status: res.status, json, url };
}

function parseMenuValue(v){
  if(v && typeof v === "object"){
    return { name: String(v.name ?? ""), price: Number(v.price ?? 0) };
  }
  if(typeof v === "string"){
    return { name: v, price: 0 };
  }
  return { name:"", price:0 };
}

function idNum(id){
  const m = String(id||"").match(/\d+/);
  return m ? Number(m[0]) : 999999;
}

let state = {
  shop: "",
  cat: "drink",
  drink: {}, food: {},
  drinkKeys: [], foodKeys: []
};

function setStatus(html){ $("status").innerHTML = html || ""; }

function setTab(cat){
  state.cat = cat;
  $("tabDrink").classList.toggle("on", cat==="drink");
  $("tabFood").classList.toggle("on", cat==="food");
  rebuildSelect();
  // クリアはしない（切替えても編集途中が消えない方が事故が少ない）
}

function rebuildSelect(){
  // ★ここが修正点：プルダウンは「既存のみ」
  const sel = $("selTarget");
  sel.innerHTML = `<option value="">（未選択）</option>`;
  const keys = (state.cat === "drink") ? state.drinkKeys : state.foodKeys;

  for(const id of keys){
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = id; // 余計な（既存）表示をやめる
    sel.appendChild(opt);
  }
}

function fillEditor(id){
  if(!id) return;
  const src = (state.cat === "drink") ? state.drink : state.food;
  const v = parseMenuValue(src[id]);
  $("selTarget").value = id;
  $("inpId").value = id;
  $("inpName").value = v.name || "";
  $("inpPrice").value = String(v.price ?? 0);
}

function clearEditor(){
  $("selTarget").value = "";
  $("inpId").value = "";
  $("inpName").value = "";
  $("inpPrice").value = "";
}

function renderList(){
  $("drinkCount").textContent = String(state.drinkKeys.length);
  const dWrap = $("drinkList");
  dWrap.innerHTML = "";
  for(const id of state.drinkKeys){
    const v = parseMenuValue(state.drink[id]);
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="left">
        <span class="pill pillD">D</span>
        <div style="min-width:0">
          <div class="id mono">${esc(id)}</div>
          <div class="name">${esc(v.name || "-")}</div>
        </div>
      </div>
      <div class="price mono">${esc(String(v.price||0))}</div>
    `;
    div.onclick = ()=>{
      setTab("drink");
      fillEditor(id);
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    dWrap.appendChild(div);
  }
  if(state.drinkKeys.length === 0){
    dWrap.innerHTML = `<div class="muted"><small>ドリンクがありません</small></div>`;
  }

  $("foodCount").textContent = String(state.foodKeys.length);
  const fWrap = $("foodList");
  fWrap.innerHTML = "";
  for(const id of state.foodKeys){
    const v = parseMenuValue(state.food[id]);
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="left">
        <span class="pill pillF">F</span>
        <div style="min-width:0">
          <div class="id mono">${esc(id)}</div>
          <div class="name">${esc(v.name || "-")}</div>
        </div>
      </div>
      <div class="price mono">${esc(String(v.price||0))}</div>
    `;
    div.onclick = ()=>{
      setTab("food");
      fillEditor(id);
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    fWrap.appendChild(div);
  }
  if(state.foodKeys.length === 0){
    fWrap.innerHTML = `<div class="muted"><small>フードがありません</small></div>`;
  }

  $("debug").textContent = JSON.stringify({
    shop: state.shop,
    drinkKeys: state.drinkKeys.length,
    foodKeys: state.foodKeys.length
  }, null, 2);
}

async function loadAll(){
  const shop = lsGet(KEY_SHOP);
  if(!shop){
    setStatus(`<span class="ng">未ログイン</span> menu.html へ戻ります`);
    setTimeout(()=>location.href=`menu.html?v=${Date.now()}`, 300);
    return;
  }
  state.shop = shop;
  $("shopText").textContent = shop;

  setStatus(`<span class="mono">loading...</span>`);
  const d = await rtdbGet(`shops/${encodeURIComponent(shop)}/menu/drink`);
  const f = await rtdbGet(`shops/${encodeURIComponent(shop)}/menu/food`);

  if(!d.ok || !f.ok){
    setStatus(`<span class="ng">読み込み失敗</span> <span class="muted">(${d.status}/${f.status})</span>`);
    return;
  }

  state.drink = d.json && typeof d.json === "object" ? d.json : {};
  state.food  = f.json && typeof f.json === "object" ? f.json : {};

  state.drinkKeys = Object.keys(state.drink).sort((a,b)=>idNum(a)-idNum(b));
  state.foodKeys  = Object.keys(state.food).sort((a,b)=>idNum(a)-idNum(b));

  rebuildSelect();
  renderList();
  setStatus(`<span class="ok">OK</span>`);
}

function normalizeId(idRaw){
  const id = String(idRaw||"").trim();
  if(!id) return "";
  const low = id.toLowerCase();
  // d / f 以外は弾く（事故防止）
  if(!(low.startsWith("d") || low.startsWith("f"))) return "";
  return low;
}

async function saveCurrent(){
  const id = normalizeId($("inpId").value);
  if(!id){
    setStatus(`<span class="ng">IDが不正です（d12 / f101 の形式）</span>`);
    return;
  }

  const name = ($("inpName").value || "").trim();
  const price = Number(($("inpPrice").value || "0").trim());
  if(!name){
    setStatus(`<span class="ng">メニュー名が空です</span>`);
    return;
  }
  if(!Number.isFinite(price) || price < 0){
    setStatus(`<span class="ng">価格が不正です</span>`);
    return;
  }

  // IDの先頭でカテゴリを決める（編集タブと食い違っても安全）
  const cat = id.startsWith("d") ? "drink" : "food";

  setStatus(`<span class="mono">saving...</span>`);
  const path = `shops/${encodeURIComponent(state.shop)}/menu/${cat}/${encodeURIComponent(id)}`;
  const res = await rtdbPut(path, { name, price });
  if(!res.ok){
    setStatus(`<span class="ng">保存失敗</span> <span class="muted">(${res.status})</span>`);
    return;
  }

  await loadAll();
  setTab(cat);
  fillEditor(id);
  setStatus(`<span class="ok">保存OK</span>`);
}

async function deleteCurrent(){
  const id = normalizeId($("inpId").value);
  if(!id){
    setStatus(`<span class="ng">ID未指定</span>`);
    return;
  }
  const cat = id.startsWith("d") ? "drink" : "food";
  if(!confirm(`${cat} の ${id} を削除しますか？`)) return;

  setStatus(`<span class="mono">deleting...</span>`);
  const path = `shops/${encodeURIComponent(state.shop)}/menu/${cat}/${encodeURIComponent(id)}`;
  const res = await rtdbPut(path, null);
  if(!res.ok){
    setStatus(`<span class="ng">削除失敗</span> <span class="muted">(${res.status})</span>`);
    return;
  }

  clearEditor();
  await loadAll();
  setStatus(`<span class="ok">削除OK</span>`);
}

/* 印刷：選択カテゴリだけ表示 + 2列（printGrid） */
function printOnly(cat){
  $("printCat").textContent = (cat==="drink") ? "ドリンク" : "フード";
  $("printShop").textContent = state.shop || "-";
  $("printTime").textContent = new Date().toLocaleString("ja-JP");

  const drinkPanel = $("drinkPanel");
  const foodPanel = $("foodPanel");

  // パネルの中の list を印刷時だけ2列にする
  $("drinkList").classList.remove("printGrid");
  $("foodList").classList.remove("printGrid");
  if(cat==="drink"){
    $("drinkList").classList.add("printGrid");
  }else{
    $("foodList").classList.add("printGrid");
  }

  drinkPanel.classList.remove("printHide");
  foodPanel.classList.remove("printHide");
  if(cat==="drink") foodPanel.classList.add("printHide");
  else drinkPanel.classList.add("printHide");

  setTimeout(()=>window.print(), 50);

  // 戻す（Safari対策）
  setTimeout(()=>{
    drinkPanel.classList.remove("printHide");
    foodPanel.classList.remove("printHide");
    $("drinkList").classList.remove("printGrid");
    $("foodList").classList.remove("printGrid");
  }, 800);
}

/* ---- event ---- */
$("btnBack").onclick = ()=> location.href = `menu.html?v=${Date.now()}`;
$("btnReload").onclick = loadAll;

$("tabDrink").onclick = ()=> setTab("drink");
$("tabFood").onclick  = ()=> setTab("food");

$("selTarget").onchange = ()=>{
  const id = $("selTarget").value;
  if(id){
    // タブで選択されたカテゴリ内の既存なので、そのまま反映
    fillEditor(id);
  }
};

$("btnSave").onclick = saveCurrent;
$("btnDelete").onclick = deleteCurrent;
$("btnClear").onclick = clearEditor;

$("btnPrintDrink").onclick = ()=> printOnly("drink");
$("btnPrintFood").onclick  = ()=> printOnly("food");

/* init */
setTab("drink");
loadAll();
</script>
</body>
</html>
