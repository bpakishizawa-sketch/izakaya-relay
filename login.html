<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>店側ログイン</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:18px; max-width:720px; margin:0 auto; background:#f6f7f9;}
    h1{font-size:22px;margin:0 0 10px}
    .sub{font-size:12px;color:#6b7280;margin-bottom:14px;line-height:1.6}
    .card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0;background:#fff;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input,button{font-size:16px;padding:12px;border-radius:12px}
    input{border:1px solid #d1d5db; background:#fff; width:100%; box-sizing:border-box}
    button{cursor:pointer;border:0;font-weight:900}
    .btn{background:#111827;color:#fff; min-width:140px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .small{font-size:12px;color:#6b7280}
    .hidden{display:none !important;}
  </style>

  <!-- Firebase (CDN / compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
</head>
<body>
  <h1>店側ログイン</h1>
  <div class="sub">
    shopコード と staffPin を入力してログイン。<br>
    成功すると <b>localStorage</b> に保存して menu.html へ移動します。<br>
    ※裏側で Firebase Authentication も通します（セキュリティ用）
  </div>

  <div class="card">
    <div class="row">
      <input id="shopInp" placeholder="shopコード（例：daboya）" autocomplete="username" />
      <input id="pinInp" placeholder="PIN（例：1111）" inputmode="numeric" autocomplete="current-password" style="max-width:180px" />
      <button id="btnLogin" class="btn">ログイン</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <input id="authEmail" placeholder="Authメール" autocomplete="email" />
      <input id="authPass" placeholder="Authパスワード" type="password" autocomplete="current-password" />
    </div>

    <div id="msg" style="margin-top:10px;" class="small">-</div>
  </div>

<script>
/** ===== 設定（ここだけ） ===== */
const RTDB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";
const firebaseConfig = {
  apiKey: "AIzaSyCZTWH0Lv1EfUiW5iSX1skQ9MvUao6Dx10",
  authDomain: "izakayaorder.firebaseapp.com",
  databaseURL: "https://izakayaorder-default-rtdb.firebaseio.com",
  projectId: "izakayaorder",
  storageBucket: "izakayaorder.firebasestorage.app",
  messagingSenderId: "1083271376500",
  appId: "1:1083271376500:web:248f32d5aa470be087ab21",
  measurementId: "G-009BPY8BFP"
};
/** ============================ */

try{
  firebase.initializeApp(firebaseConfig);
}catch(e){
  // すでに初期化済みでもOK（GitHub Pagesで戻る/進む等）
}
const auth = firebase.auth();

const $ = (id)=>document.getElementById(id);

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function setMsg(html){ $("msg").innerHTML = html; }
function normalizePin(x){
  if(x === null || x === undefined) return "";
  return String(x).trim();
}

/* ===== localStorage ===== */
function lsSetShopLogin(shop, pin){
  localStorage.setItem("shopCode", String(shop||"").trim());
  localStorage.setItem("shopPin",  String(pin||"").trim());
}
function lsSetAuthToken(idToken){
  localStorage.setItem("authIdToken", String(idToken||""));
}

/* ===== RTDB REST ===== */
async function rtdbGet(path){
  const url = `${RTDB_BASE}/${path}.json`;
  const res = await fetch(url, { method:"GET" });
  const txt = await res.text();
  let json = null;
  try{ json = txt ? JSON.parse(txt) : null; }catch{ json = null; }
  return { ok: res.ok, status: res.status, json, url, raw: txt };
}

/* ===== login ===== */
async function doLogin(){
  const shop = ($("shopInp").value || "").trim();
  const pin  = ($("pinInp").value  || "").trim();
  const email= ($("authEmail").value || "").trim();
  const pass = ($("authPass").value  || "").trim();

  if(!shop || !pin){
    setMsg(`<span class="ng">NG</span> shop と PIN を入力してください`);
    return;
  }
  if(!email || !pass){
    setMsg(`<span class="ng">NG</span> Authメール/パスワードも入力してください`);
    return;
  }

  $("btnLogin").disabled = true;
  setMsg(`<span class="mono">確認中...</span>`);

  try{
    // 1) Auth
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const user = cred.user;
    const idToken = await user.getIdToken(true);
    lsSetAuthToken(idToken);

    // 2) PIN確認（今まで通り）
    const staffPinPath = `shops/${encodeURIComponent(shop)}/staffPin`;
    const r = await rtdbGet(staffPinPath);

    if(!r.ok){
      throw new Error(`staffPin取得失敗 HTTP ${r.status} / ${r.raw}`);
    }

    const serverPin = normalizePin(r.json);
    const inputPin  = normalizePin(pin);

    if(!serverPin){
      throw new Error(`staffPin 未設定: /shops/${shop}/staffPin`);
    }
    if(serverPin !== inputPin){
      throw new Error(`PINが違います`);
    }

    // OK
    lsSetShopLogin(shop, inputPin);
    setMsg(`<span class="ok">OK</span> ログインしました → menuへ移動します`);
    setTimeout(()=> location.href = `menu.html?v=${Date.now()}`, 150);

  }catch(e){
    // Firebase Auth は e.code が重要
    const code = e && e.code ? String(e.code) : "";
    const msg  = e && e.message ? String(e.message) : String(e);

    setMsg(
      `<span class="ng">例外エラー</span><br>` +
      `<span class="mono">${esc(code || "(no code)")}</span><br>` +
      `<span class="mono">${esc(msg)}</span>`
    );

    console.log("LOGIN ERROR", e);
    $("btnLogin").disabled = false;
  }
}

$("btnLogin").onclick = doLogin;
$("pinInp").addEventListener("keydown", (e)=>{ if(e.key==="Enter") doLogin(); });
</script>
</body>
</html>
このスレッドで削除されたメールは 1 件あります。 メールを表示、または完全に削除
