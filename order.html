<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>order</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:16px;}
    input,button{font-size:16px;padding:10px;}
    button{cursor:pointer}
    .row{display:flex;gap:8px;align-items:center;margin:8px 0}
    .ok{color:#0a7a2a;font-weight:700}
    .ng{color:#b00020;font-weight:700}
    pre{background:#f5f5f5;padding:12px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
  <h2>注文（仮）</h2>
  <div id="meta"></div>

  <div class="row">
    <input id="item" placeholder="例：レモンサワー" style="flex:1">
    <input id="qty" type="number" min="1" value="1" style="width:90px">
    <button id="add">追加</button>
  </div>

  <pre id="list">[]</pre>

  <div class="row">
    <button id="send" style="flex:1">注文送信</button>
  </div>

  <div id="status"></div>

<script>
const DB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com"; // params_v2と合わせる

function qs(name){
  const u = new URL(location.href);
  return (u.searchParams.get(name) || "").trim();
}

async function postJson(path, obj){
  const url = `${DB_BASE}${path}.json`;
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(obj)
  });
  const text = await res.text();
  if(!res.ok) throw new Error(`HTTP ${res.status} ${text}`);
  return JSON.parse(text);
}

const shop = qs("shop");
const table = qs("table");
const token = qs("token");

const meta = document.getElementById("meta");
meta.innerHTML = `
  <div>shop: <b>${shop||"(none)"}</b></div>
  <div>table: <b>${table||"(none)"}</b></div>
  <div>token: <b style="font-size:12px">${token||"(none)"}</b></div>
`;

if(!shop || !table || !token){
  document.getElementById("status").innerHTML = `<span class="ng">URL params が不足です</span>`;
}

let items = [];
const listEl = document.getElementById("list");

function render(){
  listEl.textContent = JSON.stringify(items, null, 2);
}

document.getElementById("add").onclick = () => {
  const item = document.getElementById("item").value.trim();
  const qty = Number(document.getElementById("qty").value || 1);
  if(!item) return;
  items.push({name:item, qty});
  document.getElementById("item").value = "";
  document.getElementById("qty").value = 1;
  render();
};

document.getElementById("send").onclick = async () => {
  try{
    if(!shop || !table || !token) return;

    if(items.length === 0){
      document.getElementById("status").innerHTML = `<span class="ng">注文が空です</span>`;
      return;
    }

    const ts = Date.now();
    const orderObj = {
      shop, table, token,
      items,
      createdAt: ts
    };

    document.getElementById("status").textContent = "sending...";
    // /orders にpush（POST）で注文ID自動生成
    await postJson(`/orders/${shop}`, orderObj);

    document.getElementById("status").innerHTML = `<span class="ok">送信OK</span>`;
    items = [];
    render();

  }catch(e){
    document.getElementById("status").innerHTML =
      `<span class="ng">送信失敗</span><div style="font-size:12px">${String(e.message||e)}</div>`;
  }
};

render();
</script>
</body>
</html>
