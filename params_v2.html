<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>params_v2</title>

  <!-- Thunkable WebViewer Extension -->
  <script src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js"></script>
</head>

<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial; padding:16px;">
  <h2 style="margin:0 0 12px 0;">params_v2 debug</h2>

  <div id="status" style="margin:10px 0; font-weight:700;"></div>

  <pre id="out" style="background:#f3f3f3; padding:12px; border-radius:10px; white-space:pre-wrap;"></pre>

  <script>
    function parseParamsFromUrl(urlStr) {
      try {
        const u = new URL(urlStr);
        const shop = u.searchParams.get("shop") || "";
        const table = u.searchParams.get("table") || "";
        return { shop, table };
      } catch (e) {
        return { shop: "", table: "" };
      }
    }

    // 1) まず自分のURL（params_v2.html?shop=...）を見て
    const selfParams = parseParamsFromUrl(window.location.href);

    // 2) 無ければ referrer（＝ThunkableのURL）を見る
    const ref = document.referrer || "";
    const refParams = parseParamsFromUrl(ref);

    const shop = selfParams.shop || refParams.shop || "";
    const table = selfParams.table || refParams.table || "";

    const payload = {
      type: "PARAMS",
      shop: shop,
      table: table,
      href: window.location.href,
      referrer: ref,
      ts: Date.now()
    };

    document.getElementById("out").textContent = JSON.stringify(payload, null, 2);

    // Thunkableへ送る（extensionが生きるまで少しリトライ）
    let tries = 0;
    const maxTries = 30;

    function trySend() {
      tries++;

      if (window.ThunkableWebviewerExtension && typeof ThunkableWebviewerExtension.postMessage === "function") {
        ThunkableWebviewerExtension.postMessage(JSON.stringify(payload));
        document.getElementById("status").textContent = "✅ postMessage sent to Thunkable";
        document.getElementById("status").style.color = "#0a8f08";
        return;
      }

      if (tries >= maxTries) {
        document.getElementById("status").textContent = "❌ Thunkable extension not found（WebViewer外で開いてる可能性）";
        document.getElementById("status").style.color = "#c40000";
        return;
      }

      setTimeout(trySend, 100);
    }

    trySend();
  </script>
</body>
</html>
