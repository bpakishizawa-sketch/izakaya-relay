<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>店側ログイン</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;padding:16px;max-width:720px;margin:0 auto}
    .card{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:12px 0;background:#fff}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    input{font-size:16px;padding:10px;border-radius:12px;border:1px solid #ccc}
    button{font-size:16px;padding:12px 14px;border-radius:12px;border:0;cursor:pointer;font-weight:900;background:#111827;color:#fff}
    .ok{color:#16a34a;font-weight:900}
    .ng{color:#dc2626;font-weight:900}
    .muted{color:#6b7280;font-size:12px;line-height:1.6}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    a{color:#2563eb}
  </style>
</head>
<body>
  <h2>店側ログイン</h2>

  <div class="card">
    <div class="row">
      <input id="shop" placeholder="shopコード（例：daboya）" style="flex:1;min-width:240px">
      <input id="pin"  placeholder="PIN（数字/英字OK）" style="width:200px">
      <button id="btnLogin" type="button">ログイン</button>
    </div>
    <div id="msg" class="muted">この端末に shopCode / shopPin を保存します。</div>
  </div>

  <div class="card">
    <div class="muted">
      保存キー：<span class="mono">localStorage.shopCode</span> / <span class="mono">localStorage.shopPin</span><br>
      既にログイン済みの場合は自動で menu.html に移動します。
    </div>
  </div>

<script>
  const KEY_SHOP = "shopCode";
  const KEY_PIN  = "shopPin";

  const $ = (id)=>document.getElementById(id);

  function getShop(){ return (localStorage.getItem(KEY_SHOP)||"").trim(); }
  function getPin(){  return (localStorage.getItem(KEY_PIN)||"").trim(); }

  function goMenu(){
    location.href = `menu.html?v=${Date.now()}`;
  }

  // 既にログイン済みなら menuへ
  if(getShop() && getPin()){
    goMenu();
  }

  $("btnLogin").addEventListener("click", ()=>{
    const shop = ($("shop").value||"").trim();
    const pin  = ($("pin").value||"").trim();

    if(!shop || !pin){
      $("msg").innerHTML = `<span class="ng">shop と PIN を入力してください</span>`;
      return;
    }

    localStorage.setItem(KEY_SHOP, shop);
    localStorage.setItem(KEY_PIN, pin);

    $("msg").innerHTML = `<span class="ok">OK</span> 保存しました：shop=<span class="mono">${shop}</span>`;
    goMenu();
  });
</script>
</body>
</html>
