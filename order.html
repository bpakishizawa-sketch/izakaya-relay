<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注文</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:16px;}
    .card{border:1px solid #e5e5e5;border-radius:12px;padding:12px;margin:12px 0;}
    select,input,button{font-size:16px;padding:10px;}
    button{cursor:pointer;border:0;border-radius:10px;padding:12px 14px;font-weight:700}
    .btn{background:#2563eb;color:#fff;width:100%}
    .btn2{background:#e5e7eb;color:#111;width:100%}
    .row{display:flex;gap:10px;align-items:center;margin:10px 0}
    .ok{color:#0a7a2a;font-weight:800}
    .ng{color:#b00020;font-weight:800}
    pre{background:#f5f5f5;padding:12px;border-radius:10px;overflow:auto;white-space:pre-wrap;word-break:break-word}
    small{color:#666}
  </style>
</head>
<body>
  <h2>注文</h2>

  <div class="card" id="meta"></div>

  <div class="card">
    <div class="row">
      <select id="menuSel" style="flex:1">
        <option value="">メニューを選択</option>
      </select>
      <input id="qty" type="number" min="1" value="1" style="width:90px">
    </div>

    <div class="row">
      <button id="addBtn" class="btn2">カートに追加</button>
    </div>

    <div class="card">
      <b>カート</b>
      <pre id="cartPre">[]</pre>
      <div id="sumLine"></div>
    </div>

    <div class="row">
      <button id="sendBtn" class="btn">注文送信</button>
      <button id="clearBtn" class="btn2">クリア</button>
    </div>

    <div id="status"></div>
    <div id="menuStatus" style="margin-top:8px;"></div>
  </div>

<script>
const DB_BASE = "https://izakayaorder-default-rtdb.firebaseio.com";

const $ = (id)=>document.getElementById(id);

function qs(name){
  const u = new URL(location.href);
  return (u.searchParams.get(name) || "").trim();
}

async function getJson(path){
  const url = `${DB_BASE}${path}.json`;
  const res = await fetch(url);
  const text = await res.text();
  if(!res.ok) throw new Error(`GET HTTP ${res.status} ${text}`);
  return text ? JSON.parse(text) : null;
}

async function postJson(path, obj){
  const url = `${DB_BASE}${path}.json`;
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(obj)
  });
  const text = await res.text();
  if(!res.ok) throw new Error(`POST HTTP ${res.status} ${text}`);
  return text ? JSON.parse(text) : null;
}

// id: d1 / f103 などを数字として取り出す
function idNumber(id){
  const m = String(id||"").match(/\d+/);
  return m ? Number(m[0]) : 999999;
}

// drink/foodの順→id番号順
function sortMenu(a,b){
  const catOrder = (c)=> c==="drink" ? 0 : (c==="food" ? 1 : 9);
  const ca = catOrder(a.cat), cb = catOrder(b.cat);
  if(ca !== cb) return ca - cb;
  const na = idNumber(a.id), nb = idNumber(b.id);
  if(na !== nb) return na - nb;
  return String(a.name||"").localeCompare(String(b.name||""), "ja");
}

const shop = qs("shop");
const table = qs("table");
const token = qs("token");
const v = qs("v");

$("meta").innerHTML = `
  <div><b>shop:</b> ${shop||"(none)"}</div>
  <div><b>table:</b> ${table||"(none)"}</div>
  <div><b>token:</b> <small>${token||"(none)"}</small></div>
  <div><small>URL: ${location.href}</small></div>
`;

if(!shop || !table || !token){
  $("status").innerHTML = `<span class="ng">URL params が不足です（shop/table/token）</span>`;
}

let menuAll = [];   // [{id,cat,name,price}]
let cart = [];      // [{id,cat,name,price,qty}]

function renderCart(){
  $("cartPre").textContent = JSON.stringify(cart, null, 2);
  const total = cart.reduce((s,x)=>s + (Number(x.price)||0) * (Number(x.qty)||0), 0);
  $("sumLine").innerHTML = `<div><b>合計:</b> ${total}</div>`;
}

function buildMenuOptions(){
  const sel = $("menuSel");
  sel.innerHTML = `<option value="">メニューを選択</option>`;
  for(const m of menuAll){
    const label = `${m.id} / ${m.name} (${m.price}) [${m.cat}]`;
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = label;
    sel.appendChild(opt);
  }
}

async function loadMenu(){
  try{
    if(!shop) return;
    const drinkObj = await getJson(`/shops/${encodeURIComponent(shop)}/menu/drink`);
    const foodObj  = await getJson(`/shops/${encodeURIComponent(shop)}/menu/food`);

    const arr = [];
    if(drinkObj){
      for(const [id, v] of Object.entries(drinkObj)){
        // v が {name,price} でも文字列でも吸収
        const name = (v && typeof v === "object") ? (v.name ?? "") : String(v||"");
        const price = (v && typeof v === "object") ? Number(v.price ?? 0) : 0;
        arr.push({id, cat:"drink", name, price});
      }
    }
    if(foodObj){
      for(const [id, v] of Object.entries(foodObj)){
        const name = (v && typeof v === "object") ? (v.name ?? "") : String(v||"");
        const price = (v && typeof v === "object") ? Number(v.price ?? 0) : 0;
        arr.push({id, cat:"food", name, price});
      }
    }

    arr.sort(sortMenu);
    menuAll = arr;
    buildMenuOptions();
    $("menuStatus").innerHTML = `<span class="ok">メニュー読み込みOK</span>（${menuAll.length}件）`;
  }catch(e){
    $("menuStatus").innerHTML = `<span class="ng">メニュー読み込み失敗</span><div><small>${String(e.message||e)}</small></div>`;
  }
}

$("addBtn").onclick = ()=>{
  const id = $("menuSel").value;
  const qty = Number($("qty").value || 1);
  if(!id) return;

  const m = menuAll.find(x=>x.id===id);
  if(!m) return;

  // 同一idは数量加算
  const found = cart.find(x=>x.id===id);
  if(found){
    found.qty = Number(found.qty||0) + qty;
  }else{
    cart.push({id:m.id, cat:m.cat, name:m.name, price:m.price, qty});
  }
  renderCart();
};

$("clearBtn").onclick = ()=>{
  cart = [];
  renderCart();
  $("status").textContent = "";
};

$("sendBtn").onclick = async ()=>{
  try{
    if(!shop || !table || !token) return;

    if(cart.length === 0){
      $("status").innerHTML = `<span class="ng">カートが空です</span>`;
      return;
    }

    const createdAt = Date.now();
    const ua = navigator.userAgent;
    const total = cart.reduce((s,x)=>s + (Number(x.price)||0) * (Number(x.qty)||0), 0);

    // 注文本体（ordersに保存する“正”のデータ）
    const orderObj = {
      shop,
      table: String(table),
      token,
      createdAt,
      ua,
      items: cart,
      total,
      status: "new"
    };

    $("status").textContent = "sending...";

    // 1) shops/{shop}/orders/{table} にPOSTして pushId を取得（必須）
    const ordersPath =
      `/shops/${encodeURIComponent(shop)}/orders/${encodeURIComponent(String(table))}`;
    const ordersRes = await postJson(ordersPath, orderObj);

    // Firebase REST POST の戻りは { name: "-OqX..." } が基本
    const orderKey = (ordersRes && ordersRes.name) ? String(ordersRes.name) : "";

    // フィード（店側の一覧用：軽量＋ordersへの参照を持つ）
    const feedObj = {
      shop,
      table: String(table),
      token,
      createdAt,
      status: "new",
      total,
      itemsCount: cart.reduce((n,x)=>n + (Number(x.qty)||0), 0),
      orderKey,
      orderPath: orderKey ? `${ordersPath}/${orderKey}` : ordersPath
    };

    // 2) shops/{shop}/orderFeed にPOST（必須：方式A）
    const feedPath = `/shops/${encodeURIComponent(shop)}/orderFeed`;
    await postJson(feedPath, feedObj);

    // 3) 全店集約（任意：必要になったらコメントアウト解除）
    // await postJson(`/orderFeedAll`, feedObj);

    $("status").innerHTML = `<span class="ok">送信OK</span>`;
    cart = [];
    renderCart();

  }catch(e){
    $("status").innerHTML = `<span class="ng">送信失敗</span><div><small>${String(e.message||e)}</small></div>`;
  }
};

renderCart();
loadMenu();
</script>
</body>
</html>
