<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>izakaya-relay</title>
</head>
<body style="margin:0">
  <div id="msg" style="padding:16px;font-family:sans-serif;white-space:pre-wrap;">
    読み込み中…
  </div>

<script>
const FIREBASE_DB_URL = "https://izakayaorder-default-rtdb.firebaseio.com";
const THUNKABLE_URL   = "https://thunkable.site/w/04B1h--YNF8YZthXS2grH"; // あなたのWebアプリURL
const msg = (t) => document.getElementById("msg").textContent = t;

const params = new URLSearchParams(location.search);
const shop   = params.get("shop");
const table  = params.get("table");
const debug  = params.get("debug") === "1";

if (!shop || !table) {
  msg("missing params: shop / table\n例: ?shop=daboya&table=1");
  throw new Error("missing params");
}

const activeUrl = `${FIREBASE_DB_URL}/webActiveSessions/${encodeURIComponent(shop)}/${encodeURIComponent(table)}.json`;

function token4() {
  return String(Math.floor(1000 + Math.random() * 9000));
}
function makeToken(shop, table) {
  const t4 = token4();
  return { token: `${shop}-${table}-${t4}`, token4: t4 };
}

async function fetchJson(url) {
  const r = await fetch(url, { method: "GET" });
  const txt = await r.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
  return { ok: r.ok, status: r.status, data, raw: txt };
}

async function putJson(url, body) {
  const r = await fetch(url, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const txt = await r.text();
  if (!r.ok) throw new Error(txt || ("HTTP " + r.status));
  return txt;
}

(async () => {
  msg("active確認中…");

  // 1) 既存activeがあれば再利用（上書きしない）
  const cur = await fetchJson(activeUrl);
  if (!cur.ok) {
    msg("active GET失敗（Rules/URL）\nstatus=" + cur.status + "\n" + cur.raw);
    return;
  }

  let active = cur.data;
  let tok;

  if (active && active.token) {
    msg("既存activeを再利用…\n" + JSON.stringify(active, null, 2));
    tok = { token: active.token, token4: active.token4 || (String(active.token).split("-").pop() || "") };
  } else {
    // 2) activeが無いなら新規発行して作成
    msg("activeなし → 新規発行中…");
    tok = makeToken(shop, table);

    const sessionUrl = `${FIREBASE_DB_URL}/webSessions/${encodeURIComponent(tok.token)}.json`;

    const sessionPayload = { shop, table, token: tok.token, token4: tok.token4, createdAt: Date.now() };
    const activePayload  = { token: tok.token, token4: tok.token4, updatedAt: Date.now() };

    await putJson(sessionUrl, sessionPayload);
    await putJson(activeUrl,  activePayload);

    msg("作成OK\n" + JSON.stringify(activePayload, null, 2));
  }

  const nextUrl = `${THUNKABLE_URL}?shop=${encodeURIComponent(shop)}&table=${encodeURIComponent(table)}&v=${Date.now()}`;

  if (debug) {
    msg(msg.textContent + "\n\nnext:\n" + nextUrl);
    return;
  }

  // 3) Thunkableへ遷移（#じゃなく ? を使う！）
  location.replace(nextUrl);
})().catch((e) => {
  console.error(e);
  msg("失敗: " + (e && e.message ? e.message : String(e)));
});
</script>
</body>
</html>
